<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de Cotizaciones · Techvalue (prototipo)</title>
<!--
  PROTOTIPO NAVEGABLE — Techvalue S.A.
  Archivo único y autocontenido: HTML + CSS + JavaScript, sin dependencias externas.
  Toda la data es ficticia y se genera al cargar (semilla fija, fechas relativas a hoy).
  Los cambios viven solo en memoria: al recargar la página se vuelve a la demo.

  Capas del JavaScript (ver README.md):
    0. Config     → catálogos y parámetros del negocio
    1. Util       → fechas, días hábiles, formatos, aleatorio con semilla
    2. DemoData   → generador de data ficticia (se reemplaza por la API)
    3. Repo       → capa de datos (única puerta de lectura/escritura; reemplazable por llamadas HTTP)
    4. Rules      → reglas de negocio puras (probabilidad, ponderado, horizontes, alertas, permisos…)
    5. SelfTest   → autoverificación de reglas (se ejecuta en la consola)
    6. UI         → pantallas, enrutador, modales y gráficos SVG
-->
<style>
:root{
  --brand:#015088; --brand-700:#013a63; --brand-600:#01446f; --brand-400:#2f77ab; --brand-200:#a9c9e2; --brand-100:#d6e6f2; --brand-50:#edf4fa;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f8fafc; --border:#dce2ea; --border-2:#c7d0db;
  --text:#1b2530; --text-2:#4a5767; --muted:#738195;
  --ok:#0c6b37; --ok-bg:#e5f3ea; --warn:#8a5300; --warn-bg:#fff3dc; --bad:#b42318; --bad-bg:#fdecea; --info:#01446f; --info-bg:#eaf2fa;
  --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#eda100; --v5:#e87ba4;
  --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --font:"Century Gothic","CenturyGothic","AppleGothic","URW Gothic L","URW Gothic","Avant Garde","Futura","Segoe UI",Arial,sans-serif;
  --topbar-h:56px; --bottomnav-h:62px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--brand)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:700}
h3{font-size:14px;margin:0;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px} .nowrap{white-space:nowrap} .right{text-align:right} .center{text-align:center}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hidden{display:none!important}

/* ---------- Estructura ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar-h);background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap;min-width:0}
.logo-mark{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.logo small{display:block;font-weight:400;opacity:.8;font-size:11px;letter-spacing:0}
.logo-img{display:flex;align-items:center;height:36px;padding:4px 10px;background:#fff;border-radius:8px;flex:none}
.logo-img img{height:100%;width:auto;display:block}
.login-logo{height:56px;width:auto;flex:none}
.logo-text{overflow:hidden;text-overflow:ellipsis}
.demo-badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 8px;font-size:11px;white-space:nowrap}
.topbar .spacer{flex:1}
.icon-btn{position:relative;background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn svg{width:22px;height:22px}
.badge-count{position:absolute;top:3px;right:2px;background:#e5484d;color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border:2px solid var(--brand)}
.user-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;max-width:220px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:#fff;color:var(--brand);flex:none}
.avatar.sm{display:inline-grid;width:24px;height:24px;font-size:10px;vertical-align:middle;margin-right:8px}
#opp-table{min-width:1180px}
#opp-table td.c-w{min-width:180px}
.user-btn .uname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.popover{position:absolute;top:calc(var(--topbar-h) - 4px);right:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:min(380px,calc(100vw - 24px));z-index:60;overflow:hidden}
.popover header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.popover .pop-body{max-height:60vh;overflow:auto}
.popover .pop-item{display:block;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--border);background:none;cursor:pointer}
.popover .pop-item:hover{background:var(--surface-2)}
.popover footer{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}

.shell{display:flex;min-height:calc(100vh - var(--topbar-h))}
.sidenav{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow:auto}
.sidenav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:600;margin-bottom:2px}
.sidenav a:hover{background:var(--surface-2);color:var(--text)}
.sidenav a.active{background:var(--brand-50);color:var(--brand)}
.sidenav a svg{width:18px;height:18px;flex:none}
.sidenav .nav-sep{height:1px;background:var(--border);margin:10px 6px}
.sidenav .nav-foot{font-size:11px;color:var(--muted);padding:8px 12px}
main#view{flex:1;min-width:0;padding:22px 24px 40px;max-width:1360px}
.bottomnav{display:none}

body.logged-out .topbar .needs-auth, body.logged-out .sidenav, body.logged-out .bottomnav{display:none!important}
body.logged-out main#view{max-width:none;padding:0}

/* ---------- Componentes ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head p{margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head .sub{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stack > * + *{margin-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.icon-btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7fb2dc;outline-offset:1px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--surface);border-color:#e7a19b;color:var(--bad)}
.btn.bad:hover{background:var(--bad-bg)}
.btn.warn{border-color:#e8c27a;color:var(--warn)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;min-height:30px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:#b9dfc8;color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:#f0d39b;color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:#f2c0bb;color:var(--bad)}
.chip.info{background:var(--info-bg);border-color:var(--brand-100);color:var(--info)}
.chip.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.op-header .chip,.op-meta .chip,.alert .chip{white-space:normal;max-width:100%}
.stage{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;white-space:nowrap}
.stage .dot{width:8px;height:8px;border-radius:50%;background:var(--brand-400);flex:none}
.seg{font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;border:1px solid var(--border-2);color:var(--text-2);vertical-align:middle}
.seg.T1{background:var(--brand);border-color:var(--brand);color:#fff}
.seg.T2{background:var(--brand-100);border-color:var(--brand-200);color:var(--brand-700)}

.alert{border-radius:var(--radius-sm);padding:10px 12px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.alert.info{background:var(--info-bg);border-color:var(--brand-100);color:var(--brand-700)}
.alert.warn{background:var(--warn-bg);border-color:#f0d39b;color:#6b4100}
.alert.bad{background:var(--bad-bg);border-color:#f2c0bb;color:#8c1d13}
.alert.ok{background:var(--ok-bg);border-color:#b9dfc8;color:#0a5a2e}
.alert > div{flex:1;min-width:0}
.sim-label{display:inline-block;background:#fff4c2;color:#6b5200;border:1px dashed #d9b84a;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}

/* Formularios */
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--text-2);min-width:0}
label.field .req{color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;border:1px solid var(--border-2);border-radius:8px;padding:8px 10px;background:#fff;min-height:38px;font-weight:400;color:var(--text)}
textarea{min-height:64px;resize:vertical}
input.invalid,select.invalid,textarea.invalid{border-color:var(--bad);background:#fff8f7}
.field-hint{font-weight:400;color:var(--muted);font-size:11px}
.field-err{font-weight:600;color:var(--bad);font-size:11px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.radio-chips{display:flex;flex-wrap:wrap;gap:6px}
.radio-chips label{cursor:pointer}
.radio-chips input{position:absolute;opacity:0;pointer-events:none}
.radio-chips span{display:inline-block;border:1px solid var(--border-2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;background:#fff}
.radio-chips input:checked + span{background:var(--brand);border-color:var(--brand);color:#fff}
.radio-chips input:focus-visible + span{outline:3px solid #7fb2dc}

/* Tablas */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);text-align:left;font-weight:700;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--brand)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover td{background:var(--brand-50)}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--border)}
.tbl .r{text-align:right}
.tbl tr.me td{background:#fffbea}
.tbl .cell-main{font-weight:600}
.tbl .cell-sub{font-size:12px;color:var(--muted)}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .k-label{font-size:12px;color:var(--text-2);font-weight:600}
.kpi .k-value{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.vt{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:700;font-size:12px}
.vt i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
.meter{height:10px;background:var(--brand-50);border-radius:999px;overflow:hidden;margin-top:10px;border:1px solid var(--brand-100)}
.meter > span{display:block;height:100%;background:var(--brand);border-radius:999px}
.meter.big{height:16px}
.meter.ok > span{background:var(--ok)}

/* Barras HTML (funnel, motivos, marcas) */
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:18px;position:relative}
.hbar .fill{height:100%;background:var(--brand);border-radius:0 4px 4px 0;min-width:2px}
.hbar .fill.alt{background:var(--brand-200)}
.hbar .val{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:150px}
.hbar .val small{color:var(--muted)}

/* SVG charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--text-2)}
.chart .grid line{stroke:#e6eaf0}
.chart .bar{cursor:default}
.chart .tip{position:absolute;pointer-events:none;background:#1b2530;color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--shadow-lg);z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-2);margin-top:8px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .ln{display:inline-block;width:16px;height:0;border-top:2px dashed #4a5767;margin-right:6px;vertical-align:3px}

/* Mi día */
.hero-progress{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center}
.hero-amount{font-size:28px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mini-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;min-width:0}
.mini-stat .l{font-size:11px;color:var(--text-2);font-weight:600}
.mini-stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-pill{display:inline-flex;align-items:center;gap:8px;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-700);border-radius:999px;padding:4px 12px;font-weight:700;text-decoration:none}
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.list-card > header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.list-card > header .count{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}
.list-card > header .count.bad{background:var(--bad)} .list-card > header .count.warn{background:#c27a00}
.list-card > header .hint{margin-left:auto;font-size:11px;color:var(--muted)}
.list-empty{padding:14px;color:var(--muted);font-size:13px}
.op-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.op-item:last-child{border-bottom:0}
.op-item .op-main{flex:1 1 260px;min-width:0;cursor:pointer;text-decoration:none;color:inherit}
.op-item .op-title{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.op-item .op-sub{font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-item .op-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.op-item .op-actions{display:flex;gap:6px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.quick .btn{min-height:44px;flex-direction:column;gap:2px;font-size:12px;padding:6px}
.quick .btn svg{width:18px;height:18px}

/* Ficha */
.op-header{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.op-header h1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.fact{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;min-width:0}
.fact .l{font-size:11px;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;gap:4px}
.fact .v{font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact select,.fact input{margin-top:4px;min-height:34px;padding:5px 8px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border)}
.timeline li:last-child{border-bottom:0}
.timeline .t-date{font-size:12px;color:var(--text-2);font-weight:600}
.quote{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.quote + .quote{margin-top:12px}
.quote > header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.quote.vigente{border-color:var(--brand-200);box-shadow:0 0 0 2px var(--brand-50)}
.quote .q-body{padding:10px 12px}
.quote dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin:0 0 10px}
.quote dt{font-size:11px;color:var(--muted);font-weight:600}
.quote dd{margin:0;font-size:13px}
.totals{display:grid;grid-template-columns:auto auto;gap:2px 16px;justify-content:end;font-size:13px;margin-top:8px}
.totals .t{color:var(--text-2)} .totals .grand{font-weight:700}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.step{border:1px solid var(--border);border-radius:8px;padding:9px;background:var(--surface-2);min-width:0}
.step.done{background:var(--ok-bg);border-color:#b9dfc8}
.step.next{border-color:var(--brand-200);background:var(--brand-50)}
.step .s-n{font-size:11px;font-weight:700;color:var(--text-2)}
.step .s-t{font-weight:700;font-size:12px;margin:2px 0 6px;min-height:32px}
.step input{min-height:32px;padding:4px 6px;font-size:12px}

/* Modal y toast */
.modal-back{position:fixed;inset:0;background:rgba(15,23,33,.48);z-index:115;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(820px,100%)}
.modal > header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .m-body{padding:16px 18px;overflow:auto}
.modal > footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast-root{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 24px)}

        let desc = c.findIndex((x, j) => j !== cod && j !== precio && j !== marca && /desc|product name|nombre/i.test(x));

    if (r.descuentoPct > 0 && !r.descuentoLeido) r.avisos.push(`Descuento de ${r.descuentoPct} % deducido de los totales del PDF.`);
    if (!r.items.length) r.avisos.push('No se pudieron leer los ítems: agrégalos a mano.');
    if (!r.cliente.ruc) r.avisos.push('No se encontró el RUC del cliente en el PDF.');

    const pickPlazo = () => R.w([['stock',12],['2-3',22],['3-5',14],['3-6',10],['4-6',12],['6-8',12],['6-10',6],['8-10',5],['10-12',4],['12-16',2],['16-18',1],['22-24',0.5]]);

    const pickValidez = () => R.w([[5,3],[7,4],[10,3],[15,2],[30,1]]);
    const pickMarca = () => R.w(PESO_MARCA);
    function buildItems(objetivo, marca) {
      const lineas = objetivo < 1200 ? R.int(1, 2) : R.int(1, 4);
      const items = []; let resto = objetivo;
      for (let i = 0; i < lineas && resto > 0; i++) {
        const m = i === 0 ? marca : (R.chance(0.7) ? marca : pickMarca());
        const prods = CATALOGO.filter(p => p.marca === m && !items.some(it => it.codigo === p.codigo));
        if (!prods.length) continue;
        const ultimo = i === lineas - 1;
        const cand = prods.filter(p => p.precio <= Math.max(resto, 60));
        const p = R.pick(cand.length ? cand : prods);
        const parte = ultimo ? resto : resto * (0.35 + R.f() * 0.4);
        const cant = Math.max(1, Math.round(parte / p.precio));

        items.push({ cant, unidad: 'Und', codigo: p.codigo, marca: m, descripcion: p.descripcion, valorUnit: vu });

    const yymmdd = f => f.slice(2, 4) + f.slice(5, 7) + f.slice(8, 10);

    function makeQuote(opp, fecha, itemsUSD, o) {

    const pickCanal = () => R.w([['WhatsApp',45],['Llamada',30],['Correo',15],['Visita',5],['Reunión',5]]);

    /* spec: { vid, cliente, proyectoId, inicio, monto, marca, etapa, fin, revisiones, alternativa, ... } */
    function crearOportunidad(s) {
      const cli = s.cliente || elegirCliente(s.vid);
      const opp = { id: 'OP-' + (++db.seq.opp), clienteId: cli.id, proyectoId: s.proyectoId || (R.chance(0.5) ? proyectoPrivado() : 'PR-DIRECTA'),
        vendedorId: s.vid, etapa: s.etapa || 'e1', fechaInicio: s.inicio, fechaOC: s.fechaOC || null, proxContacto: s.prox || null,
        motivoPerdida: null, motivoOtro: '', fechaReactivacion: null, fechaCierre: null, postventa: null,
        origen: s.origen || (R.chance(0.85) ? 'correo' : 'manual'), pendiente: !!s.pendiente };
      db.opps.push(opp);
      const marca = s.marca || pickMarca();
      const items = buildItems(s.monto, marca);
      const base = { moneda: s.moneda || (R.chance(0.83) ? 'USD' : 'PEN'), condicionPago: s.pago || pickPago(), validezDias: s.validez || pickValidez(),
        plazo: s.plazo || pickPlazo(), contacto: R.pick(cli.contactos).nombre, descPct: R.chance(0.2) ? R.int(3, 8) / 100 : 0, origen: opp.origen };
      const n = ++contador[s.vid];
      const fmt = FORMATOS[s.vid];
      const qs = [makeQuote(opp, s.inicio, items, Object.assign({}, base, { numero: fmt(s.inicio, n, 0) }))];
      addFu(opp, s.inicio, 'Correo', opp.origen === 'correo' ? 'Cotización enviada (registrada automáticamente desde el correo).' : 'Cotización enviada (registrada manualmente).', null, true);
      const fin = s.fin || s.inicio;
      const span = diffDays(s.inicio, fin);
      let revs = span >= 4 ? (s.revisiones || 0) : 0;
      let itemsRev = items;
      for (let k = 1; k <= revs; k++) {
        const fr = nextBizDay(addDays(s.inicio, Math.max(1, Math.round(span * k / (revs + 1)))));
        if (fr > fin) break;
        const f = R.f();
        itemsRev = itemsRev.map(it => Object.assign({}, it, {
          valorUnit: Util.round2(it.valorUnit * (f < 0.6 ? (0.93 + R.f() * 0.05) : 1)),
          cant: f >= 0.6 ? Math.max(1, it.cant + R.int(-1, 3)) : it.cant }));
        qs.push(makeQuote(opp, fr, itemsRev, Object.assign({}, base, { numero: fmt(s.inicio, n, k), revision: 'R' + k, tipo: 'revision',
          plazo: R.chance(0.25) ? pickPlazo() : base.plazo })));
        addFu(opp, fr, 'Correo', `Revisión R${k} enviada (${f < 0.6 ? 'ajuste de precio' : 'cambio de cantidades'}).`, null, true);
      }
      if (s.alternativa && ALTERNATIVA[marca]) {
        const alt = ALTERNATIVA[marca];
        const prods = CATALOGO.filter(p => p.marca === alt);
        const altItems = items.map(it => { const p = R.pick(prods); return { cant: it.cant, unidad: 'Und', codigo: p.codigo, marca: alt, descripcion: p.descripcion,
          valorUnit: Util.round2(Math.max(p.precio, it.valorUnit * (0.85 + R.f() * 0.2))) }; });
        const fa = s.inicio;
        qs.push(makeQuote(opp, fa, altItems, Object.assign({}, base, { numero: fmt(s.inicio, n, 0) + '-ALT', revision: 'ALT', tipo: 'alternativa' })));
      }
      const principales = qs.filter(q => q.tipo !== 'alternativa');
      (s.altVigente ? qs[qs.length - 1] : principales[principales.length - 1]).vigente = true;
      opp._ultimoNumero = principales[principales.length - 1].numero;
      return opp;
    }
    const vigenteQ0 = opp => db.quotes.find(q => q.oppId === opp.id && q.vigente);
    const netoUSD = opp => Rules.quoteNetoUSD(vigenteQ0(opp));
    const vigenteQ = opp => db.quotes.find(q => q.oppId === opp.id && q.vigente);

    function seguimientos(opp, desde, hasta, ultimaNota, proxFinal) {
      const fechas = [];
      let d = addBizDays(desde, R.int(1, 3));
      while (d < hasta) { fechas.push(d); d = addBizDays(d, R.int(2, 7)); }
      if (hasta > desde) fechas.push(hasta);

        const last = i === fechas.length - 1;

    function postventa(opp, oc, factura) {
      const q = vigenteQ(opp);
      const sem = plazoPorId(q.plazo).maxSemanas;
      const pv = { oc };
      const pasos = {
        pedido: sem ? nextBizDay(addDays(oc, 1)) : oc,
        transito: sem ? addDays(oc, Math.round(sem * 7 * 0.45)) : oc,
        recibido: sem ? addDays(factura, -2) : oc,
        entregado: factura,
        facturado: factura,
      };
      Object.keys(pasos).forEach(k => { if (pasos[k] <= hoy) pv[k] = pasos[k]; });
      if (pv.facturado) pv.facturaMonto = netoUSD(opp);
      const cp = q.condicionPago;
      if ((cp === 'abono' || cp === '50_50') && oc <= hoy) pv.adelantoCobrado = oc;
      let cobro = cp === 'abono' ? oc : (cp === 'factura30' || cp === 'cheque30') ? addDays(factura, 30) : factura;
      cobro = nextBizDay(addDays(cobro, cp === 'abono' ? 0 : R.int(0, 6)));
      if (pv.facturado && cobro <= hoy) pv.cobrado = cobro;
      return pv;
    }
    function ganar(opp, oc, factura) {
      opp.etapa = 'ganada'; opp.fechaOC = opp.fechaOC || oc; opp.fechaCierre = oc; opp.proxContacto = null;
      opp.postventa = postventa(opp, oc, factura);
    }

    const ganadasPorVendedor = {};
    /* ---- 1) Ganadas y facturadas: 6 meses (mes actual a la fecha) ---- */
    for (const v of vendedores) {
      const P = PERFILES[v.id];
      ganadasPorVendedor[v.id] = [];
      for (let m = P.desde; m <= 0; m++) {
        const ini = Util.addMonths(hoy, m), fin = Util.endOfMonth(ini);
        const ultimo = m === 0 ? addDays(hoy, -1) : fin;
        if (ultimo < ini) continue;
        let objetivo = P.meta * (1 + R.gauss() * P.var);
        let n = R.int(P.winsMes[0], P.winsMes[1]);
        if (m === 0) {
          objetivo = P.meta * diffDays(ini, hoy) / (diffDays(ini, fin) + 1) * (0.9 + R.f() * 0.2);
          n = objetivo > 1500 ? Math.max(1, Math.round(objetivo / 12000)) : 0;
        }
        if (!n) continue;
        const pesos = Array.from({ length: n }, () => 0.3 + R.f());
        const tp = Util.sum(pesos);
        pesos.forEach(p => {
          const monto = clamp(objetivo * p / tp, 250, 120000);
          const factura = randBizBetween(ini, ultimo);
          const plazo = pickPlazo();
          const sem = plazoPorId(plazo).maxSemanas;
          const oc = prevBizDay(addDays(factura, -(sem * 7) - R.int(0, 4)));
          const inicio = prevBizDay(addDays(oc, -R.int(8, 55)));
          const opp = crearOportunidad({ vid: v.id, inicio, monto, plazo, fin: addDays(oc, -1), revisiones: R.chance(0.22) ? R.int(1, 2) : 0, etapa: 'ganada' });
          seguimientos(opp, inicio, oc, 'Llegó la OC por correo. Se pasa a post-venta.');
          ganar(opp, oc, factura);
          ganadasPorVendedor[v.id].push(opp);
        });
      }
    }

    /* ---- 2) Ganadas por facturar (post-venta en curso) ---- */
    const PENDIENTES = { u1: 3, u2: 2, u3: 2, u4: 1, u5: 1 };
    const eom = Util.endOfMonth(hoy);
    const porFacturar = {};
    for (const v of vendedores) {
      porFacturar[v.id] = [];
      for (let i = 0; i < PENDIENTES[v.id]; i++) {
        const fac = i === 0 ? (diffDays(hoy, eom) >= 3 ? addDays(hoy, R.int(2, diffDays(hoy, eom))) : addDays(hoy, 2)) : addDays(hoy, R.int(5, 70));
        let plazo, sem, guard = 0;
        do { plazo = pickPlazo(); sem = plazoPorId(plazo).maxSemanas; guard++; } while ((sem * 7 <= diffDays(hoy, fac) || sem * 7 - diffDays(hoy, fac) > 110) && guard < 60);
        if (sem * 7 <= diffDays(hoy, fac)) { plazo = '22-24'; sem = 24; }
        const oc = addDays(fac, -sem * 7);
        const inicio = prevBizDay(addDays(oc, -R.int(10, 45)));
        const monto = clamp(logn(v.id === 'u1' ? 11000 : 7000, 0.5), 800, 60000);
        const opp = crearOportunidad({ vid: v.id, inicio, monto, plazo, fin: addDays(oc, -1), revisiones: R.chance(0.3) ? 1 : 0, etapa: 'ganada' });
        seguimientos(opp, inicio, oc, 'Llegó la OC por correo. Se pasa a post-venta.');
        ganar(opp, oc, fac);
        porFacturar[v.id].push(opp);
      }
    }

    /* ---- 3) Perdidas (con motivo) ---- */
    const MOTIVOS = [['otra_marca',20],['precio',22],['plazo',16],['tecnico',6],['cancelado',8],['sin_respuesta',15],['resolvio',4],['otro',3]];
    const perdidas = {};
    function perder(opp, cierre, motivo) {
      opp.etapa = 'perdida'; opp.fechaCierre = cierre; opp.motivoPerdida = motivo; opp.proxContacto = null;
      if (motivo === 'otro') opp.motivoOtro = NOTA_PERDIDA.otro;
    }
    function crearPerdida(vid, cierre, motivo, extra) {
      const inicio = prevBizDay(addDays(cierre, -R.int(7, 60)));
      const opp = crearOportunidad(Object.assign({ vid, inicio, monto: clamp(logn(2600, 1.0), 200, 90000), fin: addDays(cierre, -1),
        revisiones: R.chance(0.2) ? R.int(1, 2) : 0, alternativa: R.chance(0.1), etapa: 'perdida' }, extra || {}));
      seguimientos(opp, inicio, cierre, NOTA_PERDIDA[motivo]);
      perder(opp, cierre, motivo);
      return opp;
    }
    for (const v of vendedores) {
      const P = PERFILES[v.id];
      perdidas[v.id] = [];
      for (let i = 0; i < P.perdidas; i++) {
        const cierre = prevBizDay(addDays(hoy, -R.int(2, v.id === 'u5' ? 40 : 175)));
        perdidas[v.id].push(crearPerdida(v.id, cierre, R.w(MOTIVOS)));
      }
    }

    /* ---- 4) En pausa ---- */
    const pausas = [['u1', -2], ['u2', 25], ['u3', 40], ['u4', 15], ['u2', 55]];
    pausas.forEach(([vid, reac]) => {
      const inicio = prevBizDay(addDays(hoy, -R.int(40, 130)));
      const ultimo = prevBizDay(addDays(hoy, -R.int(10, 30)));
      const opp = crearOportunidad({ vid, inicio, monto: clamp(logn(9000, 0.8), 1500, 90000), fin: ultimo, revisiones: R.chance(0.3) ? 1 : 0, etapa: 'pausa' });
      seguimientos(opp, inicio, ultimo, 'El cliente detuvo el proyecto por presupuesto; retomar más adelante.');
      opp.fechaReactivacion = reac < 0 ? prevBizDay(addDays(hoy, reac)) : nextBizDay(addDays(hoy, reac));
      opp.fechaOC = addDays(opp.fechaReactivacion, 30);
    });

    /* ---- 5) Abiertas (con los casos que deben verse en la demo) ---- */
    const ETAPA_PESO = [['e1',6],['e2',10],['e3',32],['e4',38],['e5',6],['e6',5]];
    const abiertasSpecs = {};
    for (const v of vendedores) {
      const P = PERFILES[v.id];
      const specs = [];
      for (let i = 0; i < P.abiertas; i++) {
        const etapa = R.w(ETAPA_PESO);
        const inicio = prevBizDay(addDays(hoy, -R.int(3, v.id === 'u5' ? 35 : 70)));
        const ocRango = { e6: [4, 25], e5: [10, 40], e4: [15, 75], e3: [20, 95], e2: [25, 110], e1: [25, 110] }[etapa];
        const med = { e6: 9000, e5: 8000 }[etapa] || 3200;
        specs.push({ vid: v.id, etapa, inicio, monto: clamp(logn(med, 1.0), 200, 120000), fechaOC: addDays(hoy, R.int(ocRango[0], ocRango[1])),
          prox: nextBizDay(addBizDays(hoy, R.int(1, 8))), ultimo: null, revisiones: R.chance(0.2) ? (R.chance(0.3) ? 2 : 1) : 0, alternativa: R.chance(0.15) });
      }
      // Casos obligatorios
      specs[0].prox = hoy; specs[1].prox = hoy;                                         // contactar hoy
      specs[2].prox = addBizDays(hoy, -R.int(1, 3)); specs[3].prox = addBizDays(hoy, -R.int(2, 4)); // atrasados
      if (['u1','u2','u4'].includes(v.id)) specs[4].prox = addBizDays(hoy, -R.int(6, 10));          // atrasado > 5 días hábiles → escalado
      if (['u1','u3','u4','u5'].includes(v.id)) {                                        // cotización que vence mañana
        const s = specs[5]; s.validez = R.pick([7, 10, 15]); s.inicio = addDays(hoy, 1 - s.validez); s.revisiones = 0; s.venceManana = true;
      }
      if (['u1','u4'].includes(v.id)) specs[v.id === 'u1' ? 1 : 2].fechaOC = addDays(hoy, -R.int(3, 12)); // fecha estimada de OC vencida
      abiertasSpecs[v.id] = specs;
    }
    // Oportunidades avanzadas que facturarían dentro del mes (dan cobertura a la meta)
    const dm = Math.max(3, diffDays(hoy, eom));
    [['u1', 9, 'e6', 'stock'], ['u1', 6, 'e4', 'stock'], ['u2', 5, 'e6', 'stock'], ['u3', 6, 'e4', 'stock'], ['u3', 4, 'e5', '2-3'], ['u4', 6, 'e4', 'stock'], ['u5', 6, 'e6', 'stock']]
      .forEach(([vid, i, et, pl]) => Object.assign(abiertasSpecs[vid][i], { etapa: et, plazo: pl, monto: clamp(logn(9000, 0.5), 2500, 40000),
        fechaOC: addDays(hoy, pl === 'stock' ? R.int(2, Math.min(dm, 20)) : 2) }));
    // Una oferta grande sin feedback (> 200K USD) para ilustrar la etapa de 1 %
    Object.assign(abiertasSpecs.u2[6], { etapa: 'grande', monto: 236000, marca: 'Moxa', fechaOC: addDays(hoy, 120), alternativa: false });
    // Proyectos estatales con varios integradores (todas abiertas)
    Object.assign(abiertasSpecs.u1[7], { proyectoId: PE[1].id, etapa: 'e5', monto: 18500, marca: 'Moxa' });
    Object.assign(abiertasSpecs.u2[7], { proyectoId: PE[1].id, etapa: 'e4', monto: 17200, marca: 'Moxa' });
    Object.assign(abiertasSpecs.u4[7], { proyectoId: PE[1].id, etapa: 'e4', monto: 19900, marca: 'Advantech' });
    Object.assign(abiertasSpecs.u3[7], { proyectoId: PE[2].id, etapa: 'e3', monto: 26400, marca: 'Zenitel' });
    Object.assign(abiertasSpecs.u5[4], { proyectoId: PE[2].id, etapa: 'e2', monto: 24800, marca: 'Zenitel' });
    Object.assign(abiertasSpecs.u2[8], { proyectoId: PE[4].id, etapa: 'e4', monto: 31000, marca: 'Black Box' });
    Object.assign(abiertasSpecs.u3[8], { proyectoId: PE[4].id, etapa: 'e5', monto: 29500, marca: 'Black Box' });
    Object.assign(abiertasSpecs.u1[8], { proyectoId: PE[5].id, etapa: 'e2', monto: 14200, marca: 'InHand' });

    const abiertas = {};
    for (const v of vendedores) {
      abiertas[v.id] = abiertasSpecs[v.id].map(s => {
        let fin = s.prox && s.prox < hoy ? prevBizDay(addDays(s.prox, -R.int(2, 5))) : prevBizDay(addDays(hoy, -R.int(0, 9)));
        if (fin < s.inicio) fin = s.inicio;
        const opp = crearOportunidad(Object.assign({}, s, { fin }));
        if (s.venceManana) { const q = vigenteQ(opp); q.validezDias = s.validez; q.fechaEmision = s.inicio; }
        seguimientos(opp, s.inicio, fin, null, s.prox);
        if (fin === s.inicio) { const fu = db.followups.filter(f => f.oppId === opp.id).pop(); fu.proxContacto = s.prox; }
        return opp;
      });
    }

    /* ---- 6) Cotizaciones leídas del correo y aún sin completar (sin próximo contacto) ---- */
    [['u1', 1], ['u2', 2], ['u5', 1]].forEach(([vid, dias]) => {
      const inicio = prevBizDay(addBizDays(hoy, -dias));
      crearOportunidad({ vid, inicio, monto: clamp(logn(2500, 0.7), 300, 30000), etapa: 'e1', prox: null, fechaOC: null, pendiente: true, origen: 'correo' });
    });

    /* ---- 7) Escenarios de proyectos con varios integradores ---- */
    // PE[0]: un integrador ganó (u2) y los otros dos quedaron cerrados con "ganó otro integrador"
    const g0 = ganadasPorVendedor.u2.slice().sort((a, b) => a.fechaCierre < b.fechaCierre ? -1 : 1)[Math.floor(ganadasPorVendedor.u2.length / 2)];
    g0.proyectoId = PE[0].id;
    crearPerdida('u1', g0.fechaCierre, 'otro_integrador', { proyectoId: PE[0].id, monto: netoUSD(g0) * 1.04, marca: 'Moxa' });
    crearPerdida('u3', g0.fechaCierre, 'otro_integrador', { proyectoId: PE[0].id, monto: netoUSD(g0) * 0.97, marca: 'Advantech' });
    // PE[3]: u1 ganó (en post-venta); u4 quedó cerrado con "ganó otro integrador"
    const g3 = porFacturar.u1[1];
    g3.proyectoId = PE[3].id;
    crearPerdida('u4', g3.fechaCierre, 'otro_integrador', { proyectoId: PE[3].id, monto: netoUSD(g3) * 1.02, marca: 'Moxa' });
    // PE[4]: además una pérdida por precio; PE[5]: una pausa
    perdidas.u4[0].proyectoId = PE[4].id;
    const pausaU2 = db.opps.find(o => o.etapa === 'pausa' && o.vendedorId === 'u2');
    if (pausaU2) pausaU2.proyectoId = PE[5].id;

    /* ---- 8) Número de cotización duplicado (mismo número en dos oportunidades) ---- */
    const dupDestino = vigenteQ(abiertas.u4[8]);
    const dupOrigen = db.quotes.find(q => q.oppId === perdidas.u4[3].id && q.tipo !== 'alternativa');
    if (dupDestino && dupOrigen) dupDestino.numero = dupOrigen.numero;

    /* ---- 9) Histórico de facturación (meses 7 a 12) solo para calcular el segmento T1/T2/CO ---- */
    for (const v of vendedores) {
      if (v.id === 'u5') continue;
      const P = PERFILES[v.id];
      for (let m = -11; m <= -6; m++) {
        const total = P.meta * (0.8 + R.f() * 0.3);
        const n = R.int(2, 4);
        for (let i = 0; i < n; i++) db.historico.push({ clienteId: elegirCliente(v.id).id, vendedorId: v.id, mes: Util.monthKey(Util.addMonths(hoy, m)), montoUSD: Util.round2(total / n) });
      }
    }

    /* ---- 10) Cuentas nuevas: sin asignar (para que jefatura las asigne) y una registrada por un vendedor ---- */
    [['Vértice Norte Automatización S.A.C.', null], ['Ribera Sur Ingeniería E.I.R.L.', null], ['Pampa Alta Conectividad S.R.L.', null], ['Laguna Azul Sistemas de Control S.A.C.', 'u5']]
      .forEach(([razon, vid], i) => {
        const dominio = slug(razon.split(' ').slice(0, 2).join('')) + '.demo.pe';
        const c = { id: 'C-' + (++db.seq.client), razonSocial: razon, ruc: nuevoRuc(), vendedorId: vid, ciudad: pick2(['Lima', 'Arequipa', 'Trujillo']), tipo: 'Integrador',
          contactos: contactos(dominio, 1), fechaAlta: prevBizDay(addDays(hoy, -(3 + i * 4))), registradoPor: vid || 'u6' };
        c.contactos.forEach(k => { k.id = 'K-' + (db.seq.contacto++); k.cargo = pick2(CARGOS); });
        db.clients.push(c);
      });

    /* ---- 11) Gestiones de cuenta (contactos sin cotización) para mostrar los estados de la cartera ---- */
    db.gestiones = [];
    const ultimaCot = {}, oppCli = {};
    db.opps.forEach(o => { oppCli[o.id] = o.clienteId; });
    db.quotes.forEach(q => { const c = oppCli[q.oppId]; if (!ultimaCot[c] || q.fechaEmision > ultimaCot[c]) ultimaCot[c] = q.fechaEmision; });
    const limiteCta = addDays(hoy, -Config.CUENTA_INACTIVA_DIAS);
    const NOTA_SR = ['Sin respuesta al WhatsApp.', 'No contesta las llamadas.', 'Correo sin respuesta.'];
    const NOTA_OK = ['Sin proyectos por ahora; volver a llamar el próximo mes.', 'Pidió el catálogo actualizado.', 'Evalúan presupuesto para el próximo año.'];
    db.clients.filter(c => c.vendedorId && (ultimaCot[c.id] || c.fechaAlta) < limiteCta).forEach((c, i) => {
      const k = i % 4; // 0 y 1: no responde · 2: respondió (sigue activa) · 3: sin contacto
      if (k === 3) return;
      const n = k < 2 ? 1 + Math.floor(r2() * 2) : 1;
      for (let j = 0; j < n; j++) {
        db.gestiones.push({ id: 'G-' + (db.seq.gestion++), clienteId: c.id, fecha: prevBizDay(addDays(hoy, -(3 + Math.floor(r2() * 42)))), canal: pick2(['WhatsApp', 'Llamada', 'Correo']),
          resultado: k < 2 ? 'sin_respuesta' : 'respondio', nota: k < 2 ? pick2(NOTA_SR) : pick2(NOTA_OK), usuarioId: c.vendedorId });
      }
    });

    db.opps.forEach(o => { delete o._ultimoNumero; });
    // Lista de precios FICTICIA para la demo (la real se importa o se carga desde un archivo privado)
    db.catalogo = CATALOGO.map((p, i) => ({ id: 'P-' + (i + 1), marca: p.marca, codigo: p.codigo, descripcion: p.descripcion, precio: p.precio, actualizado: addDays(hoy, -20), actualizadoPor: 'u7' }));
    db.seq.producto = db.catalogo.length + 1;
    db.catalogoInfo = { actualizado: addDays(hoy, -20), por: 'u7', origen: 'demo' };
    db.catalogoLog = [{ fecha: addDays(hoy, -20), usuarioId: 'u7', accion: `Lista de precios de demostración cargada (${db.catalogo.length} productos ficticios)` }];
    return db;
  }

  return { generate, CATALOGO, SEED };
})();

/* =====================================================================
   CAPA 4 · RULES — reglas de negocio puras (no tocan la interfaz ni guardan nada).
   Reciben la data (snapshot) y devuelven resultados. El backend final debe
   implementar exactamente estas mismas reglas.
   ===================================================================== */
const Rules = (() => {
  const etapa = id => Config.ETAPAS.find(e => e.id === id);
  const condicion = id => Config.CONDICIONES_PAGO.find(c => c.id === id);
  const plazo = id => Config.PLAZOS_ENTREGA.find(p => p.id === id);
  const motivo = id => Config.MOTIVOS_PERDIDA.find(m => m.id === id);
  const esAbierta = o => !!(etapa(o.etapa) || {}).abierta;
  const ETAPAS_ABIERTAS = Config.ETAPAS.filter(e => e.abierta).map(e => e.id);
  /** Probabilidad derivada de la etapa (el vendedor no la escribe). Pausa queda fuera del funnel → 0 en cálculos. */
  const prob = id => { const e = etapa(id); return e && e.prob != null ? e.prob : 0; };

  /* Índices en memoria (se recalculan cuando cambia la versión de la data) */
  function ix(db) {
    if (db.__ix && db.__ix.v === db._v) return db.__ix;
    const m = { v: db._v, quotesByOpp: {}, fuByOpp: {}, opp: {}, client: {}, project: {}, user: {}, seg: null };
    const byDate = k => (x, y) => x[k] < y[k] ? -1 : x[k] > y[k] ? 1 : 0;
    db.quotes.forEach(q => (m.quotesByOpp[q.oppId] = m.quotesByOpp[q.oppId] || []).push(q));
    Object.values(m.quotesByOpp).forEach(a => a.sort(byDate('fechaEmision')));
    db.followups.forEach(f => (m.fuByOpp[f.oppId] = m.fuByOpp[f.oppId] || []).push(f));
    Object.values(m.fuByOpp).forEach(a => a.sort(byDate('fecha')));
    db.opps.forEach(o => { m.opp[o.id] = o; });
    db.clients.forEach(c => { m.client[c.id] = c; });
    db.projects.forEach(p => { m.project[p.id] = p; });
    db.users.forEach(u => { m.user[u.id] = u; });
    Object.defineProperty(db, '__ix', { value: m, writable: true, configurable: true, enumerable: false });
    return m;
  }
  const quotesOf = (db, opp) => ix(db).quotesByOpp[opp.id] || [];
  const followupsOf = (db, opp) => ix(db).fuByOpp[opp.id] || [];
  const vigente = (db, opp) => { const qs = quotesOf(db, opp); return qs.find(q => q.vigente) || qs[qs.length - 1] || null; };

  /** Totales de una cotización en su moneda: suma, descuento, neto sin IGV, IGV 18 % y total */
  function totales(q) {
    const suma = Util.round2(Util.sum(principales(q), it => (+it.cant || 0) * (+it.valorUnit || 0)));   // los opcionales no suman
    // descuento en monto o en porcentaje sobre la suma
    const descuento = q.descuentoTipo === 'pct' ? Util.round2(suma * (+q.descuentoPct || 0) / 100) : Util.round2(+q.descuento || 0);
    const neto = Util.round2(suma - descuento);
    const igv = Util.round2(neto * Config.IGV);
    return { suma, descuento, neto, igv, total: Util.round2(neto + igv), descuentoPct: q.descuentoTipo === 'pct' ? (+q.descuentoPct || 0) : (suma ? Util.round2(descuento / suma * 100) : 0) };
  }
  /** PEN → USD con el tipo de cambio del día de emisión guardado en la cotización */
  const aUSD = (monto, q) => q.moneda === 'PEN' ? monto / (q.tc || Config.TC_REFERENCIA) : monto;
  const quoteNetoUSD = q => q ? Util.round2(aUSD(totales(q).neto, q)) : 0;
  const quoteTotalUSD = q => q ? Util.round2(aUSD(totales(q).total, q)) : 0;
  const montoUSD = (db, opp) => quoteNetoUSD(vigente(db, opp));
  /** Monto ponderado = neto USD (sin IGV) × probabilidad de la etapa */
  function ponderado(db, opp) {
    if (opp.etapa === 'pausa' || opp.etapa === 'perdida') return 0;
    return Util.round2(montoUSD(db, opp) * prob(opp.etapa));
  }
  /** Ítems que suman al total (los opcionales se cotizan aparte) */
  function principales(q) { return (q && q.items || []).filter(it => !it.opcional); }
  function marcaPrincipal(q) {
    if (!q) return '—';
    const by = {};
    principales(q).forEach(it => { by[it.marca] = (by[it.marca] || 0) + it.cant * it.valorUnit; });
    return Object.keys(by).sort((a, b) => by[b] - by[a])[0] || '—';
  }
  const marcas = q => q ? [...new Set(principales(q).map(it => it.marca))] : [];
  function resumenItems(q) {
    if (!q || !principales(q).length) return '—';
    const top = principales(q).slice().sort((a, b) => b.cant * b.valorUnit - a.cant * a.valorUnit);
    return top.slice(0, 2).map(it => `${it.cant}x ${it.codigo}`).join(', ') + (top.length > 2 ? ` +${top.length - 2}` : '');
  }
  const maxSemanas = id => (plazo(id) || { maxSemanas: 0 }).maxSemanas;
  const fechaOCRef = opp => opp.etapa === 'ganada' ? ((opp.postventa && opp.postventa.oc) || opp.fechaOC) : opp.fechaOC;
  /** Fecha estimada de factura: la que eligió el vendedor (horizonte FACT); si no la eligió, fecha de OC + extremo mayor del plazo de entrega */
  function fechaFactura(db, opp) {
    if (opp.postventa && opp.postventa.facturado) return opp.postventa.facturado;
    if (opp.fechaFacturaEst) return opp.fechaFacturaEst;
    const oc = fechaOCRef(opp), q = vigente(db, opp);
    if (!oc || !q) return null;
    return Util.addDays(oc, maxSemanas(q.plazo) * 7);
  }
  /** Eventos de cobro (con IGV, en USD) según la condición de pago */
  function eventosCobro(db, opp) {
    const q = vigente(db, opp);
    if (!q) return [];
    const cp = condicion(q.condicionPago) || Config.CONDICIONES_PAGO[0];
    const total = quoteTotalUSD(q);
    const oc = fechaOCRef(opp), fac = fechaFactura(db, opp);
    const pv = opp.postventa || {};
    return cp.cobro.map(rg => {
      const base = rg.base === 'oc' ? oc : fac;
      return { fecha: base ? Util.addDays(base, rg.dias) : null, monto: Util.round2(total * rg.pct), pct: rg.pct, base: rg.base, dias: rg.dias,
        cobrado: !!pv.cobrado || (rg.base === 'oc' && !!pv.adelantoCobrado) };
    });
  }
  /** Horizonte FACT: antes de fin de mes → "Este mes"; luego 30, 60, 90 y 120 días (más de 90). Fechas pasadas → este mes. */
  function horizonte(fecha, hoy = Util.today()) {
    if (!fecha) return null;
    if (fecha <= Util.endOfMonth(hoy)) return 'mes';
    const d = Util.diffDays(hoy, fecha);
    if (d <= 30) return 'd30';
    if (d <= 60) return 'd60';
    if (d <= 90) return 'd90';
    return 'd120';
  }
  /** Horizonte elegido por el vendedor → fecha estimada de factura (fin de mes, o hoy + 30/60/90/120 días) */
  const fechaDeHorizonte = (id, hoy = Util.today()) => { const h = Config.HORIZONTES.find(x => x.id === id); return !h ? null : h.dias ? Util.addDays(hoy, h.dias) : Util.endOfMonth(hoy); };
  const horizonteNombre = id => id ? Config.HORIZONTES.find(h => h.id === id).nombre : 'Sin fecha';
  const BASE_COBRO = { oc: 'en la OC', entrega: 'contra entrega', factura: 'factura' };

  /** Proyección de facturación (sin IGV) o cobranza (con IGV). Ganadas al 100 %, abiertas ponderadas. */
  function proyeccion(db, { tipo = 'facturacion', vendedorId = null, condicionPago = null, hoy = Util.today() } = {}) {
    const filas = [];
    db.opps.forEach(opp => {
      if (vendedorId && opp.vendedorId !== vendedorId) return;
      const ganada = opp.etapa === 'ganada', abierta = esAbierta(opp);
      if (!ganada && !abierta) return;
      const q = vigente(db, opp);
      if (!q) return;
      if (condicionPago && q.condicionPago !== condicionPago) return;
      const factor = ganada ? 1 : prob(opp.etapa);
      const clase = ganada ? 'ganada' : 'abierta';
      if (tipo === 'facturacion') {
        if (ganada && opp.postventa && opp.postventa.facturado) return;
        const fecha = fechaFactura(db, opp), base = montoUSD(db, opp);
        filas.push({ opp, q, clase, fecha, horizonte: horizonte(fecha, hoy), base, factor, monto: Util.round2(base * factor), concepto: 'Factura', vencida: !!fecha && fecha < hoy });
      } else {
        eventosCobro(db, opp).forEach(ev => {
          if (ev.cobrado) return;
          const concepto = Math.round(ev.pct * 100) + '% ' + (ev.base === 'factura' ? `a factura + ${ev.dias} d` : BASE_COBRO[ev.base]);
          filas.push({ opp, q, clase, fecha: ev.fecha, horizonte: horizonte(ev.fecha, hoy), base: ev.monto, factor, monto: Util.round2(ev.monto * factor), concepto, vencida: !!ev.fecha && ev.fecha < hoy });
        });
      }
    });
    const keys = Config.HORIZONTES.map(h => h.id).concat(['sin', 'total']);
    const blank = () => keys.reduce((m, k) => (m[k] = 0, m), {});
    const tot = { ganada: blank(), abierta: blank(), total: blank() };
    filas.forEach(f => {
      const k = f.horizonte || 'sin';
      [tot[f.clase], tot.total].forEach(t => { t[k] += f.monto; t.total += f.monto; });
    });
    return { filas, tot };
  }

  /* ---------- Facturación, meta y cobertura ---------- */
  const facturadas = (db, { desde, hasta, vendedorId = null }) => db.opps.filter(o => o.postventa && o.postventa.facturado &&
    o.postventa.facturado >= desde && o.postventa.facturado <= hasta && (!vendedorId || o.vendedorId === vendedorId));
  const montoFactura = o => o.postventa.facturaMonto || 0;
  function facturadoMes(db, vendedorId, mesKey) {
    const desde = mesKey + '-01', hasta = Util.endOfMonth(desde);
    return Util.round2(Util.sum(facturadas(db, { desde, hasta, vendedorId }), montoFactura));
  }
  /** Avance de meta: facturado sin IGV del mes vs meta; cobertura = (ganadas por facturar en el mes + ponderado con factura estimada en el mes) / lo que falta */
  function avanceMeta(db, vendedorId, hoy = Util.today()) {
    const u = ix(db).user[vendedorId];
    const meta = (u && u.meta) || Config.META_MENSUAL_USD;
    const facturado = facturadoMes(db, vendedorId, Util.monthKey(hoy));
    const falta = Math.max(0, Util.round2(meta - facturado));
    const eom = Util.endOfMonth(hoy);
    let ganadasPorFacturar = 0, ponderadoMes = 0;
    db.opps.forEach(o => {
      if (o.vendedorId !== vendedorId) return;
      const f = fechaFactura(db, o);
      if (!f || f > eom) return;
      if (o.etapa === 'ganada' && !(o.postventa && o.postventa.facturado)) ganadasPorFacturar += montoUSD(db, o);
      else if (esAbierta(o)) ponderadoMes += ponderado(db, o);
    });
    return { meta, facturado, avance: facturado / meta, falta, ganadasPorFacturar: Util.round2(ganadasPorFacturar), ponderadoMes: Util.round2(ponderadoMes),
      cobertura: falta > 0 ? (ganadasPorFacturar + ponderadoMes) / falta : null };
  }
  /** Comisión del mes = (facturado sin IGV − meta) × 2 %, solo si se superó la meta. No es acumulativa entre meses. */
  function comision(db, vendedorId, mesKey) {
    const u = ix(db).user[vendedorId];
    const meta = (u && u.meta) || Config.META_MENSUAL_USD;
    const facturado = facturadoMes(db, vendedorId, mesKey);
    const excedente = Math.max(0, Util.round2(facturado - meta));
    return { mes: mesKey, meta, facturado, excedente, pct: Config.COMISION_PCT, monto: Util.round2(excedente * Config.COMISION_PCT) };
  }
  /** Estimación del mes en curso: facturado + ganadas por facturar + ponderado con factura estimada en el mes */
  function comisionProyectada(db, vendedorId, hoy = Util.today()) {
    const av = avanceMeta(db, vendedorId, hoy);
    const base = Util.round2(av.facturado + av.ganadasPorFacturar + av.ponderadoMes);
    const excedente = Math.max(0, Util.round2(base - av.meta));
    return { base, excedente, monto: Util.round2(excedente * Config.COMISION_PCT), faltaParaComisionar: av.falta };
  }
  /** Tasa de cierre = ganadas ÷ (ganadas + perdidas). Excluye "ganó otro integrador" y las pausas. Por cantidad y por monto. */
  function tasaCierre(db, { vendedorId = null, desde, hasta }) {
    const enRango = o => (!vendedorId || o.vendedorId === vendedorId) && o.fechaCierre && o.fechaCierre >= desde && o.fechaCierre <= hasta;
    const g = db.opps.filter(o => o.etapa === 'ganada' && enRango(o));
    const p = db.opps.filter(o => o.etapa === 'perdida' && enRango(o) && !(motivo(o.motivoPerdida) || {}).noCuentaComoPerdida);
    const mg = Util.sum(g, o => montoUSD(db, o)), mp = Util.sum(p, o => montoUSD(db, o));
    return { ganadas: g.length, perdidas: p.length, montoGanado: mg, montoPerdido: mp,
      tasaCantidad: g.length + p.length ? g.length / (g.length + p.length) : null, tasaMonto: mg + mp ? mg / (mg + mp) : null };
  }
  function cicloVenta(db, { vendedorId = null, desde, hasta }) {
    const g = db.opps.filter(o => o.etapa === 'ganada' && o.fechaCierre >= desde && o.fechaCierre <= hasta && (!vendedorId || o.vendedorId === vendedorId));
    return g.length ? Util.sum(g, o => Util.diffDays(o.fechaInicio, o.fechaCierre)) / g.length : null;
  }
  const cotizacionesEnviadas = (db, { vendedorId = null, desde, hasta }) => db.quotes.filter(q => {
    const o = ix(db).opp[q.oppId];
    return o && (!vendedorId || o.vendedorId === vendedorId) && q.fechaEmision >= desde && q.fechaEmision <= hasta;
  }).length;
  function ranking(db, hoy = Util.today()) {
    const desde6 = Util.addMonths(hoy, -5), mesIni = Util.startOfMonth(hoy);
    const filas = db.users.filter(u => u.rol === 'vendedor' && u.activo !== false).map(v => Object.assign({ v },
      avanceMeta(db, v.id, hoy),
      { tasa: tasaCierre(db, { vendedorId: v.id, desde: desde6, hasta: hoy }),
        enviadasMes: cotizacionesEnviadas(db, { vendedorId: v.id, desde: mesIni, hasta: hoy }),
        enviadas6m: cotizacionesEnviadas(db, { vendedorId: v.id, desde: desde6, hasta: hoy }),
        ciclo: cicloVenta(db, { vendedorId: v.id, desde: desde6, hasta: hoy }) }));
    filas.sort((a, b) => b.facturado - a.facturado);
    filas.forEach((f, i) => { f.pos = i + 1; });
    return filas;
  }

  /* ---------- Segmento del cliente (T1 / T2 / CO) — facturado últimos 12 meses ---------- */
  function segmento(db, clienteId, hoy = Util.today()) {
    const m = ix(db);
    if (!m.seg || m.segHoy !== hoy) {
      const desde = Util.addDays(hoy, -365), mesDesde = Util.monthKey(desde), tot = {};
      db.opps.forEach(o => { if (o.postventa && o.postventa.facturado && o.postventa.facturado >= desde && o.postventa.facturado <= hoy) tot[o.clienteId] = (tot[o.clienteId] || 0) + (o.postventa.facturaMonto || 0); });
      (db.historico || []).forEach(h => { if (h.mes > mesDesde) tot[h.clienteId] = (tot[h.clienteId] || 0) + h.montoUSD; });
      m.seg = tot; m.segHoy = hoy;
    }
    const total = m.seg[clienteId] || 0;
    const c = m.client[clienteId];
    if (c && c.segmentoDeclarado) return { seg: c.segmentoDeclarado, total, declarado: true };   // segmento declarado en la lista de clientes
    return { seg: total > Config.SEGMENTO_T1_USD ? 'T1' : total >= Config.SEGMENTO_T2_USD ? 'T2' : 'CO', total };
  }

  /* ---------- Cuentas: estado y alerta por falta de cotización ---------- */
  /** Para cada cliente: última cotización, días sin cotizar, contactos (seguimientos de sus oportunidades + gestiones de cuenta),
      estado (activo / no responde / sin contacto) y si corresponde alerta (más de 60 días sin cotizar y sin respuesta). */
  function cuentas(db, hoy = Util.today()) {
    const m = ix(db);
    if (m.cta && m.ctaHoy === hoy) return m.cta;
    const res = {}, lim = Util.addDays(hoy, -Config.CUENTA_INACTIVA_DIAS);
    db.clients.forEach(c => { res[c.id] = { ultimaCot: null, contactos: [], abiertas: 0, opps: 0 }; });
    db.opps.forEach(o => {
      const r = res[o.clienteId];
      if (!r) return;
      r.opps++;
      if (esAbierta(o)) r.abiertas++;
      quotesOf(db, o).forEach(q => { if (q.fechaEmision <= hoy && (!r.ultimaCot || q.fechaEmision > r.ultimaCot)) r.ultimaCot = q.fechaEmision; });
      followupsOf(db, o).forEach(f => { if (!f.auto && f.canal !== 'Sistema') r.contactos.push({ fecha: f.fecha, resultado: f.resultado || 'respondio', canal: f.canal, nota: f.nota, oppId: o.id, usuarioId: f.usuarioId }); });
    });
    (db.gestiones || []).forEach(g => { const r = res[g.clienteId]; if (r) r.contactos.push({ fecha: g.fecha, resultado: g.resultado, canal: g.canal, nota: g.nota, gestion: true, usuarioId: g.usuarioId }); });
    db.clients.forEach(c => {
      const r = res[c.id];
      r.contactos.sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0);
      r.ultimoContacto = r.contactos[0] || null;
      r.diasSinCotizar = Util.diffDays(r.ultimaCot || c.fechaAlta || hoy, hoy);
      // el reloj de 60 días empieza, como muy temprano, el día en que la empresa inicia el seguimiento en la plataforma
      const base = [r.ultimaCot || c.fechaAlta || hoy, db.inicioSeguimiento || '0000-00-00'].sort().pop();
      const diasControl = Util.diffDays(base, hoy);
      const rec = r.contactos.filter(k => k.fecha >= lim && k.fecha <= hoy);
      r.estado = diasControl < Config.CUENTA_INACTIVA_DIAS || rec.some(k => k.resultado === 'respondio') ? 'activo' : rec.length ? 'no_responde' : 'sin_contacto';
      r.alerta = r.estado !== 'activo';
    });
    m.cta = res; m.ctaHoy = hoy;
    return res;
  }
  const cuenta = (db, clienteId, hoy = Util.today()) => cuentas(db, hoy)[clienteId];
  function alertaCuenta(db, c, hoy = Util.today()) {
    const r = cuenta(db, c.id, hoy);
    if (!r || !r.alerta) return null;
    const est = Config.ESTADOS_CUENTA[r.estado];
    return { tipo: 'cuenta_inactiva', nivel: r.estado === 'sin_contacto' ? 'bad' : 'warn', dias: r.diasSinCotizar, estado: r.estado,
      texto: `${r.ultimaCot ? 'Sin cotizar hace' : 'Sin cotizaciones desde su alta hace'} ${r.diasSinCotizar} días · ${est.nombre}` };
  }
  /* ---------- Clientes: identificación fiscal y sedes ---------- */
  const esPeru = pais => !String(pais || '').trim() || /^per[uú]$/i.test(String(pais).trim());
  /** RUC de 11 dígitos en Perú; en otro país (RUT, NIT…) basta un identificador de 5 caracteres o más */
  const rucValido = (ruc, pais) => esPeru(pais) ? /^\d{11}$/.test(String(ruc || '').trim()) : String(ruc || '').trim().length >= 5;
  const normSede = s => [s.direccion, s.distrito, s.ciudad, s.pais || 'Perú'].map(Util.norm).join('|');
  /** Sedes de una empresa: la principal (dirección, ciudad y país de la cuenta) y las demás registradas */
  function sedesDe(c) {
    if (c && Array.isArray(c.sedes) && c.sedes.length) return c.sedes;
    return c && (c.direccion || c.ciudad) ? [{ id: 'SD-0', nombre: 'Principal', direccion: c.direccion || '', distrito: c.distrito || '', ciudad: c.ciudad || '', pais: c.pais || 'Perú' }] : [];
  }
  function validarCliente(db, d) {
    const e = {};
    if (!String(d.razonSocial || '').trim()) e.razonSocial = 'La razón social es obligatoria.';
    if (!rucValido(d.ruc, d.pais)) e.ruc = esPeru(d.pais) ? 'El RUC debe tener 11 dígitos.' : 'Indica el identificador fiscal (RUT, NIT u otro).';
    else {
      const ex = db.clients.find(c => c.id !== d.id && c.ruc === String(d.ruc).trim());
      if (ex) e.ruc = `Ya existe una cuenta con ese RUC: ${ex.razonSocial}${ex.vendedorId ? ' (asignada a ' + ix(db).user[ex.vendedorId].nombre + ')' : ' (sin asignar)'}.`;
    }
    if (d.contacto && (d.contacto.correo || d.contacto.telefono || d.contacto.cargo) && !String(d.contacto.nombre || '').trim()) e.contactoNombre = 'Indica el nombre del contacto.';
    return e;
  }
  function validarContacto(k) {
    const e = {};
    if (!String(k.nombre || '').trim()) e.nombre = 'El nombre es obligatorio.';
    if (k.correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(k.correo).trim())) e.correo = 'Correo no válido.';
    return e;
  }

  /* ---------- Alertas de seguimiento ---------- */
  function alertasOpp(db, opp, hoy = Util.today()) {
    const out = [];
    if (esAbierta(opp)) {
      if (!opp.proxContacto) out.push({ tipo: 'sin_proximo', nivel: 'bad', texto: opp.pendiente ? 'Leída del correo: falta etapa, próximo contacto y fecha de OC' : 'Sin próximo contacto' });
      else if (opp.proxContacto === hoy) out.push({ tipo: 'hoy', nivel: 'info', texto: 'Contactar hoy' });
      else if (opp.proxContacto < hoy) {
        const dh = Util.bizDaysBetween(opp.proxContacto, hoy), esc = dh > Config.ESCALAR_ATRASO_DH;
        out.push({ tipo: 'atrasado', nivel: esc ? 'bad' : 'warn', dias: dh, escalado: esc,
          texto: `Atrasado ${dh} día${dh === 1 ? '' : 's'} hábil${dh === 1 ? '' : 'es'}` + (esc ? ' · escalado a jefatura' : '') });
      }
      const manuales = followupsOf(db, opp).filter(f => !f.auto);
      const limite = Util.addBizDays(opp.fechaInicio, Config.PRIMER_SEGUIMIENTO_DH);
      if (!manuales.length && limite < hoy && !out.some(a => a.tipo === 'atrasado' || a.tipo === 'sin_proximo'))
        out.push({ tipo: 'primer_seguimiento', nivel: 'warn', texto: `Primer seguimiento pendiente (límite ${Util.fmtDate(limite)})` });
      const q = vigente(db, opp);
      if (q) {
        const vence = Util.addDays(q.fechaEmision, q.validezDias), d = Util.diffDays(hoy, vence);
        if (d >= 0 && d <= Config.AVISO_VENCIMIENTO_DIAS) out.push({ tipo: 'por_vencer', nivel: 'warn', texto: d === 0 ? 'La cotización vence hoy' : 'La cotización vence mañana', fecha: vence });
      }
      if (opp.fechaOC && opp.fechaOC < hoy) out.push({ tipo: 'oc_vencida', nivel: 'warn', texto: `Fecha estimada de OC vencida (${Util.fmtDate(opp.fechaOC)}) y sin OC` });
    } else if (opp.etapa === 'pausa' && opp.fechaReactivacion && opp.fechaReactivacion <= hoy) {
      out.push({ tipo: 'reactivar', nivel: 'info', texto: `Toca reactivar (programado ${Util.fmtDate(opp.fechaReactivacion)})` });
    }
    return out;
  }
  /** Alertas que ve cada usuario en la campana */
  function alertasUsuario(db, user, hoy = Util.today()) {
    if (!user || !['vendedor', 'jefatura'].includes(user.rol)) return [];
    const out = [];
    db.opps.forEach(o => {
      if (user.rol === 'vendedor' && o.vendedorId !== user.id) return;
      alertasOpp(db, o, hoy).forEach(a => {
        if (user.rol === 'jefatura' && !a.escalado) return;   // jefatura recibe los escalados (> 5 días hábiles)
        out.push({ opp: o, alerta: a });
      });
    });
    // Cuentas sin cotizar (~2 meses): llegan al vendedor asignado y a jefatura
    db.clients.forEach(c => {
      if (user.rol === 'vendedor' && c.vendedorId !== user.id) return;
      const a = alertaCuenta(db, c, hoy);
      if (a) out.push({ cliente: c, alerta: a });
    });
    const orden = { sin_proximo: 0, atrasado: 1, primer_seguimiento: 2, hoy: 3, por_vencer: 4, oc_vencida: 5, reactivar: 6, cuenta_inactiva: 7 };
    return out.sort((a, b) => orden[a.alerta.tipo] - orden[b.alerta.tipo] || (b.alerta.dias || 0) - (a.alerta.dias || 0));
  }
  function saludSeguimiento(db, { vendedorId = null, hoy = Util.today() } = {}) {
    const abiertas = db.opps.filter(o => esAbierta(o) && (!vendedorId || o.vendedorId === vendedorId));
    let vigentes = 0, atrasados = 0, escalados = 0, sinProx = 0;
    abiertas.forEach(o => {
      if (!o.proxContacto) sinProx++;
      else if (o.proxContacto >= hoy) vigentes++;
      else { atrasados++; if (Util.bizDaysBetween(o.proxContacto, hoy) > Config.ESCALAR_ATRASO_DH) escalados++; }
    });
    return { abiertas: abiertas.length, vigentes, atrasados, escalados, sinProx, pctVigente: abiertas.length ? vigentes / abiertas.length : null };
  }

  /* ---------- Validaciones (la UI las muestra; el Repo/backend las vuelve a exigir) ---------- */
  function validarCambioEtapa(opp, nueva, d = {}, hoy = Util.today()) {
    const errs = {};
    const e = etapa(nueva);
    if (!e) { errs.etapa = 'Etapa no válida.'; return errs; }
    if (nueva === 'perdida') {
      if (!d.motivoPerdida) errs.motivoPerdida = 'El motivo de pérdida es obligatorio.';
      else if ((motivo(d.motivoPerdida) || {}).requiereTexto && !String(d.motivoOtro || '').trim()) errs.motivoOtro = 'Describe el motivo.';
    } else if (nueva === 'pausa') {
      if (!d.fechaReactivacion) errs.fechaReactivacion = 'La fecha de reactivación es obligatoria.';
      else if (d.fechaReactivacion <= hoy) errs.fechaReactivacion = 'Debe ser una fecha futura.';
    } else if (nueva === 'ganada') {
      if (!d.fechaOCReal) errs.fechaOCReal = 'Indica la fecha en que llegó la OC.';
      else if (d.fechaOCReal > hoy) errs.fechaOCReal = 'La OC no puede tener fecha futura.';
    } else if (e.abierta) {
      if (!d.proxContacto) errs.proxContacto = 'Define el próximo contacto: ninguna oportunidad abierta puede quedar sin él.';
      else if (d.proxContacto < hoy) errs.proxContacto = 'El próximo contacto no puede estar en el pasado.';
      if (d.exigirFechaOC && !d.fechaOC) errs.fechaOC = 'Indica la fecha estimada de OC.';
    }
    return errs;
  }
  function validarCotizacion(p, hoy = Util.today()) {
    const e = {};
    if (!p.clienteId && !(p.clienteNuevo && p.clienteNuevo.razonSocial)) e.cliente = 'Selecciona o registra el cliente.';
    if (p.clienteNuevo && !rucValido(p.clienteNuevo.ruc, p.pais)) e.ruc = esPeru(p.pais) ? 'El RUC debe tener 11 dígitos.' : 'Indica el identificador fiscal del cliente (RUT, NIT u otro).';
    if (!String(p.numero || '').trim()) e.numero = 'Ingresa el número tal como figura en el PDF.';
    if (!p.fechaEmision) e.fechaEmision = 'Fecha obligatoria.';
    if (p.moneda === 'PEN' && !(+p.tc > 0)) e.tc = 'Tipo de cambio obligatorio para PEN.';
    const items = (p.items || []).filter(it => String(it.codigo || '').trim() || +it.valorUnit);
    if (!items.length) e.items = 'Agrega al menos un ítem.';
    else if (!items.some(it => !it.opcional)) e.items = 'Agrega al menos un ítem principal: los opcionales no suman al total.';
    else if (items.some(it => !(+it.cant > 0) || !(+it.valorUnit > 0) || !String(it.codigo || '').trim())) e.items = 'Cada ítem necesita cantidad, código y valor unitario.';
    if (!p.condicionPago) e.condicionPago = 'Obligatorio.';
    if (!p.plazo) e.plazo = 'Obligatorio.';
    if (!(+p.validezDias > 0)) e.validezDias = 'Obligatorio.';
    if (p.descuentoTipo === 'pct' && !(+p.descuentoPct >= 0 && +p.descuentoPct < 100)) e.descuento = 'El descuento debe estar entre 0 % y 99 %.';
    if (p.descuentoTipo !== 'pct' && +p.descuento < 0) e.descuento = 'El descuento no puede ser negativo.';
    if (p.modo !== 'revision' && p.modo !== 'alternativa') {
      if (!p.proyectoId && !p.proyectoNuevo) e.proyecto = 'Indica el proyecto o "Compra directa".';
      if (p.proyectoNuevo && (!String(p.proyectoNuevo.nombre || '').trim() || !String(p.proyectoNuevo.usuarioFinal || '').trim())) e.proyecto = 'El proyecto nuevo necesita nombre y usuario final.';
    }
    if (String(p.condicionEspecial || '').length > 1500) e.condicionEspecial = 'La condición especial no puede pasar de 1,500 caracteres.';
    if (!p.proxContacto) e.proxContacto = 'Define el próximo contacto.';
    else if (p.proxContacto < hoy) e.proxContacto = 'No puede estar en el pasado.';
    if (!p.fechaOC) e.fechaOC = 'Elige la fecha estimada de OC (no tiene valor por defecto).';
    else if (p.fechaOC < hoy) e.fechaOC = 'No puede estar en el pasado.';
    if (!Config.HORIZONTES.some(h => h.id === p.facturacion)) e.facturacion = 'Elige cuándo estimas facturar (no tiene valor por defecto).';
    return e;
  }
  /** Invariantes de una oportunidad (el Repo las exige antes de guardar) */
  function validarOportunidad(o) {

  function puede(user, accion, opp) {

  /** Quién marca cada paso de post-venta. Con "post-venta por área" (piloto): logística los pasos físicos y finanzas factura y cobro. */

  /** Número por Account Manager: INICIALES-AÑO-0001, correlativo propio que reinicia cada año (se calcula desde las cotizaciones registradas) */

        const c = (h.rows[i] || []).map(t), m = {};
        COLS_CLIENTES.forEach(([k, rx]) => { const j = c.findIndex(x => rx.test(x)); if (j >= 0) m[k] = j; });

    const vends = db.users.filter(u => u.rol === 'vendedor' && u.activo !== false), ini = id => (db.users.find(u => u.id === id) || {}).iniciales || '?';
    const porRuc = new Map(db.clients.filter(c => c.ruc).map(c => [t(c.ruc).toUpperCase(), c])), porNombre = new Map(db.clients.map(c => [nrm(c.razonSocial), c]));
    const vistos = new Set(), filas = [];
    for (let i = desde; i < hoja.rows.length; i++) {
      const r = hoja.rows[i] || [], v = k => col[k] == null ? '' : t(r[col[k]]);
      const d = { ruc: v('ruc').replace(/\s/g, ''), razonSocial: v('razonSocial'), vendedor: v('vendedor'), rubro: v('rubro'), direccion: v('direccion'), distrito: v('distrito'), ciudad: v('ciudad'), pais: v('pais') };
      if (!d.ruc && !d.razonSocial) continue;
      const f = { fila: i + 1, razonSocial: d.razonSocial || d.ruc, cambios: [] }, mal = msg => { f.tipo = 'error'; f.error = msg; };
      filas.push(f);

      if (vistos.has(clave)) { mal('Fila repetida en el archivo.'); continue; }

        if (!u) { mal(`No hay un vendedor activo "${d.vendedor}": usa las iniciales de la hoja Vendedores.`); continue; }
