          resultado: k < 2 ? 'sin_respuesta' : 'respondio', nota: k < 2 ? pick2(NOTA_SR) : pick2(NOTA_OK), usuarioId: c.vendedorId });
      }
    });

    db.opps.forEach(o => { delete o._ultimoNumero; });
    // Lista de precios FICTICIA para la demo (la real se importa o se carga desde un archivo privado)
    db.catalogo = CATALOGO.map((p, i) => ({ id: 'P-' + (i + 1), marca: p.marca, codigo: p.codigo, descripcion: p.descripcion, precio: p.precio, actualizado: addDays(hoy, -20), actualizadoPor: 'u7' }));
    db.seq.producto = db.catalogo.length + 1;
    db.catalogoInfo = { actualizado: addDays(hoy, -20), por: 'u7', origen: 'demo' };
    db.catalogoLog = [{ fecha: addDays(hoy, -20), usuarioId: 'u7', accion: `Lista de precios de demostración cargada (${db.catalogo.length} productos ficticios)` }];
    return db;
  }

  return { generate, CATALOGO, SEED };
})();

/* =====================================================================
   CAPA 4 · RULES — reglas de negocio puras (no tocan la interfaz ni guardan nada).
   Reciben la data (snapshot) y devuelven resultados. El backend final debe
   implementar exactamente estas mismas reglas.
   ===================================================================== */
const Rules = (() => {
  const etapa = id => Config.ETAPAS.find(e => e.id === id);
  const condicion = id => Config.CONDICIONES_PAGO.find(c => c.id === id);
  const plazo = id => Config.PLAZOS_ENTREGA.find(p => p.id === id);
  const motivo = id => Config.MOTIVOS_PERDIDA.find(m => m.id === id);
  const esAbierta = o => !!(etapa(o.etapa) || {}).abierta;
  const ETAPAS_ABIERTAS = Config.ETAPAS.filter(e => e.abierta).map(e => e.id);
  /** Probabilidad derivada de la etapa (el vendedor no la escribe). Pausa queda fuera del funnel → 0 en cálculos. */
  const prob = id => { const e = etapa(id); return e && e.prob != null ? e.prob : 0; };

  /* Índices en memoria (se recalculan cuando cambia la versión de la data) */
  function ix(db) {
    if (db.__ix && db.__ix.v === db._v) return db.__ix;
    const m = { v: db._v, quotesByOpp: {}, fuByOpp: {}, opp: {}, client: {}, project: {}, user: {}, seg: null };
    const byDate = k => (x, y) => x[k] < y[k] ? -1 : x[k] > y[k] ? 1 : 0;
    db.quotes.forEach(q => (m.quotesByOpp[q.oppId] = m.quotesByOpp[q.oppId] || []).push(q));
    Object.values(m.quotesByOpp).forEach(a => a.sort(byDate('fechaEmision')));
    db.followups.forEach(f => (m.fuByOpp[f.oppId] = m.fuByOpp[f.oppId] || []).push(f));
    Object.values(m.fuByOpp).forEach(a => a.sort(byDate('fecha')));
    db.opps.forEach(o => { m.opp[o.id] = o; });
    db.clients.forEach(c => { m.client[c.id] = c; });
    db.projects.forEach(p => { m.project[p.id] = p; });
    db.users.forEach(u => { m.user[u.id] = u; });
    Object.defineProperty(db, '__ix', { value: m, writable: true, configurable: true, enumerable: false });
    return m;
  }
  const quotesOf = (db, opp) => ix(db).quotesByOpp[opp.id] || [];
  const followupsOf = (db, opp) => ix(db).fuByOpp[opp.id] || [];
  const vigente = (db, opp) => { const qs = quotesOf(db, opp); return qs.find(q => q.vigente) || qs[qs.length - 1] || null; };

  /** Totales de una cotización en su moneda: suma, descuento, neto sin IGV, IGV 18 % y total */
  function totales(q) {
    const suma = Util.round2(Util.sum(q.items, it => (+it.cant || 0) * (+it.valorUnit || 0)));
    // descuento en monto o en porcentaje sobre la suma
    const descuento = q.descuentoTipo === 'pct' ? Util.round2(suma * (+q.descuentoPct || 0) / 100) : Util.round2(+q.descuento || 0);
    const neto = Util.round2(suma - descuento);
    const igv = Util.round2(neto * Config.IGV);
    return { suma, descuento, neto, igv, total: Util.round2(neto + igv), descuentoPct: q.descuentoTipo === 'pct' ? (+q.descuentoPct || 0) : (suma ? Util.round2(descuento / suma * 100) : 0) };
  }
  /** PEN → USD con el tipo de cambio del día de emisión guardado en la cotización */
  const aUSD = (monto, q) => q.moneda === 'PEN' ? monto / (q.tc || Config.TC_REFERENCIA) : monto;
  const quoteNetoUSD = q => q ? Util.round2(aUSD(totales(q).neto, q)) : 0;
  const quoteTotalUSD = q => q ? Util.round2(aUSD(totales(q).total, q)) : 0;
  const montoUSD = (db, opp) => quoteNetoUSD(vigente(db, opp));
  /** Monto ponderado = neto USD (sin IGV) × probabilidad de la etapa */
  function ponderado(db, opp) {
    if (opp.etapa === 'pausa' || opp.etapa === 'perdida') return 0;
    return Util.round2(montoUSD(db, opp) * prob(opp.etapa));
  }
  function marcaPrincipal(q) {
    if (!q) return '—';
    const by = {};
    q.items.forEach(it => { by[it.marca] = (by[it.marca] || 0) + it.cant * it.valorUnit; });
    return Object.keys(by).sort((a, b) => by[b] - by[a])[0] || '—';
  }
  const marcas = q => q ? [...new Set(q.items.map(it => it.marca))] : [];
  function resumenItems(q) {
    if (!q || !q.items.length) return '—';
    const top = q.items.slice().sort((a, b) => b.cant * b.valorUnit - a.cant * a.valorUnit);
    return top.slice(0, 2).map(it => `${it.cant}x ${it.codigo}`).join(', ') + (top.length > 2 ? ` +${top.length - 2}` : '');
  }
  const maxSemanas = id => (plazo(id) || { maxSemanas: 0 }).maxSemanas;
  const fechaOCRef = opp => opp.etapa === 'ganada' ? ((opp.postventa && opp.postventa.oc) || opp.fechaOC) : opp.fechaOC;
  /** Fecha estimada de factura = fecha de OC + extremo mayor del plazo de entrega (se factura al entregar) */
  function fechaFactura(db, opp) {
    if (opp.postventa && opp.postventa.facturado) return opp.postventa.facturado;
    const oc = fechaOCRef(opp), q = vigente(db, opp);
    if (!oc || !q) return null;
    return Util.addDays(oc, maxSemanas(q.plazo) * 7);
  }
  /** Eventos de cobro (con IGV, en USD) según la condición de pago */
  function eventosCobro(db, opp) {
    const q = vigente(db, opp);
    if (!q) return [];
    const cp = condicion(q.condicionPago) || Config.CONDICIONES_PAGO[0];
    const total = quoteTotalUSD(q);
    const oc = fechaOCRef(opp), fac = fechaFactura(db, opp);
    const pv = opp.postventa || {};
    return cp.cobro.map(rg => {
      const base = rg.base === 'oc' ? oc : fac;
      return { fecha: base ? Util.addDays(base, rg.dias) : null, monto: Util.round2(total * rg.pct), pct: rg.pct, base: rg.base, dias: rg.dias,
        cobrado: !!pv.cobrado || (rg.base === 'oc' && !!pv.adelantoCobrado) };
    });
  }
  /** Horizonte FACT: antes de fin de mes → "Este mes"; luego 30, 60, 90 y 120 días (más de 90). Fechas pasadas → este mes. */
  function horizonte(fecha, hoy = Util.today()) {
    if (!fecha) return null;
    if (fecha <= Util.endOfMonth(hoy)) return 'mes';
    const d = Util.diffDays(hoy, fecha);
    if (d <= 30) return 'd30';
    if (d <= 60) return 'd60';
    if (d <= 90) return 'd90';
    return 'd120';
  }
  const horizonteNombre = id => id ? Config.HORIZONTES.find(h => h.id === id).nombre : 'Sin fecha';
  const BASE_COBRO = { oc: 'en la OC', entrega: 'contra entrega', factura: 'factura' };

  /** Proyección de facturación (sin IGV) o cobranza (con IGV). Ganadas al 100 %, abiertas ponderadas. */
  function proyeccion(db, { tipo = 'facturacion', vendedorId = null, condicionPago = null, hoy = Util.today() } = {}) {
    const filas = [];
    db.opps.forEach(opp => {
      if (vendedorId && opp.vendedorId !== vendedorId) return;
      const ganada = opp.etapa === 'ganada', abierta = esAbierta(opp);
      if (!ganada && !abierta) return;
      const q = vigente(db, opp);
      if (!q) return;
      if (condicionPago && q.condicionPago !== condicionPago) return;
      const factor = ganada ? 1 : prob(opp.etapa);
      const clase = ganada ? 'ganada' : 'abierta';
      if (tipo === 'facturacion') {
        if (ganada && opp.postventa && opp.postventa.facturado) return;
        const fecha = fechaFactura(db, opp), base = montoUSD(db, opp);
        filas.push({ opp, q, clase, fecha, horizonte: horizonte(fecha, hoy), base, factor, monto: Util.round2(base * factor), concepto: 'Factura', vencida: !!fecha && fecha < hoy });
      } else {
        eventosCobro(db, opp).forEach(ev => {
          if (ev.cobrado) return;
          const concepto = Math.round(ev.pct * 100) + '% ' + (ev.base === 'factura' ? `a factura + ${ev.dias} d` : BASE_COBRO[ev.base]);
          filas.push({ opp, q, clase, fecha: ev.fecha, horizonte: horizonte(ev.fecha, hoy), base: ev.monto, factor, monto: Util.round2(ev.monto * factor), concepto, vencida: !!ev.fecha && ev.fecha < hoy });
        });
      }
    });
    const keys = Config.HORIZONTES.map(h => h.id).concat(['sin', 'total']);
    const blank = () => keys.reduce((m, k) => (m[k] = 0, m), {});
    const tot = { ganada: blank(), abierta: blank(), total: blank() };
    filas.forEach(f => {
      const k = f.horizonte || 'sin';
      [tot[f.clase], tot.total].forEach(t => { t[k] += f.monto; t.total += f.monto; });
    });
    return { filas, tot };
  }

  /* ---------- Facturación, meta y cobertura ---------- */
  const facturadas = (db, { desde, hasta, vendedorId = null }) => db.opps.filter(o => o.postventa && o.postventa.facturado &&
    o.postventa.facturado >= desde && o.postventa.facturado <= hasta && (!vendedorId || o.vendedorId === vendedorId));
  const montoFactura = o => o.postventa.facturaMonto || 0;
  function facturadoMes(db, vendedorId, mesKey) {
    const desde = mesKey + '-01', hasta = Util.endOfMonth(desde);
    return Util.round2(Util.sum(facturadas(db, { desde, hasta, vendedorId }), montoFactura));
  }
  /** Avance de meta: facturado sin IGV del mes vs meta; cobertura = (ganadas por facturar en el mes + ponderado con factura estimada en el mes) / lo que falta */
  function avanceMeta(db, vendedorId, hoy = Util.today()) {
    const u = ix(db).user[vendedorId];
    const meta = (u && u.meta) || Config.META_MENSUAL_USD;
    const facturado = facturadoMes(db, vendedorId, Util.monthKey(hoy));
    const falta = Math.max(0, Util.round2(meta - facturado));
    const eom = Util.endOfMonth(hoy);
    let ganadasPorFacturar = 0, ponderadoMes = 0;
    db.opps.forEach(o => {
      if (o.vendedorId !== vendedorId) return;
      const f = fechaFactura(db, o);
      if (!f || f > eom) return;
      if (o.etapa === 'ganada' && !(o.postventa && o.postventa.facturado)) ganadasPorFacturar += montoUSD(db, o);
      else if (esAbierta(o)) ponderadoMes += ponderado(db, o);
    });
    return { meta, facturado, avance: facturado / meta, falta, ganadasPorFacturar: Util.round2(ganadasPorFacturar), ponderadoMes: Util.round2(ponderadoMes),
      cobertura: falta > 0 ? (ganadasPorFacturar + ponderadoMes) / falta : null };
  }
  /** Tasa de cierre = ganadas ÷ (ganadas + perdidas). Excluye "ganó otro integrador" y las pausas. Por cantidad y por monto. */
  function tasaCierre(db, { vendedorId = null, desde, hasta }) {
    const enRango = o => (!vendedorId || o.vendedorId === vendedorId) && o.fechaCierre && o.fechaCierre >= desde && o.fechaCierre <= hasta;
    const g = db.opps.filter(o => o.etapa === 'ganada' && enRango(o));
    const p = db.opps.filter(o => o.etapa === 'perdida' && enRango(o) && !(motivo(o.motivoPerdida) || {}).noCuentaComoPerdida);
    const mg = Util.sum(g, o => montoUSD(db, o)), mp = Util.sum(p, o => montoUSD(db, o));
    return { ganadas: g.length, perdidas: p.length, montoGanado: mg, montoPerdido: mp,
      tasaCantidad: g.length + p.length ? g.length / (g.length + p.length) : null, tasaMonto: mg + mp ? mg / (mg + mp) : null };
  }
  function cicloVenta(db, { vendedorId = null, desde, hasta }) {
    const g = db.opps.filter(o => o.etapa === 'ganada' && o.fechaCierre >= desde && o.fechaCierre <= hasta && (!vendedorId || o.vendedorId === vendedorId));
    return g.length ? Util.sum(g, o => Util.diffDays(o.fechaInicio, o.fechaCierre)) / g.length : null;
  }
  const cotizacionesEnviadas = (db, { vendedorId = null, desde, hasta }) => db.quotes.filter(q => {
    const o = ix(db).opp[q.oppId];
    return o && (!vendedorId || o.vendedorId === vendedorId) && q.fechaEmision >= desde && q.fechaEmision <= hasta;
  }).length;
  function ranking(db, hoy = Util.today()) {
    const desde6 = Util.addMonths(hoy, -5), mesIni = Util.startOfMonth(hoy);
    const filas = db.users.filter(u => u.rol === 'vendedor').map(v => Object.assign({ v },
      avanceMeta(db, v.id, hoy),
      { tasa: tasaCierre(db, { vendedorId: v.id, desde: desde6, hasta: hoy }),
        enviadasMes: cotizacionesEnviadas(db, { vendedorId: v.id, desde: mesIni, hasta: hoy }),
        enviadas6m: cotizacionesEnviadas(db, { vendedorId: v.id, desde: desde6, hasta: hoy }),
        ciclo: cicloVenta(db, { vendedorId: v.id, desde: desde6, hasta: hoy }) }));
    filas.sort((a, b) => b.facturado - a.facturado);
    filas.forEach((f, i) => { f.pos = i + 1; });
    return filas;
  }

  /* ---------- Segmento del cliente (T1 / T2 / CO) — facturado últimos 12 meses ---------- */
  function segmento(db, clienteId, hoy = Util.today()) {
    const m = ix(db);
    if (!m.seg || m.segHoy !== hoy) {
      const desde = Util.addDays(hoy, -365), mesDesde = Util.monthKey(desde), tot = {};
      db.opps.forEach(o => { if (o.postventa && o.postventa.facturado && o.postventa.facturado >= desde && o.postventa.facturado <= hoy) tot[o.clienteId] = (tot[o.clienteId] || 0) + (o.postventa.facturaMonto || 0); });
      (db.historico || []).forEach(h => { if (h.mes > mesDesde) tot[h.clienteId] = (tot[h.clienteId] || 0) + h.montoUSD; });
      m.seg = tot; m.segHoy = hoy;
    }
    const total = m.seg[clienteId] || 0;
    return { seg: total > Config.SEGMENTO_T1_USD ? 'T1' : total >= Config.SEGMENTO_T2_USD ? 'T2' : 'CO', total };
  }

  /* ---------- Cuentas: estado y alerta por falta de cotización ---------- */
  /** Para cada cliente: última cotización, días sin cotizar, contactos (seguimientos de sus oportunidades + gestiones de cuenta),
      estado (activo / no responde / sin contacto) y si corresponde alerta (más de 60 días sin cotizar y sin respuesta). */
  function cuentas(db, hoy = Util.today()) {
    const m = ix(db);
    if (m.cta && m.ctaHoy === hoy) return m.cta;
    const res = {}, lim = Util.addDays(hoy, -Config.CUENTA_INACTIVA_DIAS);
    db.clients.forEach(c => { res[c.id] = { ultimaCot: null, contactos: [], abiertas: 0, opps: 0 }; });
    db.opps.forEach(o => {
      const r = res[o.clienteId];
      if (!r) return;
      r.opps++;
      if (esAbierta(o)) r.abiertas++;
      quotesOf(db, o).forEach(q => { if (q.fechaEmision <= hoy && (!r.ultimaCot || q.fechaEmision > r.ultimaCot)) r.ultimaCot = q.fechaEmision; });
      followupsOf(db, o).forEach(f => { if (!f.auto && f.canal !== 'Sistema') r.contactos.push({ fecha: f.fecha, resultado: f.resultado || 'respondio', canal: f.canal, nota: f.nota, oppId: o.id, usuarioId: f.usuarioId }); });
    });
    (db.gestiones || []).forEach(g => { const r = res[g.clienteId]; if (r) r.contactos.push({ fecha: g.fecha, resultado: g.resultado, canal: g.canal, nota: g.nota, gestion: true, usuarioId: g.usuarioId }); });
    db.clients.forEach(c => {
      const r = res[c.id];
      r.contactos.sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0);
      r.ultimoContacto = r.contactos[0] || null;
      r.diasSinCotizar = Util.diffDays(r.ultimaCot || c.fechaAlta || hoy, hoy);
      const rec = r.contactos.filter(k => k.fecha >= lim && k.fecha <= hoy);
      r.estado = r.diasSinCotizar < Config.CUENTA_INACTIVA_DIAS || rec.some(k => k.resultado === 'respondio') ? 'activo' : rec.length ? 'no_responde' : 'sin_contacto';
      r.alerta = r.estado !== 'activo';
    });
    m.cta = res; m.ctaHoy = hoy;
    return res;
  }
  const cuenta = (db, clienteId, hoy = Util.today()) => cuentas(db, hoy)[clienteId];
  function alertaCuenta(db, c, hoy = Util.today()) {
    const r = cuenta(db, c.id, hoy);
    if (!r || !r.alerta) return null;
    const est = Config.ESTADOS_CUENTA[r.estado];
    return { tipo: 'cuenta_inactiva', nivel: r.estado === 'sin_contacto' ? 'bad' : 'warn', dias: r.diasSinCotizar, estado: r.estado,
      texto: `${r.ultimaCot ? 'Sin cotizar hace' : 'Sin cotizaciones desde su alta hace'} ${r.diasSinCotizar} días · ${est.nombre}` };
  }
  function validarCliente(db, d) {
    const e = {};
    if (!String(d.razonSocial || '').trim()) e.razonSocial = 'La razón social es obligatoria.';
    if (!/^\d{11}$/.test(String(d.ruc || '').trim())) e.ruc = 'El RUC debe tener 11 dígitos.';
    else {
      const ex = db.clients.find(c => c.ruc === String(d.ruc).trim());
      if (ex) e.ruc = `Ya existe una cuenta con ese RUC: ${ex.razonSocial}${ex.vendedorId ? ' (asignada a ' + ix(db).user[ex.vendedorId].nombre + ')' : ' (sin asignar)'}.`;
    }
    if (d.contacto && (d.contacto.correo || d.contacto.telefono || d.contacto.cargo) && !String(d.contacto.nombre || '').trim()) e.contactoNombre = 'Indica el nombre del contacto.';
    return e;
  }
  function validarContacto(k) {
    const e = {};
    if (!String(k.nombre || '').trim()) e.nombre = 'El nombre es obligatorio.';
    if (k.correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(k.correo).trim())) e.correo = 'Correo no válido.';
    return e;
  }

  /* ---------- Alertas de seguimiento ---------- */
  function alertasOpp(db, opp, hoy = Util.today()) {
    const out = [];
    if (esAbierta(opp)) {
      if (!opp.proxContacto) out.push({ tipo: 'sin_proximo', nivel: 'bad', texto: opp.pendiente ? 'Leída del correo: falta etapa, próximo contacto y fecha de OC' : 'Sin próximo contacto' });
      else if (opp.proxContacto === hoy) out.push({ tipo: 'hoy', nivel: 'info', texto: 'Contactar hoy' });
      else if (opp.proxContacto < hoy) {
        const dh = Util.bizDaysBetween(opp.proxContacto, hoy), esc = dh > Config.ESCALAR_ATRASO_DH;
        out.push({ tipo: 'atrasado', nivel: esc ? 'bad' : 'warn', dias: dh, escalado: esc,
          texto: `Atrasado ${dh} día${dh === 1 ? '' : 's'} hábil${dh === 1 ? '' : 'es'}` + (esc ? ' · escalado a jefatura' : '') });
      }
      const manuales = followupsOf(db, opp).filter(f => !f.auto);
      const limite = Util.addBizDays(opp.fechaInicio, Config.PRIMER_SEGUIMIENTO_DH);
      if (!manuales.length && limite < hoy && !out.some(a => a.tipo === 'atrasado' || a.tipo === 'sin_proximo'))
        out.push({ tipo: 'primer_seguimiento', nivel: 'warn', texto: `Primer seguimiento pendiente (límite ${Util.fmtDate(limite)})` });
      const q = vigente(db, opp);
      if (q) {
        const vence = Util.addDays(q.fechaEmision, q.validezDias), d = Util.diffDays(hoy, vence);
        if (d >= 0 && d <= Config.AVISO_VENCIMIENTO_DIAS) out.push({ tipo: 'por_vencer', nivel: 'warn', texto: d === 0 ? 'La cotización vence hoy' : 'La cotización vence mañana', fecha: vence });
      }
      if (opp.fechaOC && opp.fechaOC < hoy) out.push({ tipo: 'oc_vencida', nivel: 'warn', texto: `Fecha estimada de OC vencida (${Util.fmtDate(opp.fechaOC)}) y sin OC` });
    } else if (opp.etapa === 'pausa' && opp.fechaReactivacion && opp.fechaReactivacion <= hoy) {
      out.push({ tipo: 'reactivar', nivel: 'info', texto: `Toca reactivar (programado ${Util.fmtDate(opp.fechaReactivacion)})` });
    }
    return out;
  }
  /** Alertas que ve cada usuario en la campana */
  function alertasUsuario(db, user, hoy = Util.today()) {
    if (!user || !['vendedor', 'jefatura'].includes(user.rol)) return [];
    const out = [];
    db.opps.forEach(o => {
      if (user.rol === 'vendedor' && o.vendedorId !== user.id) return;
      alertasOpp(db, o, hoy).forEach(a => {
        if (user.rol === 'jefatura' && !a.escalado) return;   // jefatura recibe los escalados (> 5 días hábiles)
        out.push({ opp: o, alerta: a });
      });
    });
    // Cuentas sin cotizar (~2 meses): llegan al vendedor asignado y a jefatura
    db.clients.forEach(c => {
      if (user.rol === 'vendedor' && c.vendedorId !== user.id) return;
      const a = alertaCuenta(db, c, hoy);
      if (a) out.push({ cliente: c, alerta: a });
    });
    const orden = { sin_proximo: 0, atrasado: 1, primer_seguimiento: 2, hoy: 3, por_vencer: 4, oc_vencida: 5, reactivar: 6, cuenta_inactiva: 7 };
    return out.sort((a, b) => orden[a.alerta.tipo] - orden[b.alerta.tipo] || (b.alerta.dias || 0) - (a.alerta.dias || 0));
  }
  function saludSeguimiento(db, { vendedorId = null, hoy = Util.today() } = {}) {
    const abiertas = db.opps.filter(o => esAbierta(o) && (!vendedorId || o.vendedorId === vendedorId));
    let vigentes = 0, atrasados = 0, escalados = 0, sinProx = 0;
    abiertas.forEach(o => {
      if (!o.proxContacto) sinProx++;
      else if (o.proxContacto >= hoy) vigentes++;
      else { atrasados++; if (Util.bizDaysBetween(o.proxContacto, hoy) > Config.ESCALAR_ATRASO_DH) escalados++; }
    });
    return { abiertas: abiertas.length, vigentes, atrasados, escalados, sinProx, pctVigente: abiertas.length ? vigentes / abiertas.length : null };
  }

  /* ---------- Validaciones (la UI las muestra; el Repo/backend las vuelve a exigir) ---------- */
  function validarCambioEtapa(opp, nueva, d = {}, hoy = Util.today()) {
    const errs = {};
    const e = etapa(nueva);
    if (!e) { errs.etapa = 'Etapa no válida.'; return errs; }
    if (nueva === 'perdida') {
      if (!d.motivoPerdida) errs.motivoPerdida = 'El motivo de pérdida es obligatorio.';
      else if ((motivo(d.motivoPerdida) || {}).requiereTexto && !String(d.motivoOtro || '').trim()) errs.motivoOtro = 'Describe el motivo.';
    } else if (nueva === 'pausa') {
      if (!d.fechaReactivacion) errs.fechaReactivacion = 'La fecha de reactivación es obligatoria.';
      else if (d.fechaReactivacion <= hoy) errs.fechaReactivacion = 'Debe ser una fecha futura.';
    } else if (nueva === 'ganada') {
      if (!d.fechaOCReal) errs.fechaOCReal = 'Indica la fecha en que llegó la OC.';
      else if (d.fechaOCReal > hoy) errs.fechaOCReal = 'La OC no puede tener fecha futura.';
    } else if (e.abierta) {
      if (!d.proxContacto) errs.proxContacto = 'Define el próximo contacto: ninguna oportunidad abierta puede quedar sin él.';
      else if (d.proxContacto < hoy) errs.proxContacto = 'El próximo contacto no puede estar en el pasado.';
      if (d.exigirFechaOC && !d.fechaOC) errs.fechaOC = 'Indica la fecha estimada de OC.';
    }
    return errs;
  }
  function validarCotizacion(p, hoy = Util.today()) {
    const e = {};
    if (!p.clienteId && !(p.clienteNuevo && p.clienteNuevo.razonSocial)) e.cliente = 'Selecciona o registra el cliente.';
    if (p.clienteNuevo && !/^\d{11}$/.test(p.clienteNuevo.ruc || '')) e.ruc = 'El RUC debe tener 11 dígitos.';
    if (!String(p.numero || '').trim()) e.numero = 'Ingresa el número tal como figura en el PDF.';
    if (!p.fechaEmision) e.fechaEmision = 'Fecha obligatoria.';
    if (p.moneda === 'PEN' && !(+p.tc > 0)) e.tc = 'Tipo de cambio obligatorio para PEN.';
    const items = (p.items || []).filter(it => String(it.codigo || '').trim() || +it.valorUnit);
    if (!items.length) e.items = 'Agrega al menos un ítem.';
    else if (items.some(it => !(+it.cant > 0) || !(+it.valorUnit > 0) || !String(it.codigo || '').trim())) e.items = 'Cada ítem necesita cantidad, código y valor unitario.';
    if (!p.condicionPago) e.condicionPago = 'Obligatorio.';
    if (!p.plazo) e.plazo = 'Obligatorio.';
    if (!(+p.validezDias > 0)) e.validezDias = 'Obligatorio.';
    if (p.descuentoTipo === 'pct' && !(+p.descuentoPct >= 0 && +p.descuentoPct < 100)) e.descuento = 'El descuento debe estar entre 0 % y 99 %.';
    if (p.descuentoTipo !== 'pct' && +p.descuento < 0) e.descuento = 'El descuento no puede ser negativo.';
    if (p.modo !== 'revision' && p.modo !== 'alternativa') {
      if (!p.proyectoId && !p.proyectoNuevo) e.proyecto = 'Indica el proyecto o "Compra directa".';
      if (p.proyectoNuevo && (!String(p.proyectoNuevo.nombre || '').trim() || !String(p.proyectoNuevo.usuarioFinal || '').trim())) e.proyecto = 'El proyecto nuevo necesita nombre y usuario final.';
    }
    if (!p.proxContacto) e.proxContacto = 'Define el próximo contacto.';
    else if (p.proxContacto < hoy) e.proxContacto = 'No puede estar en el pasado.';
    if (!p.fechaOC) e.fechaOC = 'Elige la fecha estimada de OC (no tiene valor por defecto).';
    else if (p.fechaOC < hoy) e.fechaOC = 'No puede estar en el pasado.';
    return e;
  }
  /** Invariantes de una oportunidad (el Repo las exige antes de guardar) */
  function validarOportunidad(o) {
    if (esAbierta(o) && !o.pendiente && !o.proxContacto) return 'Ninguna oportunidad abierta puede quedar sin próximo contacto.';
    if (o.etapa === 'perdida' && !o.motivoPerdida) return 'Una oportunidad perdida necesita motivo.';
    if (o.etapa === 'pausa' && !o.fechaReactivacion) return 'Una oportunidad en pausa necesita fecha de reactivación.';
    return null;
  }

  /* ---------- Revisiones, duplicados y proyectos con varios integradores ---------- */
  function candidatosRevision(db, { ruc, proyectoId }) {
    if (!ruc || !proyectoId) return [];
    const cls = db.clients.filter(c => c.ruc === ruc).map(c => c.id);
    return db.opps.filter(o => cls.includes(o.clienteId) && o.proyectoId === proyectoId && (esAbierta(o) || o.etapa === 'pausa'));
  }
  function siguienteRevision(db, opp) {
    const n = quotesOf(db, opp).filter(q => /^R\d+$/.test(q.revision)).reduce((m, q) => Math.max(m, +q.revision.slice(1)), 0);
    return 'R' + (n + 1);
  }
  const numeroDuplicado = (db, numero, exceptoId) => { const k = Util.normNum(numero); return k ? db.quotes.filter(q => q.id !== exceptoId && Util.normNum(q.numero) === k) : []; };
  const hermanos = (db, opp) => (!opp.proyectoId || opp.proyectoId === 'PR-DIRECTA') ? [] : db.opps.filter(o => o.id !== opp.id && o.proyectoId === opp.proyectoId);

  /* ---------- Permisos por rol ---------- */
  const RUTAS = {
    vendedor: ['mi-dia', 'oportunidades', 'op', 'nueva', 'cuentas', 'cuenta', 'contactos', 'catalogo', 'proyeccion', 'ranking', 'notificaciones'],
    jefatura: ['dashboard', 'oportunidades', 'op', 'cuentas', 'cuenta', 'contactos', 'catalogo', 'proyeccion', 'facturado', 'notificaciones'],
    finanzas: ['proyeccion', 'facturado', 'contactos', 'catalogo'],
    admin: ['catalogo', 'contactos'],
  };
  const INICIO = { vendedor: 'mi-dia', jefatura: 'dashboard', finanzas: 'proyeccion', admin: 'catalogo' };
  function puede(user, accion, opp) {
    if (!user) return false;
    switch (accion) {
      case 'ver_opp': return user.rol === 'jefatura' || (user.rol === 'vendedor' && !!opp && opp.vendedorId === user.id);
      case 'editar_opp': return user.rol === 'vendedor' && !!opp && opp.vendedorId === user.id;
      case 'reasignar': return user.rol === 'jefatura';
      case 'crear_cotizacion': return user.rol === 'vendedor';
      case 'ver_todo': return user.rol === 'jefatura' || user.rol === 'finanzas';
      // Cuentas (opp = cliente en estos casos)
      case 'ver_cuenta': return user.rol === 'jefatura' || (user.rol === 'vendedor' && !!opp && opp.vendedorId === user.id);
      case 'editar_contactos': return user.rol === 'jefatura' || (user.rol === 'vendedor' && !!opp && opp.vendedorId === user.id);
      case 'gestionar_cuenta': return user.rol === 'vendedor' && !!opp && opp.vendedorId === user.id;
      case 'crear_cuenta': return user.rol === 'vendedor' || user.rol === 'jefatura';
      case 'asignar_cuenta': return user.rol === 'jefatura';
      // Lista de precios: todos la consultan; solo jefatura, finanzas y administración la modifican
      case 'ver_catalogo': return true;
      case 'editar_catalogo': return ['jefatura', 'finanzas', 'admin'].includes(user.rol);
      default: return false;
    }
  }
  const puedeRuta = (user, ruta) => !!user && (RUTAS[user.rol] || []).includes(ruta);
  const oppsVisibles = (db, user) => user.rol === 'jefatura' ? db.opps : user.rol === 'vendedor' ? db.opps.filter(o => o.vendedorId === user.id) : [];

  return { etapa, condicion, plazo, motivo, esAbierta, ETAPAS_ABIERTAS, prob, ix, quotesOf, followupsOf, vigente, totales, aUSD, quoteNetoUSD,
    quoteTotalUSD, montoUSD, ponderado, marcaPrincipal, marcas, resumenItems, maxSemanas, fechaOCRef, fechaFactura, eventosCobro, horizonte,
    horizonteNombre, proyeccion, facturadas, facturadoMes, avanceMeta, tasaCierre, cicloVenta, cotizacionesEnviadas, ranking, segmento,
    alertasOpp, alertasUsuario, saludSeguimiento, cuentas, cuenta, alertaCuenta, validarCliente, validarContacto, validarCambioEtapa, validarCotizacion, validarOportunidad, candidatosRevision,
    siguienteRevision, numeroDuplicado, hermanos, RUTAS, INICIO, puede, puedeRuta, oppsVisibles };
})();

/* =====================================================================
   CAPA 3 · REPO — única puerta de lectura/escritura de la data.
   Todos los métodos son asíncronos (devuelven Promesas) para que el developer
   los reemplace por llamadas HTTP a la API sin tocar la interfaz.
   Hoy guarda todo en memoria; no usa localStorage ni ningún almacenamiento.
   ===================================================================== */
const Repo = (() => {
  let db = null;
  const hoy = () => Util.today();
  const touch = () => { db._v++; };
  const fail = (msg, campos) => { const e = new Error(msg); e.campos = campos || {}; throw e; };
  const opp = id => db.opps.find(o => o.id === id) || fail('Oportunidad no encontrada.');
  const log = (o, nota, usuarioId) => db.followups.push({ id: 'S-' + (db.seq.fu++), oppId: o.id, fecha: hoy(), canal: 'Sistema', nota, proxContacto: o.proxContacto || null, usuarioId, auto: true });
  const guardar = o => { const e = Rules.validarOportunidad(o); if (e) fail(e); touch(); };
  /** Si el HTML trae una lista de precios privada (copia local, nunca publicada), reemplaza a la ficticia */
  function cargarListaPrivada() {
    const L = typeof window !== 'undefined' && window.__LISTA_PRECIOS_PRIVADA;
    if (!Array.isArray(L) || !L.length) return;
    const f = window.__LISTA_PRECIOS_FECHA || hoy();
    db.catalogo = L.map((r, i) => ({ id: 'P-' + (i + 1), marca: r[0], codigo: String(r[1]), descripcion: r[2], precio: r[3], actualizado: f, actualizadoPor: null }));
    db.seq.producto = L.length + 1;
    db.catalogoInfo = { actualizado: f, por: null, origen: 'privado', archivo: window.__LISTA_PRECIOS_ARCHIVO || '' };
    db.catalogoLog.unshift({ fecha: f, usuarioId: null, accion: `Lista de precios real cargada desde archivo privado (${L.length} productos)` });
  }
  const editorCatalogo = usuarioId => {
    const u = db.users.find(x => x.id === usuarioId);
    if (!Rules.puede(u, 'editar_catalogo')) fail('Solo jefatura, finanzas o administración pueden modificar la lista de precios.');
    return u;
  };
  const logCatalogo = (usuarioId, accion) => db.catalogoLog.unshift({ fecha: hoy(), usuarioId, accion });

  return {
    /** GET /demo/reset  (en producción: carga inicial desde la API) */
    async init() { db = DemoData.generate(hoy()); cargarListaPrivada(); return true; },
    async reset() { db = DemoData.generate(hoy()); cargarListaPrivada(); return true; },
    /** GET /snapshot — la UI solo lee de aquí; nunca modifica el objeto directamente */
    async snapshot() { return db; },
    /** POST /auth/login (simulado: no es seguridad real) */
    async login(usuario, clave) {
      const u = db.users.find(x => x.usuario === String(usuario || '').trim().toLowerCase() && x.clave === clave);
      if (!u) fail('Usuario o contraseña incorrectos.');
      return u;
    },
    /** POST /oportunidades/:id/seguimientos */
    async registrarContacto(oppId, { canal, nota, proxContacto, usuarioId, resultado }) {
      const o = opp(oppId);
      if (!Rules.esAbierta(o)) fail('Solo se registran contactos en oportunidades abiertas.');
      if (!proxContacto) fail('Define el próximo contacto.', { proxContacto: 'Obligatorio' });
      if (proxContacto < hoy()) fail('El próximo contacto no puede estar en el pasado.', { proxContacto: 'Fecha pasada' });
      const prev = o.proxContacto;
      const fu = { id: 'S-' + (db.seq.fu++), oppId, fecha: hoy(), canal: canal || 'WhatsApp', nota: nota || '', proxContacto, usuarioId, auto: false, resultado: resultado || 'respondio' };
      db.followups.push(fu);
      o.proxContacto = proxContacto;
      o.pendiente = false;
      guardar(o);
      return { followupId: fu.id, prevProx: prev };
    },
    /** DELETE /seguimientos/:id (deshacer inmediato) */
    async deshacerContacto(followupId, prevProx) {
      const i = db.followups.findIndex(f => f.id === followupId);
      if (i < 0) return;
      const o = opp(db.followups[i].oppId);
      db.followups.splice(i, 1);
      o.proxContacto = prevProx;
      touch();
    },
    /** PATCH /oportunidades/:id/etapa */
    async cambiarEtapa(oppId, nueva, d, usuarioId) {
      const o = opp(oppId);
      const errs = Rules.validarCambioEtapa(o, nueva, d, hoy());
      if (Object.keys(errs).length) fail(Object.values(errs)[0], errs);
      const antes = Rules.etapa(o.etapa).nombre;
      if (nueva === 'ganada') {
        Object.assign(o, { etapa: 'ganada', fechaCierre: d.fechaOCReal, proxContacto: null, motivoPerdida: null, fechaReactivacion: null, pendiente: false,
          postventa: { oc: d.fechaOCReal } });
        const q = Rules.vigente(db, o);
        if (q && (q.condicionPago === 'abono' || q.condicionPago === '50_50')) o.postventa.adelantoCobrado = d.fechaOCReal;
      } else if (nueva === 'perdida') {
        Object.assign(o, { etapa: 'perdida', fechaCierre: hoy(), motivoPerdida: d.motivoPerdida, motivoOtro: d.motivoOtro || '', proxContacto: null, pendiente: false });
      } else if (nueva === 'pausa') {
        Object.assign(o, { etapa: 'pausa', fechaReactivacion: d.fechaReactivacion, proxContacto: null, pendiente: false });
      } else {
        Object.assign(o, { etapa: nueva, proxContacto: d.proxContacto, fechaReactivacion: null, fechaCierre: null, motivoPerdida: null, motivoOtro: '', postventa: null, pendiente: false });
        if (d.fechaOC) o.fechaOC = d.fechaOC;
      }
      const extra = nueva === 'perdida' ? ` · Motivo: ${Rules.motivo(d.motivoPerdida).nombre}${d.motivoOtro ? ' (' + d.motivoOtro + ')' : ''}` :
        nueva === 'pausa' ? ` · Reactivar el ${Util.fmtDate(d.fechaReactivacion)}` : nueva === 'ganada' ? ` · OC del ${Util.fmtDate(d.fechaOCReal)}` : '';
      log(o, `Etapa: ${antes} → ${Rules.etapa(nueva).nombre}${extra}${d.nota ? ' · ' + d.nota : ''}`, usuarioId);
      guardar(o);
      return o;
    },
    /** POST /proyectos/:id/cerrar-otros — cierra otras oportunidades del proyecto con "ganó otro integrador" */
    async cerrarPorOtroIntegrador(oppIds, usuarioId) {
      oppIds.forEach(id => {
        const o = opp(id);
        if (!Rules.esAbierta(o) && o.etapa !== 'pausa') return;
        Object.assign(o, { etapa: 'perdida', fechaCierre: hoy(), motivoPerdida: 'otro_integrador', proxContacto: null, pendiente: false });
        log(o, 'Cerrada automáticamente: ganó otro integrador que también cotizamos (no cuenta como pérdida).', usuarioId);
      });
      touch();
    },
    /** PATCH /oportunidades/:id */
    async actualizarOpp(oppId, patch, usuarioId) {
      const o = opp(oppId);
      if ('proxContacto' in patch) {
        if (Rules.esAbierta(o) && !patch.proxContacto) fail('Ninguna oportunidad abierta puede quedar sin próximo contacto.');
        if (patch.proxContacto && patch.proxContacto < hoy()) fail('El próximo contacto no puede estar en el pasado.');
      }
      Object.assign(o, patch);
      if ('fechaOC' in patch) log(o, `Fecha estimada de OC: ${Util.fmtDate(patch.fechaOC)}`, usuarioId);
      guardar(o);
      return o;
    },
    /** POST /oportunidades/:id/completar — cotización leída del correo que el vendedor completa */
    async completarPendiente(oppId, d, usuarioId) {
      const o = opp(oppId);
      const errs = Rules.validarCambioEtapa(o, d.etapa, Object.assign({ exigirFechaOC: true }, d), hoy());
      if (Object.keys(errs).length) fail(Object.values(errs)[0], errs);
      Object.assign(o, { etapa: d.etapa, proxContacto: d.proxContacto, fechaOC: d.fechaOC, pendiente: false });
      if (d.proyectoId) o.proyectoId = d.proyectoId;
      log(o, `Datos completados por el vendedor: ${Rules.etapa(d.etapa).nombre}, próximo contacto ${Util.fmtDate(d.proxContacto)}.`, usuarioId);
      guardar(o);
      return o;
    },
    /** POST /clientes — nueva cuenta (vendedor: queda asignada a él; jefatura: elige a quién o la deja sin asignar) */
    async crearCliente(d, usuarioId) {
      const errs = Rules.validarCliente(db, d);
      if (Object.keys(errs).length) fail(Object.values(errs)[0], errs);
      const c = { id: 'C-' + (++db.seq.client), razonSocial: d.razonSocial.trim(), ruc: String(d.ruc).trim(), vendedorId: d.vendedorId || null, ciudad: d.ciudad || 'Lima',
        tipo: d.tipo || 'Integrador', contactos: [], fechaAlta: hoy(), registradoPor: usuarioId };
      if (d.contacto && String(d.contacto.nombre || '').trim()) {
        c.contactos.push({ id: 'K-' + (db.seq.contacto++), nombre: d.contacto.nombre.trim(), cargo: (d.contacto.cargo || '').trim(), correo: (d.contacto.correo || '').trim(), telefono: (d.contacto.telefono || '').trim() });
      }
      db.clients.push(c);
      touch();
      return c;
    },
    /** POST/PATCH /clientes/:id/contactos — agenda común de contactos */
    async guardarContacto(clienteId, k) {
      const c = db.clients.find(x => x.id === clienteId) || fail('Cuenta no encontrada.');
      const errs = Rules.validarContacto(k);
      if (Object.keys(errs).length) fail(Object.values(errs)[0], errs);
      const data = { nombre: k.nombre.trim(), cargo: (k.cargo || '').trim(), correo: (k.correo || '').trim(), telefono: (k.telefono || '').trim() };
      if (k.id) Object.assign(c.contactos.find(x => x.id === k.id) || fail('Contacto no encontrado.'), data);
      else c.contactos.push(Object.assign({ id: 'K-' + (db.seq.contacto++) }, data));
      touch();
    },
    /** POST /clientes/:id/gestiones — contacto con la cuenta sin oportunidad (cuenta sin cotizar) */
    async registrarGestionCuenta(clienteId, g, usuarioId) {
      if (!db.clients.some(x => x.id === clienteId)) fail('Cuenta no encontrada.');
      if (!g.resultado) fail('Indica si el cliente respondió.', { resultado: 'Obligatorio' });
      db.gestiones.push({ id: 'G-' + (db.seq.gestion++), clienteId, fecha: hoy(), canal: g.canal || 'WhatsApp', resultado: g.resultado, nota: (g.nota || '').trim(), usuarioId });
      touch();
    },
    /** POST/PATCH /catalogo — agrega o edita un producto (solo jefatura, finanzas o administración) */
    async guardarProducto(p, usuarioId) {
      editorCatalogo(usuarioId);
      const e = {};
      if (!String(p.marca || '').trim()) e.marca = 'Indica la marca.';
      if (!String(p.codigo || '').trim()) e.codigo = 'Indica el código.';
      if (!(+p.precio > 0)) e.precio = 'El precio de lista debe ser mayor que cero.';
      const marca = String(p.marca || '').trim(), codigo = String(p.codigo || '').trim();
      if (!e.codigo && db.catalogo.some(x => x.id !== p.id && x.marca === marca && x.codigo.toUpperCase() === codigo.toUpperCase())) e.codigo = `Ya existe ${codigo} en ${marca}.`;
      if (Object.keys(e).length) fail(Object.values(e)[0], e);
      const data = { marca, codigo, descripcion: String(p.descripcion || '').trim() || codigo, precio: Util.round2(+p.precio), actualizado: hoy(), actualizadoPor: usuarioId };
      if (p.id) {
        const x = db.catalogo.find(y => y.id === p.id) || fail('Producto no encontrado.');
        const antes = x.precio;
        Object.assign(x, data);
        logCatalogo(usuarioId, `Editó ${marca} ${codigo}${antes !== data.precio ? `: precio ${Util.money(antes)} → ${Util.money(data.precio)}` : ''}`);
      } else {
        db.catalogo.push(Object.assign({ id: 'P-' + (db.seq.producto++) }, data));
        logCatalogo(usuarioId, `Agregó ${marca} ${codigo} (${Util.money(data.precio)})`);
      }
      db.catalogoInfo = Object.assign({}, db.catalogoInfo, { actualizado: hoy(), por: usuarioId });
      touch();
    },
    /** DELETE /catalogo/:id */
    async quitarProducto(id, usuarioId) {
      editorCatalogo(usuarioId);
      const i = db.catalogo.findIndex(x => x.id === id);
      if (i < 0) fail('Producto no encontrado.');
      const [x] = db.catalogo.splice(i, 1);
      logCatalogo(usuarioId, `Quitó ${x.marca} ${x.codigo} de la lista`);
      db.catalogoInfo = Object.assign({}, db.catalogoInfo, { actualizado: hoy(), por: usuarioId });
      touch();
      return x;
    },
    /** POST /catalogo/importar — modo "reemplazar" (las marcas del archivo quedan exactamente como en él) o "completar" (agrega y actualiza, no quita) */
    async importarCatalogo(items, modo, usuarioId, archivo) {
      editorCatalogo(usuarioId);
      if (!items || !items.length) fail('El archivo no tiene productos con precio.');
      const marcas = new Set(items.map(i => i.marca)), idx = new Map(db.catalogo.map(p => [p.marca + '|' + p.codigo.toUpperCase(), p]));
      let agregados = 0, actualizados = 0, quitados = 0;
      const vigentes = new Set(), nuevos = [];
      items.forEach(i => {
        const ex = idx.get(i.marca + '|' + i.codigo.toUpperCase());
        if (ex) {
          vigentes.add(ex.id);
          if (ex.precio !== i.precio || ex.descripcion !== i.descripcion) { Object.assign(ex, { precio: i.precio, descripcion: i.descripcion, actualizado: hoy(), actualizadoPor: usuarioId }); actualizados++; }
        } else { nuevos.push({ id: 'P-' + (db.seq.producto++), marca: i.marca, codigo: i.codigo, descripcion: i.descripcion, precio: i.precio, actualizado: hoy(), actualizadoPor: usuarioId }); agregados++; }
      });
      if (modo === 'reemplazar') { const antes = db.catalogo.length; db.catalogo = db.catalogo.filter(p => !marcas.has(p.marca) || vigentes.has(p.id)); quitados = antes - db.catalogo.length; }
      db.catalogo.push(...nuevos);
      db.catalogoInfo = { actualizado: hoy(), por: usuarioId, origen: 'importado', archivo: archivo || '' };
      logCatalogo(usuarioId, `Importó ${archivo || 'lista de precios'} (${modo === 'reemplazar' ? 'reemplazando' : 'completando'} ${[...marcas].join(', ')}): ${agregados} nuevos, ${actualizados} actualizados, ${quitados} quitados`);
      touch();
      return { agregados, actualizados, quitados };
    },
    /** PATCH /cotizaciones/:id/vigente */
    /** GET /catalogo — lista de precios para cotizar en la plataforma */
    async catalogo() { return db.catalogo || []; },
    async marcarVigente(quoteId) {
      const q = db.quotes.find(x => x.id === quoteId) || fail('Cotización no encontrada.');
      db.quotes.filter(x => x.oppId === q.oppId).forEach(x => { x.vigente = x.id === quoteId; });
      touch();
    },
    /** PATCH /oportunidades/:id/postventa */
    async actualizarPostventa(oppId, paso, fecha, usuarioId) {
      const o = opp(oppId);
      if (o.etapa !== 'ganada') fail('Solo las oportunidades ganadas tienen post-venta.');
      if (paso === 'oc' && !fecha) fail('La fecha de OC es obligatoria.');
      if (fecha && fecha > hoy()) fail('No se puede registrar un paso con fecha futura.');
      o.postventa = o.postventa || {};
      if (fecha) o.postventa[paso] = fecha; else delete o.postventa[paso];
      if (paso === 'oc') o.fechaCierre = fecha;
      if (paso === 'facturado') { if (fecha) o.postventa.facturaMonto = Rules.montoUSD(db, o); else { delete o.postventa.facturaMonto; delete o.postventa.cobrado; } }
      const nombre = Config.POSTVENTA.find(p => p.id === paso).nombre;
      log(o, fecha ? `Post-venta: ${nombre} (${Util.fmtDate(fecha)})` : `Post-venta: se desmarcó "${nombre}"`, usuarioId);
      touch();
      return o;
    },
    /** PATCH /oportunidades/:id/vendedor (solo jefatura) */
    async reasignarOpp(oppId, vendedorId, usuarioId) {
      const o = opp(oppId);
      const de = db.users.find(u => u.id === o.vendedorId), a = db.users.find(u => u.id === vendedorId);
      o.vendedorId = vendedorId;
      log(o, `Reasignada por jefatura: ${de.iniciales} → ${a.iniciales}`, usuarioId);
      touch();
    },
    /** PATCH /clientes/:id/vendedor (solo jefatura) — mueve también sus oportunidades abiertas y en pausa */
    async reasignarCliente(clienteId, vendedorId, usuarioId) {
      const c = db.clients.find(x => x.id === clienteId) || fail('Cliente no encontrado.');
      c.vendedorId = vendedorId;
      let n = 0;
      db.opps.filter(o => o.clienteId === clienteId && (Rules.esAbierta(o) || o.etapa === 'pausa')).forEach(o => {
        if (o.vendedorId !== vendedorId) { o.vendedorId = vendedorId; n++; log(o, 'Reasignada junto con el cliente por jefatura.', usuarioId); }
      });
      touch();
      return n;
    },
    /** POST /cotizaciones — registra una cotización: oportunidad nueva, revisión o alternativa */
    async registrarCotizacion(p, usuarioId) {
      const errs = Rules.validarCotizacion(p, hoy());
      if (Object.keys(errs).length) fail(Object.values(errs)[0], errs);
      let clienteId = p.clienteId;
      if (!clienteId) {
        const ex = db.clients.find(c => c.ruc === p.clienteNuevo.ruc);
        if (ex) clienteId = ex.id;
        else {
          const c = { id: 'C-' + (++db.seq.client), razonSocial: p.clienteNuevo.razonSocial.trim(), ruc: p.clienteNuevo.ruc, vendedorId: p.vendedorId, ciudad: 'Lima', tipo: 'Integrador',
            contactos: p.contacto ? [{ id: 'K-' + (db.seq.contacto++), nombre: p.contacto, cargo: '', correo: p.contactoCorreo || '', telefono: p.contactoTelefono || '' }] : [],
            fechaAlta: hoy(), registradoPor: usuarioId };
          db.clients.push(c); clienteId = c.id;
        }
      }
      const items = p.items.filter(it => String(it.codigo || '').trim()).map(it => ({ cant: +it.cant, unidad: it.unidad || 'Und', codigo: it.codigo.trim(), marca: it.marca,
        descripcion: (it.descripcion || '').trim(), valorUnit: Util.round2(+it.valorUnit), listaUSD: +it.listaUSD > 0 ? +it.listaUSD : null }));
      const q = { id: 'Q-' + (++db.seq.quote), oppId: null, numero: p.numero.trim(), revision: 'R0', tipo: 'original', fechaEmision: p.fechaEmision, moneda: p.moneda,
        tc: p.moneda === 'PEN' ? +p.tc : null, condicionPago: p.condicionPago, validezDias: +p.validezDias, plazo: p.plazo, items, descuentoTipo: p.descuentoTipo === 'pct' ? 'pct' : 'monto', descuentoPct: p.descuentoTipo === 'pct' ? +p.descuentoPct || 0 : 0, descuento: 0,
        vigente: true, contacto: p.contacto || '', origen: p.origen };
      q.descuento = Rules.totales(q).descuento;
      let o;
      if ((p.modo === 'revision' || p.modo === 'alternativa') && p.oppDestinoId) {
        o = opp(p.oppDestinoId);
        if (p.modo === 'revision') {
          q.revision = Rules.siguienteRevision(db, o); q.tipo = 'revision';
          db.quotes.filter(x => x.oppId === o.id).forEach(x => { x.vigente = false; });
        } else {
          q.revision = 'ALT'; q.tipo = 'alternativa'; q.vigente = false;
        }
        q.oppId = o.id;
        db.quotes.push(q);
        if (o.etapa === 'pausa') Object.assign(o, { etapa: p.etapa || 'e1', fechaReactivacion: null });
        Object.assign(o, { proxContacto: p.proxContacto, fechaOC: p.fechaOC, pendiente: false });
        log(o, `${q.tipo === 'revision' ? 'Revisión ' + q.revision : 'Alternativa con otra marca'} enviada (N° ${q.numero}).`, usuarioId);
      } else {
        let proyectoId = p.proyectoId;
        if (p.proyectoNuevo) {
          const pr = { id: 'PR-' + (++db.seq.project), nombre: p.proyectoNuevo.nombre.trim(), usuarioFinal: p.proyectoNuevo.usuarioFinal.trim(), tipo: 'privado' };
          db.projects.push(pr); proyectoId = pr.id;
        }
        o = { id: 'OP-' + (++db.seq.opp), clienteId, proyectoId, vendedorId: p.vendedorId, etapa: p.etapa || 'e1', fechaInicio: p.fechaEmision, fechaOC: p.fechaOC,
          proxContacto: p.proxContacto, motivoPerdida: null, motivoOtro: '', fechaReactivacion: null, fechaCierre: null, postventa: null, origen: p.origen, pendiente: false };
        db.opps.push(o);
        if (db.contadores) db.contadores[p.vendedorId] = (db.contadores[p.vendedorId] || 0) + 1; // solo para sugerir el siguiente número en la demo
        q.oppId = o.id;
        db.quotes.push(q);
        db.followups.push({ id: 'S-' + (db.seq.fu++), oppId: o.id, fecha: p.fechaEmision, canal: 'Correo', nota: `Cotización enviada (N° ${q.numero}) — ${p.origen === 'plataforma' ? 'cotizada en la plataforma (PDF generado)' : p.origen === 'pdf' ? 'registrada desde el PDF' : 'registrada manualmente'}.`, proxContacto: o.proxContacto, usuarioId: 'sistema', auto: true });
      }
      guardar(o);
      return { oppId: o.id, quoteId: q.id };
    },
  };
})();

/* =====================================================================
   CAPA 5 · SELFTEST — autoverificación de reglas. Se ejecuta en la consola al cargar
   (también se puede llamar a mano: SelfTest.run()).
   ===================================================================== */
const SelfTest = (() => {
  function miniDb() {
    return { _v: 1, users: [{ id: 't1', rol: 'vendedor', meta: 40000 }], clients: [{ id: 'c1', ruc: '20000000001' }], projects: [], followups: [], historico: [],
      opps: [], quotes: [] };
  }
  const item = (cant, vu) => ({ cant, unidad: 'Und', codigo: 'EDS-408A', marca: 'Moxa', descripcion: '', valorUnit: vu });
  function addOpp(db, o, q) {
    const id = 'o' + (db.opps.length + 1);
    db.opps.push(Object.assign({ id, clienteId: 'c1', vendedorId: 't1', fechaInicio: '2026-09-01', proxContacto: '2026-10-08', postventa: null }, o));
    db.quotes.push(Object.assign({ id: 'q' + id, oppId: id, revision: 'R0', moneda: 'USD', tc: null, condicionPago: 'contra_entrega', validezDias: 10,
      plazo: 'stock', fechaEmision: '2026-09-01', descuento: 0, vigente: true, items: [item(10, 1000)] }, q || {}));
    db._v++;
    return db.opps[db.opps.length - 1];
  }
  const casos = [
    ['Probabilidad derivada de la etapa y monto ponderado', () => {
      const db = miniDb();
      const a = addOpp(db, { etapa: 'e4' }), b = addOpp(db, { etapa: 'pausa' }), c = addOpp(db, { etapa: 'ganada' });
      return Rules.prob('e4') === 0.25 && Rules.montoUSD(db, a) === 10000 && Rules.ponderado(db, a) === 2500 && Rules.ponderado(db, b) === 0 && Rules.ponderado(db, c) === 10000;
    }],
    ['Cotización en PEN se convierte a USD con el TC del día; IGV 18 %', () => {
      const db = miniDb();
      const a = addOpp(db, { etapa: 'e5' }, { moneda: 'PEN', tc: 3.75, items: [item(10, 3750)] });
      const t = Rules.totales(Rules.vigente(db, a));
      return t.neto === 37500 && t.igv === 6750 && Rules.montoUSD(db, a) === 10000 && Rules.quoteTotalUSD(Rules.vigente(db, a)) === 11800 && Rules.ponderado(db, a) === 5000;
    }],
    ['Horizontes de facturación y cobranza (OC + plazo mayor; condición de pago)', () => {
      const hoy = '2026-10-06', db = miniDb();

  function modal({ title, body, actions = [], wide = false, onOpen }) {
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-back" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal${wide ? ' wide' : ''}">
      <header><h2>${E(title)}</h2><button class="icon-btn" data-modal-close aria-label="Cerrar" style="color:var(--text-2)">${I('x')}</button></header>
      <div class="m-body">${body}</div>
      <footer>${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-modal-act="${i}">${a.label}</button>`).join('')}</footer></div></div>`;
    const back = root.firstElementChild;
    back.addEventListener('click', async ev => {
      if (ev.target === back || ev.target.closest('[data-modal-close]')) { closeModal(); return; }
      const b = ev.target.closest('[data-modal-act]');
      if (!b) return;
      const a = actions[+b.dataset.modalAct];
      if (!a.onClick) { closeModal(); return; }
      b.disabled = true;
      try { const r = await a.onClick(back); if (r !== false) closeModal(); }
      catch (err) { showFormError(back, err); }
      finally { b.disabled = false; }
    });
    if (onOpen) onOpen(back);
    const first = back.querySelector('.m-body input:not([type=radio]):not([type=checkbox]),.m-body select,.m-body textarea');
    if (first) setTimeout(() => first.focus(), 20);
    return back;
  }
  function closeModal() { $('#modal-root').innerHTML = ''; }
  function clearErrors(root) { $$('.invalid', root).forEach(x => x.classList.remove('invalid')); $$('.field-err', root).forEach(x => x.remove()); const b = root.querySelector('.form-error'); if (b) b.remove(); }
  function showFormError(root, err) {
    clearErrors(root);
    const campos = (err && err.campos) || {};
    Object.keys(campos).forEach(k => {
      const inp = root.querySelector(`[name="${k}"]`);
      if (!inp) return;
      inp.classList.add('invalid');
      const host = inp.closest('label.field') || inp.parentElement;
      host.insertAdjacentHTML('beforeend', `<span class="field-err">${E(campos[k])}</span>`);
    });
    const box = document.createElement('div');
    box.className = 'alert bad form-error'; box.style.marginBottom = '12px'; box.setAttribute('role', 'alert');
    box.innerHTML = `<div>${E(err && err.message || 'Revisa los datos.')}</div>`;

  /* ---------- Gráficos SVG (sin librerías externas) ---------- */
  function niceMax(v) {
    if (!(v > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const f of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (f * p >= v) return f * p;
    return 10 * p;
  }
  const kfmt = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0).replace(/\.0$/, '') + 'K' : String(Math.round(v));
  function chartSlot(id, spec) { S.charts[id] = spec; return `<div class="chart" id="${id}" role="img" aria-label="${E(spec.aria || '')}"></div>${legendHTML(spec)}`; }
  function legendHTML(spec) {
    const parts = spec.series.length > 1 || spec.line ? spec.series.map(s => `<span><span class="sw" style="background:${s.color}"></span>${E(s.name)}</span>`) : [];
    if (spec.line) parts.push(`<span><span class="ln"></span>${E(spec.line.name)}</span>`);
    return parts.length ? `<div class="legend">${parts.join('')}</div>` : '';
  }
  function drawCharts() {
    Object.entries(S.charts).forEach(([id, spec]) => { const el = document.getElementById(id); if (el) drawBar(el, spec); });
  }
  function drawBar(el, spec) {
    const W = Math.max(260, el.clientWidth || 600), H = spec.height || 240;
    const m = { t: 14, r: 8, b: 30, l: 46 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.categories.length;
    const tot = spec.categories.map((_, i) => Util.sum(spec.series, s => s.values[i]));
    const maxV = niceMax(Math.max(...tot, ...(spec.line ? spec.line.values : [0])) * 1.05);
    const y = v => m.t + ih - (v / maxV) * ih;
    const band = iw / n, bw = Math.min(56, band * 0.62);
    let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    for (let k = 0; k <= 4; k++) {
      const v = maxV * k / 4, yy = y(v);
      svg += `<g class="grid"><line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/></g><text x="${m.l - 6}" y="${yy + 4}" text-anchor="end">${kfmt(v)}</text>`;
    }
    spec.categories.forEach((c, i) => {
      const cx = m.l + band * i + band / 2;
      let acc = 0;
      spec.series.forEach(s => {
        const v = s.values[i] || 0;
        if (v <= 0) return;
        const y0 = y(acc), y1 = y(acc + v);
        const h = Math.max(1, y0 - y1 - (acc > 0 ? 2 : 0));
        const tip = `${c} · ${s.name}: ${Util.money(v)}`;
        svg += `<rect class="bar" x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${h}" rx="${acc + v >= tot[i] - 0.01 ? 4 : 0}" fill="${s.color}" data-tip="${E(tip)}"><title>${E(tip)}</title></rect>`;
        acc += v;
      });
      const lab = band < 62 && spec.shortCategories ? spec.shortCategories[i] : c;
      svg += `<text x="${cx}" y="${H - 10}" text-anchor="middle"${band < 50 ? ' style="font-size:10px"' : ''}>${E(lab)}</text>`;
      if (spec.totalLabels && tot[i] > 0) svg += `<text x="${cx}" y="${y(tot[i]) - 5}" text-anchor="middle" style="font-weight:700;fill:var(--text)">${kfmt(tot[i])}</text>`;
    });
    if (spec.line) {
      const pts = spec.line.values.map((v, i) => [m.l + band * i + band / 2, y(v)]);
      const lx0 = m.l, lx1 = W - m.r;
      const flat = spec.line.values.every(v => v === spec.line.values[0]);
      if (flat) svg += `<line x1="${lx0}" x2="${lx1}" y1="${pts[0][1]}" y2="${pts[0][1]}" stroke="#4a5767" stroke-width="2" stroke-dasharray="6 4"><title>${E(spec.line.name)}: ${Util.money(spec.line.values[0])}</title></line>`;
      else svg += `<polyline fill="none" stroke="#4a5767" stroke-width="2" stroke-dasharray="6 4" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
      svg += `<text x="${lx1}" y="${pts[pts.length - 1][1] - 6}" text-anchor="end" style="font-weight:700">${E(spec.line.label || spec.line.name)}</text>`;
    }
    svg += '</svg><div class="tip hidden"></div>';
    el.innerHTML = svg;
    const tipEl = el.querySelector('.tip');
    el.onmousemove = ev => {
      const r = ev.target.closest && ev.target.closest('[data-tip]');
      if (!r) { tipEl.classList.add('hidden'); return; }
      const box = el.getBoundingClientRect();
      tipEl.textContent = r.getAttribute('data-tip');
      tipEl.style.left = Math.min(box.width - 80, Math.max(80, ev.clientX - box.left)) + 'px';
      tipEl.style.top = (ev.clientY - box.top - 8) + 'px';
      tipEl.classList.remove('hidden');
    };
    el.onmouseleave = () => tipEl.classList.add('hidden');
    $$('title', el).forEach(t => t.remove()); // el tooltip propio reemplaza al nativo
  }
  const hbars = (rows, { fmtVal, max } = {}) => {

  /* ---------- Lista de precios: búsqueda rápida (por escritura o por marca) ---------- */
  function catIndex() {
    const db = S.db;
    if (S.catIdx && S.catIdx.v === db._v && S.catIdx.n === db.catalogo.length) return S.catIdx.list;
    const list = db.catalogo.map(p => ({ p, c: p.codigo.toLowerCase(), k: (p.codigo + ' ' + p.descripcion + ' ' + p.marca).toLowerCase() }));
    S.catIdx = { v: db._v, n: db.catalogo.length, list };
    return list;
  }
  /** Coincidencias por código (empieza con) primero y luego por palabras en código/descripción/marca */
  function buscarProductos(q, marca, limite = 12) {
    const t = String(q || '').trim().toLowerCase(), ws = t.split(/\s+/).filter(Boolean);
    const a = [], b = [];
    let total = 0;
    for (const x of catIndex()) {
      if (marca && x.p.marca !== marca) continue;
      if (!t) { total++; if (b.length < limite) b.push(x.p); continue; }
      if (x.c.startsWith(t)) { total++; if (a.length < limite) a.push(x.p); }
      else if (ws.every(w => x.k.includes(w))) { total++; if (b.length < limite) b.push(x.p); }
    }
    const res = a.concat(b).slice(0, limite);
    res.total = total;
    return res;
  }
  function marcasCatalogo() {
    const n = {};
    S.db.catalogo.forEach(p => { n[p.marca] = (n[p.marca] || 0) + 1; });
    return Object.keys(n).sort((x, y) => n[y] - n[x]).map(m => ({ marca: m, n: n[m] }));
  }
  const marcasDisponibles = () => [...new Set([...Config.MARCAS, ...marcasCatalogo().map(x => x.marca)])];

  /* =====================================================================
     8.3 OPORTUNIDADES — tabla equivalente al FUP, con filtros, orden y CSV
     ===================================================================== */
  function filasOpps() {
    const db = S.db, h = hoy(), F = S.filtros;
    const term = F.q.trim().toLowerCase();
    const rows = [];
    Rules.oppsVisibles(db, S.user).forEach(o => {
      if (F.etapa === 'abiertas' && !Rules.esAbierta(o)) return;
      if (F.etapa === 'cerradas' && Rules.esAbierta(o)) return;
      if (F.etapa && !['abiertas', 'cerradas', 'todas'].includes(F.etapa) && o.etapa !== F.etapa) return;
      if (F.cliente && o.clienteId !== F.cliente) return;
      if (F.proyecto && o.proyectoId !== F.proyecto) return;
      if (F.vendedor && o.vendedorId !== F.vendedor) return;
      if (F.desde && o.fechaInicio < F.desde) return;
      if (F.hasta && o.fechaInicio > F.hasta) return;
      const q = Rules.vigente(db, o);
      if (F.marca && !Rules.marcas(q).includes(F.marca)) return;
      const c = cli(o.clienteId), p = proj(o.proyectoId);
      if (term) {
        const hay = [c.razonSocial, c.ruc, projName(p), p.usuarioFinal, ...Rules.quotesOf(db, o).map(x => x.numero), ...(q ? q.items.map(it => it.codigo) : [])].join(' ').toLowerCase();
        if (!hay.includes(term)) return;
      }
      const ult = ultimoContacto(o);
      const sinFacturar = Rules.esAbierta(o) || (o.etapa === 'ganada' && !(o.postventa && o.postventa.facturado));
      const fecFac = sinFacturar ? Rules.fechaFactura(db, o) : null;
      rows.push({ o, q, c, p, cliente: c.razonSocial, proyecto: projName(p), marca: Rules.marcaPrincipal(q), items: Rules.resumenItems(q),
        monto: Rules.montoUSD(db, o), prob: o.etapa === 'pausa' ? -1 : Rules.prob(o.etapa), pond: Rules.ponderado(db, o), ult,
        dias: ult ? Util.diffDays(ult, h) : null, prox: o.proxContacto, fecFac, fact: Rules.horizonte(fecFac, h), vend: usr(o.vendedorId),
        numero: q ? q.numero : '', alertas: Rules.alertasOpp(db, o, h) });
    });
    const { col, dir } = S.orden;
    const key = r => {
      switch (col) {
        case 'prox': return r.prox || (Rules.esAbierta(r.o) ? '0000' : '9999');
        case 'fact': return r.fecFac || '9999';
        case 'vend': return r.vend.iniciales;
        case 'etapa': return r.prob;
        default: return r[col] == null ? -Infinity : r[col];
      }
    };
    rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
    return rows;
  }

  function quoteHTML(q, ed) {

            <td class="r num">${Util.nf2.format(it.valorUnit)}${it.listaUSD && Math.abs(it.valorUnit - (cur === 'PEN' ? it.listaUSD * q.tc : it.listaUSD)) > 0.01 ? `<div class="cell-sub" title="Precio de lista: ${Util.money(it.listaUSD)}">editado vs lista</div>` : ''}</td><td class="r num">${Util.nf2.format(it.cant * it.valorUnit)}</td></tr>`).join('')}

          ${cur === 'PEN' ? `<span class="t">Equivale a (sin IGV)</span><span class="num right">${money(Rules.quoteNetoUSD(q))}</span>` : ''}

  function postventaHTML(o, ed) {

        ${s.id === 'cobrado' && !pv.cobrado ? `<div class="small muted" style="margin-top:4px">Estimado: ${cobro.filter(c => !c.cobrado).map(c => Util.fmtDate(c.fecha)).join(' y ') || '—'}</div>` : ''}
      </div>`).join('')}</div>
      <p class="small muted" style="margin-bottom:0">Condición de pago: ${E(Rules.condicion(q.condicionPago).nombre)} → ${E(Rules.condicion(q.condicionPago).regla)}.</p></section>`;

  CHANGES['etapa'] = el => { const o = oppById(el.dataset.id), nueva = el.value; el.value = o.etapa; if (nueva !== o.etapa) abrirCambioEtapa(o.id, nueva); };
  CHANGES['prox'] = async el => {
    if (!oppEditable(el.dataset.id)) return;
    try { await Repo.actualizarOpp(el.dataset.id, { proxContacto: el.value }, S.user.id); toast(`Próximo contacto reprogramado al ${Util.fmtDate(el.value)}.`); } catch (e) { toast(e.message); }
    refresh();

  CHANGES['fechaoc'] = async el => {

    if (!el.value) { toast('La fecha estimada de OC no puede quedar vacía.'); refresh(); return; }
    try { await Repo.actualizarOpp(el.dataset.id, { fechaOC: el.value }, S.user.id); toast('Fecha estimada de OC actualizada.'); } catch (e) { toast(e.message); }

     8.5 NUEVA COTIZACIÓN — cotizar en la plataforma (genera el PDF) o leer un PDF ya enviado (simulado)

  const itemVacio = () => ({ cant: 1, unidad: 'Und', codigo: '', marca: 'Moxa', descripcion: '', valorUnit: '', listaUSD: null });
  /** Precio de lista convertido a la moneda de la cotización y aviso si el vendedor lo editó */
  function listaHint(d, it) {
    if (!(+it.listaUSD > 0)) return '';
    const l = d.moneda === 'PEN' ? Util.round2(it.listaUSD * (+d.tc || Config.TC_REFERENCIA)) : +it.listaUSD;
    return Math.abs((+it.valorUnit || 0) - l) > 0.005 ? `<span style="color:var(--warn);font-weight:700">Editado · lista ${Util.nf2.format(l)}</span>` : 'Precio de lista';
  }
  function aplicarProducto(i, p) {
    const d = S.nueva.d, it = d.items[i];
    Object.assign(it, { codigo: p.codigo, marca: p.marca, descripcion: p.descripcion, listaUSD: p.precio,
      valorUnit: d.moneda === 'PEN' ? Util.round2(p.precio * (+d.tc || Config.TC_REFERENCIA)) : p.precio });
  }
  /* Lista desplegable de coincidencias bajo el campo de código */
  let acEstado = null;
  const cerrarAc = () => { const l = document.getElementById('ac-list'); if (l) l.remove(); acEstado = null; };
  function mostrarAc(el) {
    const q = el.value.trim();
    if (q.length < 2) { cerrarAc(); return; }
    const res = buscarProductos(q, null, 12);
    let l = document.getElementById('ac-list');
    if (!l) { l = document.createElement('div'); l.id = 'ac-list'; l.className = 'ac-list'; l.setAttribute('role', 'listbox'); document.body.appendChild(l); }
    const r = el.getBoundingClientRect();
    l.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 448)) + 'px';
    l.style.top = Math.min(r.bottom + 4, window.innerHeight - 200) + 'px';
    acEstado = { i: +el.dataset.ac, res, act: 0 };
    l.innerHTML = res.length ? res.map((p, k) => `<button type="button" role="option" data-ac-pick="${k}" class="${k === 0 ? 'act' : ''}"><strong>${E(p.codigo)}</strong> · ${E(p.marca)} <span style="float:right" class="num">${Util.money(p.precio)}</span><div class="ac-meta">${E(p.descripcion)}</div></button>`).join('') +
      (res.total > res.length ? `<div class="ac-empty">${res.total - res.length} coincidencias más: sigue escribiendo para afinar.</div>` : '')
      : '<div class="ac-empty">Sin coincidencias en la lista de precios. Puedes escribir el ítem a mano.</div>';
  }
  document.addEventListener('mousedown', e => {
    const b = e.target.closest && e.target.closest('[data-ac-pick]');
    if (b && acEstado) { e.preventDefault(); const { i, res } = acEstado; aplicarProducto(i, res[+b.dataset.acPick]); cerrarAc(); render(true); return; }

      if (Rules.esAbierta(o)) {
