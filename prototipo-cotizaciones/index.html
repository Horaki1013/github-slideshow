/* =====================================================================
   CAPA 3 · REPO — única puerta de lectura/escritura de la data.
   Todos los métodos son asíncronos (devuelven Promesas) para que el developer
   los reemplace por llamadas HTTP a la API sin tocar la interfaz.
   Hoy guarda todo en memoria; no usa localStorage ni ningún almacenamiento.
   ===================================================================== */
/* Almacenamiento del piloto: IndexedDB del navegador. Cuando exista el servidor local de la empresa,
   este objeto se reemplaza por llamadas HTTP (misma interfaz: leer / escribir / borrar). */
const Almacen = (() => {
  const NOMBRE = 'techvalue-piloto', TABLA = 'estado';
  const abrir = () => new Promise((res, rej) => {
    const r = indexedDB.open(NOMBRE, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(TABLA);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const op = (modo, fn) => abrir().then(b => new Promise((res, rej) => {
    const tx = b.transaction(TABLA, modo), req = fn(tx.objectStore(TABLA));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  }));
  return {
    disponible: () => typeof indexedDB !== 'undefined',
    leer: clave => op('readonly', st => st.get(clave)).then(v => v == null ? null : v),
    escribir: (clave, valor) => op('readwrite', st => st.put(valor, clave)),
    borrar: clave => op('readwrite', st => st.delete(clave)),
  };
})();

/* =====================================================================
   CAPA 3b · ALMACÉN COMPARTIDO — carpeta de red de la empresa (recurso
   compartido de Windows, p. ej. Z:\Ventas\Piloto) elegida por el usuario.
   Usa la API de acceso a archivos de Edge/Chrome: sin servidor ni nube.
   Archivos: datos.json (todo menos la lista de precios), lista-precios.json,
   bloqueo.json (una escritura a la vez) y respaldos/ (una copia por día).
   En producción se reemplaza por la API del servidor local.
   ===================================================================== */
const AlmacenCompartido = (() => {
  const RESPALDOS = 30;
  let dir = null, cacheLista = null;
  const marca = { datos: null, lista: null };
  const token = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const esperar = ms => new Promise(r => setTimeout(r, ms));
  const firma = f => f.lastModified + ':' + f.size;
  async function archivo(nombre) { try { return await dir.getFileHandle(nombre); } catch (e) { if (e.name === 'NotFoundError' || e.name === 'TypeError') return null; throw e; } }
  async function leerArchivo(nombre) { const h = await archivo(nombre); if (!h) return null; const f = await h.getFile(); return { texto: await f.text(), firma: firma(f) }; }
  async function firmaDe(nombre) { const h = await archivo(nombre); return h ? firma(await h.getFile()) : null; }
  async function escribirArchivo(nombre, texto, carpeta) {
    const h = await (carpeta || dir).getFileHandle(nombre, { create: true });
    const w = await h.createWritable(); await w.write(texto); await w.close();   // el archivo se reemplaza completo al cerrar
    return firma(await h.getFile());
  }
  const json = t => { try { return JSON.parse(t); } catch (e) { return null; } };
  const vacio = () => ({ catalogo: [], catalogoInfo: null, catalogoLog: [] });
  async function respaldoDelDia() {
    const actual = await leerArchivo('datos.json'); if (!actual) return;
    const r = await dir.getDirectoryHandle('respaldos', { create: true });
    const nombre = `datos-${Util.today()}.json`;
    try { await r.getFileHandle(nombre); return; } catch (e) { /* aún no hay respaldo de hoy */ }
    await escribirArchivo(nombre, actual.texto, r);
    const nombres = []; for await (const [n] of r.entries()) if (/^datos-\d{4}-\d{2}-\d{2}\.json$/.test(n)) nombres.push(n);
    nombres.sort().slice(0, Math.max(0, nombres.length - RESPALDOS)).forEach(n => r.removeEntry(n).catch(() => {}));
  }
  return {
    soportado: () => typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function',
    nombre: () => dir ? dir.name : '',
    /** Abre el selector de carpetas (requiere un clic del usuario) y recuerda la carpeta en este navegador */
    async elegir() { const h = await window.showDirectoryPicker({ id: 'techvalue-piloto', mode: 'readwrite' }); try { await Almacen.escribir('carpeta', h); } catch (e) { /* no se pudo recordar */ } return h; },
    async recordada() { try { return await Almacen.leer('carpeta'); } catch (e) { return null; } },
    async olvidar() { dir = null; try { await Almacen.borrar('carpeta'); } catch (e) { /* sin efecto */ } },
    async permiso(h, pedir) {
      const o = { mode: 'readwrite' };
      if (!h.queryPermission) return true;
      let p = await h.queryPermission(o);
      if (p !== 'granted' && pedir) p = await h.requestPermission(o);
      return p === 'granted';
    },
    usar(h) { dir = h; cacheLista = null; marca.datos = marca.lista = null; },
    async vacia() { return !(await archivo('datos.json')); },
    /** Lee todo (datos + lista de precios) */
    async leer() {
      const d = await leerArchivo('datos.json'); if (!d) return null;
      const l = await leerArchivo('lista-precios.json');
      const datos = json(d.texto); if (!datos || !Array.isArray(datos.opps)) throw new Error('datos.json de la carpeta compartida está dañado. Restaura una copia de la carpeta "respaldos".');
      cacheLista = l ? json(l.texto) : null;
      marca.datos = d.firma; marca.lista = l ? l.firma : null;
      return Object.assign(datos, cacheLista || vacio());
    },
    /** Devuelve los datos si otro usuario los cambió desde la última lectura o escritura; si no, null */
    async leerSiCambio() {
      const fd = await firmaDe('datos.json'), fl = await firmaDe('lista-precios.json');
      if (fd === marca.datos && fl === marca.lista) return null;
      if (fl !== marca.lista || !cacheLista) { const l = await leerArchivo('lista-precios.json'); cacheLista = l ? json(l.texto) : null; marca.lista = l ? l.firma : null; }
      const d = await leerArchivo('datos.json'); if (!d) return null;
      const datos = json(d.texto); if (!datos || !Array.isArray(datos.opps)) throw new Error('datos.json de la carpeta compartida está dañado.');
      marca.datos = d.firma;
      return Object.assign(datos, cacheLista || vacio());
    },
    /** Escribe los datos; la lista de precios (unos 4 MB) solo cuando cambió */
    async escribir(db, quien, listaCambio) {
      const { catalogo, catalogoInfo, catalogoLog, ...resto } = db;
      if (listaCambio || !marca.lista) { cacheLista = { catalogo, catalogoInfo, catalogoLog }; marca.lista = await escribirArchivo('lista-precios.json', JSON.stringify(cacheLista)); }
      await respaldoDelDia();
      resto._escrito = { por: quien || '', en: new Date().toISOString() };
      marca.datos = await escribirArchivo('datos.json', JSON.stringify(resto));
    },
    /** Una escritura a la vez entre todas las PC. Un bloqueo abandonado (12 s sin cambiar) se toma */
    async bloquear(quien) {
      const inicio = Date.now(); let visto = null, desde = 0;
      for (;;) {
        const l = await leerArchivo('bloqueo.json'), b = l && json(l.texto);
        if (b && b.token !== token) {
          if (visto !== b.token) { visto = b.token; desde = Date.now(); }
          if (Date.now() - desde < 12000) {
            if (Date.now() - inicio > 20000) throw new Error(`La carpeta compartida está ocupada${b.quien ? ' por ' + b.quien : ''}. Intenta de nuevo en unos segundos.`);
            await esperar(200 + Math.random() * 300); continue;
          }
        }
        await escribirArchivo('bloqueo.json', JSON.stringify({ token, quien: quien || '', desde: new Date().toISOString() }));
        await esperar(60 + Math.random() * 60);
        const c = await leerArchivo('bloqueo.json'), cb = c && json(c.texto);
        if (cb && cb.token === token) return true;
      }
    },
    /** Documentos en documentos/<oportunidad>/ dentro de la carpeta compartida */
    async guardarDoc(carpeta, nombre, blob) {
      const d = await (await dir.getDirectoryHandle('documentos', { create: true })).getDirectoryHandle(carpeta, { create: true });
      const h = await d.getFileHandle(nombre, { create: true }); const w = await h.createWritable(); await w.write(blob); await w.close();
    },
    async leerDoc(carpeta, nombre) { const d = await (await dir.getDirectoryHandle('documentos')).getDirectoryHandle(carpeta); return (await d.getFileHandle(nombre)).getFile(); },
    async borrarDoc(carpeta, nombre) { try { const d = await (await dir.getDirectoryHandle('documentos')).getDirectoryHandle(carpeta); await d.removeEntry(nombre); } catch (e) { /* ya no estaba */ } },
    async liberar() {
      const l = await leerArchivo('bloqueo.json'), b = l && json(l.texto);
      if (b && b.token === token) await dir.removeEntry('bloqueo.json').catch(() => {});
    },
  };
})();

const Repo = (() => {
  let db = null;
  let modo = 'demo';                       // 'demo' (memoria) | 'piloto' (se guarda en el navegador)
  const estado = { guardado: null, error: null, pendiente: false, compartida: false, carpeta: '', remoto: null };
  let quien = '';                          // nombre del usuario que escribe (para el bloqueo y el registro en la carpeta)
  const docsMemoria = new Map();           // documentos en la demo (no se guardan)
  const oyentesRemotos = [];
  let tGuardar = null;
  const oyentes = [];
  const avisar = () => oyentes.forEach(f => { try { f(Object.assign({ modo }, estado)); } catch (e) { /* sin efecto */ } });
  // La lista de precios (varios MB) se guarda aparte y solo cuando cambia: cada guardado serializa únicamente los datos
  let listaGuardada = null, listaSucia = false;
  function programarGuardado() {
    if (modo !== 'piloto') return;
    estado.pendiente = true; avisar();
    clearTimeout(tGuardar);
    tGuardar = setTimeout(async () => {
      try {
        if (listaSucia || listaGuardada !== db.catalogo) { listaSucia = false; listaGuardada = db.catalogo; await Almacen.escribir('lista', JSON.stringify(db.catalogo || [])); }
        await Almacen.escribir('db', JSON.stringify(Object.assign({}, db, { catalogo: undefined })));

    /** Administración de usuarios: gerencia, jefatura y administración */

      const e = {};
      const usuario = String(d.usuario || '').trim().toLowerCase(), ini = String(d.iniciales || '').trim().toUpperCase();
      if (!String(d.nombre || '').trim()) e.nombre = 'El nombre es obligatorio.';

      else if (db.users.some(u => u.id !== d.id && u.usuario.toLowerCase() === usuario)) e.usuario = 'Ese usuario ya existe.';
      if (!/^[A-Z]{2,3}$/.test(ini)) e.iniciales = 'Iniciales de 2 o 3 letras.';
      else if (db.users.some(u => u.id !== d.id && u.iniciales === ini)) e.iniciales = 'Esas iniciales ya están en uso.';
      if (!Config.ROLES[d.rol]) e.rol = 'Rol no válido.';
      if (d.correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.correo)) e.correo = 'Correo no válido.';
      if (Object.keys(e).length) fail(Object.values(e)[0], e);
      const datos = { nombre: d.nombre.trim(), usuario, iniciales: ini, correo: (d.correo || '').trim(), cargo: (d.cargo || '').trim(), telefono: (d.telefono || '').trim(),
        rol: d.rol, meta: d.rol === 'vendedor' ? (+d.meta > 0 ? +d.meta : Config.META_MENSUAL_USD) : null, activo: d.activo !== false };

        return { usuario: u };

      let id = ini, k = 2;
      while (db.users.some(u => u.id === id)) id = ini + (k++);
      const u = Object.assign({ id, debeCambiar: true }, datos);

    /** POST /catalogo/importar — modo "reemplazar" (las marcas del archivo quedan exactamente como en él) o "completar" (agrega y actualiza, no quita) */
    async importarCatalogo(items, modo, usuarioId, archivo) {
      editorCatalogo(usuarioId);
      if (!items || !items.length) fail('El archivo no tiene productos con precio.');
      const marcas = new Set(items.map(i => i.marca)), idx = new Map(db.catalogo.map(p => [p.marca + '|' + p.codigo.toUpperCase(), p]));
      let agregados = 0, actualizados = 0, quitados = 0;
      const vigentes = new Set(), nuevos = [];
      items.forEach(i => {
        const ex = idx.get(i.marca + '|' + i.codigo.toUpperCase());
        if (ex) {
          vigentes.add(ex.id);
          if (ex.precio !== i.precio || ex.descripcion !== i.descripcion) { Object.assign(ex, { precio: i.precio, descripcion: i.descripcion, actualizado: hoy(), actualizadoPor: usuarioId }); actualizados++; }
        } else { nuevos.push({ id: 'P-' + (db.seq.producto++), marca: i.marca, codigo: i.codigo, descripcion: i.descripcion, precio: i.precio, actualizado: hoy(), actualizadoPor: usuarioId }); agregados++; }
      });
      if (modo === 'reemplazar') { const antes = db.catalogo.length; db.catalogo = db.catalogo.filter(p => !marcas.has(p.marca) || vigentes.has(p.id)); quitados = antes - db.catalogo.length; }
      db.catalogo.push(...nuevos);
      db.catalogoInfo = { actualizado: hoy(), por: usuarioId, origen: 'importado', archivo: archivo || '' };
      logCatalogo(usuarioId, `Importó ${archivo || 'lista de precios'} (${modo === 'reemplazar' ? 'reemplazando' : 'completando'} ${[...marcas].join(', ')}): ${agregados} nuevos, ${actualizados} actualizados, ${quitados} quitados`);
      touch();
      return { agregados, actualizados, quitados };
    },

          else c[k] = v;
        });
        if (f.cambios.some(([k]) => k !== 'vendedorId')) r.actualizados++;
      });

    /** POST /cotizaciones — registra una cotización: oportunidad nueva, revisión o alternativa */
    async registrarCotizacion(p, usuarioId) {

  function niceMax(v) {
    if (!(v > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const f of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (f * p >= v) return f * p;
    return 10 * p;
  }
  const kfmt = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0).replace(/\.0$/, '') + 'K' : String(Math.round(v));

  function legendHTML(spec) {
    const parts = spec.series.length > 1 || spec.line ? spec.series.map(s => `<span><span class="sw" style="background:${s.color}"></span>${E(s.name)}</span>`) : [];
    if (spec.line) parts.push(`<span><span class="ln"></span>${E(spec.line.name)}</span>`);
    return parts.length ? `<div class="legend">${parts.join('')}</div>` : '';
  }
  function drawCharts() {
    Object.entries(S.charts).forEach(([id, spec]) => { const el = document.getElementById(id); if (el) drawBar(el, spec); });
  }
  function drawBar(el, spec) {
    const W = Math.max(260, el.clientWidth || 600), H = spec.height || 240;
    const m = { t: 14, r: 8, b: 30, l: 46 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.categories.length;
    const tot = spec.categories.map((_, i) => Util.sum(spec.series, s => s.values[i]));
    const maxV = niceMax(Math.max(...tot, ...(spec.line ? spec.line.values : [0])) * 1.05);
    const y = v => m.t + ih - (v / maxV) * ih;
    const band = iw / n, bw = Math.min(56, band * 0.62);
    let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    for (let k = 0; k <= 4; k++) {
      const v = maxV * k / 4, yy = y(v);
      svg += `<g class="grid"><line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/></g><text x="${m.l - 6}" y="${yy + 4}" text-anchor="end">${kfmt(v)}</text>`;
    }
    spec.categories.forEach((c, i) => {
      const cx = m.l + band * i + band / 2;
      let acc = 0;
      spec.series.forEach(s => {
        const v = s.values[i] || 0;
        if (v <= 0) return;
        const y0 = y(acc), y1 = y(acc + v);
        const h = Math.max(1, y0 - y1 - (acc > 0 ? 2 : 0));
        const tip = `${c} · ${s.name}: ${Util.money(v)}`;
        svg += `<rect class="bar" x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${h}" rx="${acc + v >= tot[i] - 0.01 ? 4 : 0}" fill="${s.color}" data-tip="${E(tip)}"><title>${E(tip)}</title></rect>`;
        acc += v;
      });
      const lab = band < 62 && spec.shortCategories ? spec.shortCategories[i] : c;
      svg += `<text x="${cx}" y="${H - 10}" text-anchor="middle"${band < 50 ? ' style="font-size:10px"' : ''}>${E(lab)}</text>`;
      if (spec.totalLabels && tot[i] > 0) svg += `<text x="${cx}" y="${y(tot[i]) - 5}" text-anchor="middle" style="font-weight:700;fill:var(--text)">${kfmt(tot[i])}</text>`;
    });
    if (spec.line) {
      const pts = spec.line.values.map((v, i) => [m.l + band * i + band / 2, y(v)]);
      const lx0 = m.l, lx1 = W - m.r;
      const flat = spec.line.values.every(v => v === spec.line.values[0]);
      if (flat) svg += `<line x1="${lx0}" x2="${lx1}" y1="${pts[0][1]}" y2="${pts[0][1]}" stroke="#4a5767" stroke-width="2" stroke-dasharray="6 4"><title>${E(spec.line.name)}: ${Util.money(spec.line.values[0])}</title></line>`;
      else svg += `<polyline fill="none" stroke="#4a5767" stroke-width="2" stroke-dasharray="6 4" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
      svg += `<text x="${lx1}" y="${pts[pts.length - 1][1] - 6}" text-anchor="end" style="font-weight:700">${E(spec.line.label || spec.line.name)}</text>`;
    }
    svg += '</svg><div class="tip hidden"></div>';
    el.innerHTML = svg;
    const tipEl = el.querySelector('.tip');
    el.onmousemove = ev => {
      const r = ev.target.closest && ev.target.closest('[data-tip]');
      if (!r) { tipEl.classList.add('hidden'); return; }
      const box = el.getBoundingClientRect();
      tipEl.textContent = r.getAttribute('data-tip');
      tipEl.style.left = Math.min(box.width - 80, Math.max(80, ev.clientX - box.left)) + 'px';
      tipEl.style.top = (ev.clientY - box.top - 8) + 'px';
      tipEl.classList.remove('hidden');
    };
    el.onmouseleave = () => tipEl.classList.add('hidden');
    $$('title', el).forEach(t => t.remove()); // el tooltip propio reemplaza al nativo
  }

  /* ---------- Carpeta de cotizaciones del vendedor (Chrome y Edge): los PDF se guardan solos en una carpeta de su PC ----------

  const CarpetaCot = (() => {
    const clave = () => 'carpeta-cot:' + S.user.id;
    const soportado = () => typeof window.showDirectoryPicker === 'function' && Almacen.disponible();
    async function config() { if (!S.user || !soportado()) return null; try { return await Almacen.leer(clave()); } catch (e) { return null; } }
    const guardarConfig = c => Almacen.escribir(clave(), c);
    async function elegir() {
      const h = await window.showDirectoryPicker({ id: 'cotizaciones', mode: 'readwrite' }), c = Object.assign((await config()) || { sub: 'ninguna' }, { h, nombre: h.name });
      await guardarConfig(c); return c;
    }
    async function permiso(h, pedir) {
      const o = { mode: 'readwrite' };
      if ((await h.queryPermission(o)) === 'granted') return true;
      if (!pedir) return false;
      try { return (await h.requestPermission(o)) === 'granted'; } catch (e) { return false; }   // sin un clic reciente el navegador no deja preguntar
    }

    const archivoDe = async (dir, n) => { try { return await (await dir.getFileHandle(n)).getFile(); } catch (e) { return null; } };
    /** Guarda sin sobrescribir nunca: si el nombre existe con otro contenido, agrega (2), (3)…; si es el mismo archivo, no lo duplica */
    async function guardar(blob, q, cliente, pedir) {
      const c = await config(); if (!c || !c.h) return null;
      if (!(await permiso(c.h, pedir))) { const e = new Error('Falta confirmar el permiso de la carpeta.'); e.permiso = true; throw e; }
      const sub = c.sub === 'mes' ? String(q.fechaEmision || Util.today()).slice(0, 7) : c.sub === 'cliente' && cliente ? limpiar(cliente.razonSocial) : '';
      const dir = sub ? await c.h.getDirectoryHandle(sub, { create: true }) : c.h;
      const base = limpiar(`${q.numero || 'cotizacion'} - ${cliente ? cliente.razonSocial : 'cliente'}`), ruta = n => [c.nombre, sub, n].filter(Boolean).join('/');
      for (let i = 1; ; i++) {
        const n = i === 1 ? base + '.pdf' : `${base} (${i}).pdf`, f = await archivoDe(dir, n);
        if (f && f.size === blob.size) return { ruta: ruta(n), ya: true };
        if (f) continue;
        const w = await (await dir.getFileHandle(n, { create: true })).createWritable();

  /* ---- Carpeta compartida (recurso compartido de red, sin servidor ni nube) ---- */
  function carpetaHTML() {
    const e = Repo.estadoGuardado();
    if (!AlmacenCompartido.soportado()) return `<div class="alert warn" style="margin-bottom:12px"><div class="small"><strong>Este navegador no puede usar la carpeta compartida.</strong> Abre el archivo en Microsoft Edge o Google Chrome para trabajar con los datos del equipo. Aquí los datos quedan solo en este navegador.</div></div>`;
    if (e.compartida) return `<div class="alert ok" style="margin-bottom:12px"><div class="small"><strong>✓ Carpeta compartida: ${E(e.carpeta)}</strong><br>Todo el equipo trabaja con los mismos datos.</div><button class="btn sm ghost" data-action="carpeta-elegir">Cambiar</button></div>`;
    if (S.carpetaRecordada) return `<div class="alert warn" style="margin-bottom:12px"><div class="small"><strong>Conecta la carpeta compartida «${E(S.carpetaRecordada.name)}»</strong> para ver los datos del equipo. El navegador te pedirá permiso.
      <br><a href="#" data-action="carpeta-olvidar">No usar carpeta en esta PC</a></div><button class="btn sm primary" data-action="carpeta-conectar">Conectar</button></div>`;
    return `<div class="alert info" style="margin-bottom:12px"><div class="small"><strong>Carpeta compartida del equipo.</strong> Elige la carpeta de red acordada (por ejemplo Z:\Ventas\Piloto); todos deben elegir la misma. Sin carpeta, los datos quedan solo en este navegador.</div><button class="btn sm primary" data-action="carpeta-elegir">Elegir carpeta…</button></div>`;
  }
  async function conectarCarpeta(h) {
    try {
      const r = await Repo.revisarCarpeta(h);
      if (r.vacia && r.localConCambios) {
        modal({ title: 'La carpeta compartida está vacía', body: `<p style="margin-top:0">La carpeta <strong>${E(r.nombre)}</strong> todavía no tiene datos. ¿Con qué datos empieza el equipo?</p>
          <div class="alert info"><div>Este navegador tiene registros propios (por ejemplo, cotizaciones que ya ingresaste). Si eres quien más ha usado el piloto, empieza con estos datos.</div></div>`,
          actions: [{ label: 'Cancelar' }, { label: 'Datos iniciales del piloto', onClick: () => terminarConexion(h, 'seed') }, { label: 'Datos de este navegador', cls: 'primary', onClick: () => terminarConexion(h, 'local') }] });
        return;
      }
      await terminarConexion(h, 'local');
    } catch (e) { toast('No se pudo usar la carpeta: ' + e.message); }
  }
  async function terminarConexion(h, siVacia) {
    const { anterior } = await Repo.conectarCarpeta(h, { siVacia });
    try { await Repo.migrar(); } catch (e) { /* se reintenta en el próximo arranque */ }
    S.carpetaRecordada = h; S.db = await Repo.snapshot();
    if (S.user) S.user = Repo.sesion(S.user.id);
    toast(`Conectado a la carpeta ${h.name}.`);
    await render();
    if (anterior) {
      Util.descargar(anterior, `respaldo-este-navegador-${hoy()}.json`);
      modal({ title: 'Registros de este navegador', body: `<p style="margin-top:0">Este navegador tenía registros propios que no están en la carpeta compartida. Se descargó un respaldo (<strong>respaldo-este-navegador-${hoy()}.json</strong>).</p><p>Desde ahora se trabaja con los datos de la carpeta. Si esos registros hacen falta, envía el respaldo a gerencia.</p>`, actions: [{ label: 'Entendido', cls: 'primary' }] });
    }
  }
  ACTIONS['carpeta-elegir'] = async () => {
    let h; try { h = await AlmacenCompartido.elegir(); } catch (e) { if (e.name !== 'AbortError') toast('No se pudo abrir la carpeta: ' + e.message); return; }
    await conectarCarpeta(h);
  };
  ACTIONS['carpeta-conectar'] = async () => {
    const h = S.carpetaRecordada; if (!h) return;
    try { if (!(await AlmacenCompartido.permiso(h, true))) { toast('Sin permiso para usar la carpeta.'); return; } } catch (e) { toast('No se pudo acceder a la carpeta: ' + e.message); return; }
    await conectarCarpeta(h);
  };
  ACTIONS['carpeta-olvidar'] = async () => { await Repo.desconectarCarpeta(); S.carpetaRecordada = null; render(); };

  function filasOpps() {
    const db = S.db, h = hoy(), F = S.filtros;
    const term = F.q.trim().toLowerCase();
    const rows = [];
    Rules.oppsVisibles(db, S.user).forEach(o => {
      if (F.etapa === 'abiertas' && !Rules.esAbierta(o)) return;
      if (F.etapa === 'cerradas' && Rules.esAbierta(o)) return;
      if (F.etapa === 'verificar' && !o.verificar) return;
      if (F.etapa && !['abiertas', 'cerradas', 'todas', 'verificar'].includes(F.etapa) && o.etapa !== F.etapa) return;
      if (F.cliente && o.clienteId !== F.cliente) return;
      if (F.proyecto && o.proyectoId !== F.proyecto) return;
      if (F.vendedor && o.vendedorId !== F.vendedor) return;
      if (F.desde && o.fechaInicio < F.desde) return;
      if (F.hasta && o.fechaInicio > F.hasta) return;
      const q = Rules.vigente(db, o);
      if (F.marca && !Rules.marcas(q).includes(F.marca)) return;
      const c = cli(o.clienteId), p = proj(o.proyectoId);
      if (term) {
        const hay = [c.razonSocial, c.ruc, projName(p), p.usuarioFinal, ...Rules.quotesOf(db, o).map(x => x.numero), ...(q ? q.items.map(it => it.codigo) : [])].join(' ').toLowerCase();
        if (!hay.includes(term)) return;
      }
      const ult = ultimoContacto(o);
      const sinFacturar = Rules.esAbierta(o) || (o.etapa === 'ganada' && !(o.postventa && o.postventa.facturado));
      const fecFac = sinFacturar ? Rules.fechaFactura(db, o) : null;
      rows.push({ o, q, c, p, cliente: c.razonSocial, proyecto: projName(p), marca: Rules.marcaPrincipal(q), items: Rules.resumenItems(q),
        monto: Rules.montoUSD(db, o), prob: o.etapa === 'pausa' ? -1 : Rules.prob(o.etapa), pond: Rules.ponderado(db, o), ult,
        dias: ult ? Util.diffDays(ult, h) : null, prox: o.proxContacto, fecFac, fact: Rules.horizonte(fecFac, h), vend: usr(o.vendedorId),
        numero: q ? q.numero : '', fecCot: ultimaCot(o), alertas: Rules.alertasOpp(db, o, h) });
    });
    const { col, dir } = S.orden;
    const key = r => {
      switch (col) {
        case 'prox': return r.prox || (Rules.esAbierta(r.o) ? '0000' : '9999');
        case 'fact': return r.fecFac || '9999';
        case 'fecCot': return r.fecCot || '';
        case 'vend': return r.vend.iniciales;
        case 'etapa': return r.prob;
        default: return r[col] == null ? -Infinity : r[col];
      }
    };
    rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
    return rows;
  }

            <div class="small">RUC ${E(c.ruc)} · ${E(c.tipo)} · ${E(c.ciudad)} · Facturado 12 meses: <strong>${money(seg.total)}</strong></div>

  /** Corregir los datos del cliente y del contacto que salen en el PDF de una cotización ya registrada */
  ACTIONS['q-datos'] = el => {

  function quoteHTML(q, ed) {

          ${q.items.map(it => `<tr><td class="r">${it.cant}</td><td>${E(it.unidad)}</td><td class="nowrap"><strong>${E(it.codigo)}</strong></td><td>${E(it.marca)}</td><td class="small">${E(it.descripcion)}</td>

  /* ---------- Documentos de la oportunidad (OC, guías, actas, facturas…) para descargarlos cuando se necesiten ---------- */

  function docsCardHTML(o) {

      ${Repo.modo() === 'piloto' && !Repo.compartida() ? '<p class="small muted" style="margin:8px 0 0">Sin carpeta compartida, los archivos quedan solo en este navegador. Conecta la carpeta para que el equipo pueda descargarlos.</p>' : ''}</section>`;
  }
  ACTIONS['doc-bajar'] = async el => {
    const d = (S.db.documentos || []).find(x => x.id === el.dataset.doc); if (!d) return;
    try { Util.descargar(await Repo.leerDocumento(d.id), d.nombre); } catch (e) { toast(e.message); }

  /** Subir uno o varios archivos; el tipo sugiere el paso de post-venta que respalda */
  function abrirSubirDocumento(oppId, paso, volver) {

  function eventosOutlook(v) {
    const db = S.db, h = hoy(), fin = Util.addDays(h, 14), ev = [];
    db.opps.filter(o => o.vendedorId === v.id).forEach(o => {
      const c = cli(o.clienteId), p = projName(proj(o.proyectoId));
      if (Rules.esAbierta(o) && o.proxContacto && o.proxContacto <= fin) {
        const f = o.proxContacto < h ? h : o.proxContacto;
        ev.push({ fecha: f, todoDia: false, titulo: `Seguimiento: ${c.razonSocial} — ${p}`, desc: `${Rules.etapa(o.etapa).nombre} · ${Util.money0(Rules.montoUSD(db, o))}${o.proxContacto < h ? ' · reprogramado (estaba atrasado)' : ''}`, tipo: 'Seguimiento' });
      }
      if (Rules.esAbierta(o)) {
        const q = Rules.vigente(db, o), vence = Util.addDays(q.fechaEmision, q.validezDias);
        if (vence >= h && vence <= fin) ev.push({ fecha: vence, todoDia: true, titulo: `Vence cotización N° ${q.numero} (${c.razonSocial})`, desc: 'Aviso 1 día antes', tipo: 'Vencimiento' });
        if (o.fechaOC && o.fechaOC >= h && o.fechaOC <= fin) ev.push({ fecha: o.fechaOC, todoDia: true, titulo: `OC estimada: ${c.razonSocial}`, desc: `${p} · ${Util.money0(Rules.montoUSD(db, o))}`, tipo: 'Fecha de OC' });
      }
      if (o.etapa === 'pausa' && o.fechaReactivacion >= h && o.fechaReactivacion <= fin) ev.push({ fecha: o.fechaReactivacion, todoDia: true, titulo: `Reactivar: ${c.razonSocial} — ${p}`, desc: 'Oportunidad en pausa', tipo: 'Reactivación' });
    });
    ev.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.todoDia === b.todoDia ? 0 : a.todoDia ? -1 : 1));
    const slot = {};
    ev.forEach(e => { if (!e.todoDia) { const k = slot[e.fecha] = (slot[e.fecha] || 0) + 1; const m = 9 * 60 + (k - 1) * 15; e.hora = `${Util.pad(Math.floor(m / 60))}:${Util.pad(m % 60)}–${Util.pad(Math.floor((m + 15) / 60))}:${Util.pad((m + 15) % 60)}`; } });
    return ev;

      <div class="table-wrap"><table class="tbl" style="min-width:1000px"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Cargo</th><th>Correo</th><th>Teléfono</th><th class="r">Meta mensual</th><th>Estado</th><th></th></tr></thead><tbody>
        ${us.map(u => `<tr${u.activo === false ? ' style="opacity:.6"' : ''}><td class="nowrap">${avatarSm(u)}<strong>${E(u.nombre)}</strong> <span class="muted small">${E(u.iniciales)}</span></td>
          <td><code>${E(u.usuario)}</code></td><td class="nowrap">${E(Rules.rolNombre(u))}</td><td class="small">${E(u.cargo || '—')}</td><td class="small">${E(u.correo || '—')}</td><td class="small nowrap">${E(u.telefono || '—')}</td>
          <td class="r num">${u.rol === 'vendedor' ? Util.money0(u.meta || Config.META_MENSUAL_USD) : '—'}</td>
          <td>${u.activo === false ? '<span class="chip">Inactivo</span>' : '<span class="chip ok">Activo</span>'}${u.debeCambiar && piloto() ? ' <span class="chip warn">Contraseña temporal</span>' : ''}</td>
          <td class="nowrap"><button class="btn sm" data-action="usuario-editar" data-id="${u.id}">Editar</button>${piloto() ? ` <button class="btn sm" data-action="usuario-clave" data-id="${u.id}">Restablecer contraseña</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted">Roles: ${Object.values(Config.ROLES).map(E).join(' · ')}. Gerencia y jefatura tienen todos los permisos comerciales; administración gestiona usuarios y lista de precios. Para desactivar a un Account Manager, primero reasigna sus cuentas desde Cuentas.</p>`;
  };
  function mostrarTemporal(u, temporal, titulo) {
    modal({ title: titulo, body: `<p style="margin-top:0">Entrega esta contraseña temporal a <strong>${E(u.nombre)}</strong> (usuario <code>${E(u.usuario)}</code>). Al ingresar deberá cambiarla.</p>
      <div style="font-size:22px;font-weight:800;letter-spacing:.08em;text-align:center;padding:14px;border:1px dashed var(--border-2);border-radius:8px;font-family:monospace">${E(temporal)}</div>
      <p class="small muted">No se volverá a mostrar. Entrégala por un canal interno.</p>`, actions: [{ label: 'Listo', cls: 'primary' }] });
  }
  ACTIONS['usuario-editar'] = el => {
    const u = el.dataset.id ? S.db.users.find(x => x.id === el.dataset.id) : { rol: 'vendedor', meta: Config.META_MENSUAL_USD, activo: true };
    const root = modal({
      title: el.dataset.id ? `Editar usuario · ${u.nombre}` : 'Nuevo usuario', wide: true,
      body: `<div class="form-grid">
        <label class="field"><span>Nombre completo <span class="req">*</span></span><input type="text" name="nombre" value="${E(u.nombre || '')}"></label>
        <label class="field"><span>Iniciales <span class="req">*</span></span><input type="text" name="iniciales" maxlength="3" value="${E(u.iniciales || '')}" style="text-transform:uppercase"></label>
        <label class="field"><span>Usuario de ingreso <span class="req">*</span></span><input type="text" name="usuario" value="${E(u.usuario || '')}" autocapitalize="none"></label>
        <label class="field"><span>Rol <span class="req">*</span></span><select name="rol">${options(Object.entries(Config.ROLES), u.rol)}</select></label>
        <label class="field">Cargo<input type="text" name="cargo" value="${E(u.cargo || '')}" placeholder="Ej.: Account Manager"></label>
        <label class="field">Correo<input type="email" name="correo" value="${E(u.correo || '')}"></label>
        <label class="field">Teléfono (sale en el PDF)<input type="text" name="telefono" value="${E(u.telefono || '')}"></label>
        <label class="field" id="campo-meta">Meta mensual USD (Account Manager)<input type="number" min="0" step="1000" name="meta" value="${E(u.meta || Config.META_MENSUAL_USD)}"></label>
      </div>
      ${el.dataset.id ? `<label style="display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer"><input type="checkbox" name="activo"${u.activo !== false ? ' checked' : ''}> Usuario activo (puede ingresar)</label>` : ''}
      ${el.dataset.id ? '' : `<p class="small muted">${piloto() ? 'Se generará una contraseña temporal que se mostrará una sola vez.' : 'En la demo la contraseña del nuevo usuario es la temporal que se muestra.'}</p>`}`,
      actions: [{ label: 'Cancelar' }, { label: `${I('check')} Guardar`, cls: 'primary', onClick: async r => {
        const act = r.querySelector('[name=activo]');
        const res = await Repo.guardarUsuario({ id: el.dataset.id || null, nombre: val(r, 'nombre'), iniciales: val(r, 'iniciales'), usuario: val(r, 'usuario'), rol: val(r, 'rol'),
          cargo: val(r, 'cargo'), correo: val(r, 'correo'), telefono: val(r, 'telefono'), meta: val(r, 'meta'), activo: act ? act.checked : true }, S.user.id);
        S.user = S.db.users.find(x => x.id === S.user.id);
        toast('Usuario guardado.'); refresh();
        if (res.temporal) setTimeout(() => mostrarTemporal(res.usuario, res.temporal, 'Usuario creado'), 60);
      } }],
    });
    const sel = root.querySelector('[name=rol]'), cm = root.querySelector('#campo-meta');
    const upd = () => cm.classList.toggle('hidden', sel.value !== 'vendedor');
    sel.addEventListener('change', upd); upd();
  };
  ACTIONS['usuario-clave'] = el => {
    const u = S.db.users.find(x => x.id === el.dataset.id);
    modal({ title: 'Restablecer contraseña', body: `<p style="margin-top:0">Se generará una contraseña temporal para <strong>${E(u.nombre)}</strong>. Su contraseña actual dejará de funcionar.</p>`,
      actions: [{ label: 'Cancelar' }, { label: 'Restablecer', cls: 'primary', onClick: async () => {
        const t = await Repo.restablecerClave(u.id, S.user.id); refresh(); setTimeout(() => mostrarTemporal(u, t, 'Contraseña restablecida'), 60);
      } }] });
  };

  /* =====================================================================
     POST-VENTA — cada área marca sus pasos (logística: físicos; finanzas: factura y cobro)
     ===================================================================== */
  /* =====================================================================
     COTIZACIONES — visor de solo lectura para las áreas de post-venta (finanzas, logística y administración)
     ===================================================================== */
  PAGES['cotizaciones'] = async () => {
    const db = S.db, F = S.cotF, t = Util.norm(F.q);
    const filas = [];
    db.quotes.forEach(q => {
      const o = oppById(q.oppId); if (!o) return;
      if (F.vendedor && o.vendedorId !== F.vendedor) return;
      if (F.etapa && (F.etapa === 'abiertas' ? !Rules.esAbierta(o) : o.etapa !== F.etapa)) return;
      const c = cli(o.clienteId), p = proj(o.proyectoId);
      if (t && !Util.norm([q.numero, c && c.razonSocial, c && c.ruc, p && p.nombre, q.referencia].join(' ')).includes(t)) return;
      filas.push({ q, o, c, p });
    });
    filas.sort((a, b) => (b.q.fechaEmision || '').localeCompare(a.q.fechaEmision || '') || String(b.q.numero).localeCompare(String(a.q.numero)));
    view().innerHTML = `
      <div class="page-head"><div><h1>Cotizaciones</h1><p class="muted">Todas las cotizaciones de los vendedores · solo lectura · ${db.quotes.length.toLocaleString('en-US')} registradas</p></div></div>
      <div class="card" style="padding:12px"><div class="filters" style="margin:0">
        <label class="field" style="flex:2 1 300px">Buscar<input type="text" data-input="cotf" name="q" value="${E(F.q)}" placeholder="N° de cotización, cliente, RUC, proyecto o referencia" autocomplete="off"></label>
        <label class="field">Vendedor<select data-change="cotf" name="vendedor">${options(S.db.users.filter(u => u.rol === 'vendedor').map(v => [v.id, v.iniciales + ' · ' + v.nombre]), F.vendedor, 'Todos')}</select></label>
        <label class="field">Etapa<select data-change="cotf" name="etapa">${options([['abiertas', 'Abiertas'], ['ganada', 'Ganadas'], ['perdida', 'Perdidas'], ['pausa', 'En pausa']], F.etapa, 'Todas')}</select></label>
      </div><div class="small muted" style="margin-top:8px">${filas.length.toLocaleString('en-US')} cotizaciones · de la más reciente a la más antigua</div></div>
      <div class="table-wrap" style="margin-top:12px"><table class="tbl" style="min-width:980px"><thead><tr><th>N° cotización</th><th>Emisión</th><th>Cliente</th><th>Proyecto</th><th>Vendedor</th><th class="r">Monto sin IGV</th><th>Etapa</th><th></th></tr></thead><tbody>
        ${filas.slice(0, F.lim).map(({ q, o, c, p }) => { const v = usr(o.vendedorId); return `<tr>
          <td class="nowrap"><strong>${E(q.numero || '—')}</strong>${q.vigente === false ? ' <span class="chip">Reemplazada</span>' : ''}${q.referencia ? `<div class="cell-sub">${E(q.referencia)}</div>` : ''}</td>
          <td class="nowrap">${Util.fmtDate(q.fechaEmision)}</td>
          <td>${E(c ? c.razonSocial : '—')}<div class="cell-sub">${c && c.ruc ? 'RUC ' + E(c.ruc) : ''}</div></td>
          <td class="small">${E(projName(p))}</td>
          <td class="nowrap">${v ? vendTag(v) : '—'}</td>
          <td class="r num nowrap">${Util.money(Rules.totales(q).neto, q.moneda)}</td>
          <td class="nowrap">${etapaHTML(o.etapa)}</td>
          <td><button class="btn sm" data-action="ver-pdf" data-q="${q.id}">${I('file')} Ver PDF</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="center muted" style="padding:20px">Sin cotizaciones con estos filtros.</td></tr>'}
      </tbody></table></div>
      ${filas.length > F.lim ? `<div style="text-align:center;margin-top:12px"><button class="btn" data-action="cot-mas">Ver más (${(filas.length - F.lim).toLocaleString('en-US')} restantes)</button></div>` : ''}
      <p class="small muted">Visor de consulta: se puede ver y descargar el PDF de cada cotización, pero no editarla. Los documentos de cada venta ganada están en Post-venta.</p>`;
  };
  ACTIONS['cot-mas'] = () => { S.cotF.lim += 50; refresh(); };
  filtro('cotf', () => S.cotF, F => { F.lim = 50; });

  PAGES['postventa'] = async () => {
    const db = S.db, u = S.user, F = S.pvF;
    let rows = db.opps.filter(o => o.etapa === 'ganada' && (!F.vendedor || o.vendedorId === F.vendedor));
    const tq = String(F.q || '').trim().toLowerCase();
    if (tq) rows = rows.filter(o => { const c = cli(o.clienteId); return [c.razonSocial, c.ruc, ...Rules.quotesOf(db, o).map(q => q.numero)].join(' ').toLowerCase().includes(tq); });
    if (F.estado === 'pendientes') rows = rows.filter(o => !(o.postventa && o.postventa.cobrado));
    if (F.estado === 'logistica') rows = rows.filter(o => !(o.postventa && o.postventa.entregado));
    if (F.estado === 'facturar') rows = rows.filter(o => o.postventa && o.postventa.entregado && !o.postventa.facturado);
    rows.sort((a, b) => (Rules.fechaOCRef(b) || '') < (Rules.fechaOCRef(a) || '') ? -1 : 1);
    const total = rows.length; rows = rows.slice(0, 150);
    const porArea = db.config && db.config.postventaPorArea;
    view().innerHTML = `<div class="page-head"><div><h1>Post-venta</h1><p class="muted">${porArea ? 'Administración y finanzas marcan todos los pasos; logística, pedido, tránsito, recepción y entrega. Los documentos (📎) quedan para descargarlos cuando se necesiten.' : 'Avance de las oportunidades ganadas.'}</p></div></div>
      <div class="card" style="padding:12px"><div class="filters" style="margin:0">
        <label class="field" style="flex:2 1 260px">Buscar<input type="text" data-input="pvf" name="q" value="${E(F.q || '')}" placeholder="Cliente, RUC o N° de cotización"></label>
        <label class="field">Mostrar<select data-change="pvf" name="estado">${options([['pendientes', 'Pendientes de cobro'], ['logistica', 'Pendientes de entrega'], ['facturar', 'Entregadas sin facturar'], ['todas', 'Todas las ganadas']], F.estado)}</select></label>
        <label class="field">Account Manager<select data-change="pvf" name="vendedor">${options(db.users.filter(x => x.rol === 'vendedor').map(v => [v.id, v.iniciales + ' · ' + v.nombre]), F.vendedor, 'Todos')}</select></label>
      </div><div class="small muted" style="margin-top:8px">${total} oportunidades${total > rows.length ? ' · mostrando 150' : ''}</div></div>
      <div class="table-wrap" style="margin-top:12px"><table class="tbl" style="min-width:1250px"><thead><tr><th>Cliente / cotización</th><th>AM</th><th class="r">Monto</th><th>Docs.</th>${Config.POSTVENTA.map(p => `<th>${E(p.nombre)}</th>`).join('')}</tr></thead><tbody>
        ${rows.map(o => { const pv = o.postventa || {}, q = Rules.vigente(db, o); return `<tr><td><div class="cell-main">${Rules.puede(u, 'ver_opp', o) ? `<a href="#/op/${o.id}" style="color:inherit">${E(cli(o.clienteId).razonSocial)}</a>` : E(cli(o.clienteId).razonSocial)}</div><div class="cell-sub">${E(q ? q.numero : '')}</div></td>
          <td>${vendTag(usr(o.vendedorId))}</td><td class="r num">${Util.money0(Rules.montoUSD(db, o))}</td>
          <td><button class="btn sm" data-action="doc-ver" data-id="${o.id}" title="Ver, descargar y subir documentos">📎 ${(db.documentos || []).filter(d => d.oppId === o.id).length}</button></td>
          ${Config.POSTVENTA.map(p => `<td>${Rules.puedePaso(u, p.id, o, db) ? `<input type="date" data-change="pv" data-id="${o.id}" data-paso="${p.id}" value="${pv[p.id] || ''}" max="${hoy()}" aria-label="${E(p.nombre)}" style="min-width:130px">` : (pv[p.id] ? `<span class="chip ok">${Util.fmtDate(pv[p.id])}</span>` : '<span class="muted">—</span>')}</td>`).join('')}</tr>`; }).join('') || '<tr><td colspan="10" class="center muted" style="padding:20px">Nada pendiente.</td></tr>'}
      </tbody></table></div>`;
  };
  filtro('pvf', () => S.pvF);

  /* ---------- Arranque ---------- */
  let tResize = null;
  async function boot() {
    await Repo.init();
    aplicarLogo();
    if (Repo.modo() !== 'piloto') SelfTest.run();   // en el piloto no se repite en cada arranque; se puede llamar a mano
    if (Repo.modo() === 'piloto') {
      S.db = await Repo.snapshot();
      if (AlmacenCompartido.soportado()) S.carpetaRecordada = await AlmacenCompartido.recordada();
      try { await Repo.migrar(); S.db = await Repo.snapshot(); } catch (e) { /* se reintenta en el próximo arranque */ }
      // Cambios de otros usuarios en la carpeta compartida: se ven sin recargar (salvo mientras se edita algo)
      Repo.alCambioRemoto(async () => {
        S.db = await Repo.snapshot();
        if (S.user) { const u = Repo.sesion(S.user.id); if (!u) { S.user = null; guardarSesion(null); location.hash = '#/login'; toast('Tu usuario fue desactivado.'); render(); return; } S.user = u; }
        const ocupado = document.querySelector('#modal-root .modal') || S.ruta === 'nueva' || S.ruta === 'login' || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
        if (!ocupado && S.user) refresh();
      });
      setInterval(() => Repo.refrescar(), 8000);
      window.addEventListener('focus', () => Repo.refrescar());
      try { const id = sessionStorage.getItem('tv-sesion'); if (id && !Repo.estadoGuardado().seedNuevo && !(S.carpetaRecordada && !Repo.compartida())) S.user = Repo.sesion(id); } catch (e) { /* sin sesión guardada */ }
    }
    window.addEventListener('hashchange', () => render());
    window.addEventListener('resize', () => { clearTimeout(tResize); tResize = setTimeout(drawCharts, 150); });
    await render();
    if (S.user && S.user.debeCambiar && Repo.modo() === 'piloto') abrirCambioClave(true);
  }
  return { boot, render, _state: S };
})();

UI.boot();
</script>
</body>
</html>
