    if (g && window.matchMedia('(max-width: 860px)').matches) g.style.gridTemplateColumns = 'minmax(0,1fr)';
  };
  ACTIONS['asignar-cuenta-btn'] = async el => {
    const to = $('#asig-cta').value, c = cli(el.dataset.id);
    if (!to || to === c.vendedorId) return toast('Elige un vendedor distinto.');
    const n = await Repo.reasignarCliente(c.id, to, S.user.id);
    toast(`Cuenta asignada a ${usr(to).nombre}${n ? ` junto con ${n} oportunidad(es) abiertas` : ''}.`); refresh();
  };

  /* =====================================================================
     AGENDA DE CONTACTOS — común para todo el equipo
     ===================================================================== */
  PAGES['contactos'] = async () => {
    const db = S.db, u = S.user, F = S.agF;
    let rows = db.clients.flatMap(c => c.contactos.map(k => ({ k, c })));
    const total = rows.length, empresas = db.clients.filter(c => c.contactos.length).length;
    if (F.vendedor) rows = rows.filter(x => F.vendedor === '__mias' ? x.c.vendedorId === u.id : F.vendedor === '__sin' ? !x.c.vendedorId : x.c.vendedorId === F.vendedor);
    if (F.q.trim()) { const t = F.q.trim().toLowerCase(); rows = rows.filter(x => [x.k.nombre, x.k.cargo, x.k.correo, x.k.telefono, x.c.razonSocial, x.c.ruc].join(' ').toLowerCase().includes(t)); }
    rows.sort((a, b) => a.c.razonSocial.localeCompare(b.c.razonSocial) || a.k.nombre.localeCompare(b.k.nombre));
    const puedeAgregar = u.rol !== 'finanzas';
    const vOpts = [...(u.rol === 'vendedor' ? [['__mias', 'Mis cuentas']] : []), ...vendedores().map(v => [v.id, 'Cuentas de ' + v.nombre]), ['__sin', 'Cuentas sin asignar']];
    view().innerHTML = `
      <div class="page-head"><div><h1>Agenda de contactos</h1><p class="muted">Común para todo el equipo · ${total} contactos de ${empresas} empresas</p></div>
        ${puedeAgregar ? `<button class="btn primary" data-action="contacto-nuevo">${I('plus')} Agregar contacto</button>` : ''}</div>
      <div class="card" style="padding:12px"><div class="filters" style="margin:0">
        <label class="field">Buscar<input type="text" data-input="agf" name="q" value="${E(F.q)}" placeholder="Nombre, cargo, empresa, correo o teléfono"></label>
        <label class="field">Mostrar<select data-change="agf" name="vendedor">${options(vOpts, F.vendedor, 'Todas las cuentas')}</select></label>
      </div><div class="small muted" id="ag-count" style="margin-top:8px">${rows.length} contactos</div></div>
      <div class="table-wrap" style="margin-top:12px"><table class="tbl" style="min-width:1120px"><thead><tr><th>Nombre</th><th>Cargo</th><th>Empresa</th><th>Vend.</th><th>Correo</th><th>Teléfono</th><th></th></tr></thead><tbody>
        ${rows.map(({ k, c }) => `<tr><td class="cell-main nowrap">${E(k.nombre)}</td><td class="small">${E(k.cargo || '—')}</td>
          <td>${Rules.puede(u, 'ver_cuenta', c) ? `<a href="#/cuenta/${c.id}">${E(c.razonSocial)}</a>` : E(c.razonSocial)}</td>
          <td>${c.vendedorId ? vendTag(usr(c.vendedorId)) : '<span class="muted small">Sin asignar</span>'}</td>
          <td class="small">${k.correo ? `<a href="mailto:${E(k.correo)}">${E(k.correo)}</a>` : '—'}</td><td class="small nowrap">${E(k.telefono || '—')}</td>
          <td class="nowrap"><div class="btn-row" style="flex-wrap:nowrap">${contactoLinks(k)}${Rules.puede(u, 'editar_contactos', c) ? `<button class="btn sm" data-action="contacto-editar" data-cliente="${c.id}" data-k="${k.id}">Editar</button>` : ''}</div></td></tr>`).join('')
          || `<tr><td colspan="7" class="center muted" style="padding:20px">Sin contactos con estos filtros.</td></tr>`}
      </tbody></table></div>
      <p class="small muted">Registrar contactos es opcional. Cada vendedor (o jefatura) puede agregar y editar los contactos de sus cuentas; todos pueden consultarlos.</p>`;
  };
  CHANGES['agf'] = el => { S.agF[el.name] = el.value; render(true); };
  let tAg = null;
  INPUTS['agf'] = el => { S.agF[el.name] = el.value; clearTimeout(tAg); tAg = setTimeout(async () => { const pos = el.selectionStart; await render(true); const n = $('[data-input="agf"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); };

  /* =====================================================================
     LISTA DE PRECIOS — confidencial. Todos consultan; jefatura, finanzas y administración la mantienen.
     ===================================================================== */
  PAGES['catalogo'] = async () => {
    const db = S.db, u = S.user, F = S.catF, ed = Rules.puede(u, 'editar_catalogo');
    const marcas = marcasCatalogo(), info = db.catalogoInfo || {};
    const res = buscarProductos(F.q, F.marca, 150);
    const quien = id => id && usr(id) ? usr(id).nombre : '—';
    view().innerHTML = `
      <div class="page-head"><div><h1>Lista de precios <span class="conf">${I('alert').replace('<svg', '<svg width="12" height="12"')} Confidencial · uso interno</span></h1>
        <p class="muted">${db.catalogo.length.toLocaleString('en-US')} productos · ${marcas.length} marcas · actualizada el ${Util.fmtDate(info.actualizado)}${info.por ? ' por ' + E(quien(info.por)) : ''}${info.archivo ? ' · ' + E(info.archivo) : ''}</p></div>
        ${ed ? `<div class="btn-row"><button class="btn" data-action="cat-exportar">${I('download')} Exportar CSV</button><button class="btn" data-action="cat-importar">${I('upload')} Importar lista (Excel o CSV)</button><button class="btn primary" data-action="cat-producto">${I('plus')} Agregar producto</button></div>` : ''}</div>
      <input type="file" id="cat-file" accept=".xlsx,.csv" class="hidden">
      ${info.origen === 'privado' ? `<div class="alert warn"><div><strong>Lista real cargada desde un archivo privado.</strong> Este archivo contiene precios confidenciales: no lo publiques ni lo compartas fuera de la empresa.</div></div>`
        : info.origen === 'demo' ? `<div class="alert info"><div><strong>Lista de demostración con precios ficticios.</strong> ${ed ? 'Puedes importar la lista real (Excel con una hoja por marca, o CSV): se lee en este navegador y no se sube a ningún servidor.' : 'Jefatura, finanzas o administración cargan y actualizan la lista real.'}</div></div>` : ''}
      ${ed ? '' : `<div class="alert info" style="margin-top:10px"><div>Busca aquí cualquier producto. Al cotizar, escribe el código o la descripción y elige de la lista: se completan descripción y precio, que puedes ajustar <strong>solo para tu cotización</strong>. La lista la actualizan jefatura, finanzas o administración.</div></div>`}
      <div class="card" style="padding:12px;margin-top:12px">
        <div class="filters" style="margin:0"><label class="field">Buscar<input type="text" data-input="catf" name="q" value="${E(F.q)}" placeholder="Código o descripción" autocomplete="off"></label>
          <label class="field">Marca<select data-change="catf" name="marca">${options(marcas.map(m => [m.marca, `${m.marca} (${m.n.toLocaleString('en-US')})`]), F.marca, 'Todas las marcas')}</select></label></div>
        <div class="btn-row" style="margin-top:10px">${marcas.map(m => `<button class="chip${F.marca === m.marca ? ' dark' : ''}" style="cursor:pointer" data-action="cat-marca" data-m="${E(m.marca)}">${E(m.marca)} · ${m.n.toLocaleString('en-US')}</button>`).join('')}</div>
      </div>
      <div class="small muted" style="margin:10px 0 6px" id="cat-count">${res.total.toLocaleString('en-US')} productos${res.total > res.length ? ` · mostrando ${res.length}; escribe para afinar la búsqueda` : ''}</div>
      <div class="table-wrap"><table class="tbl" style="min-width:${ed ? 980 : 820}px"><thead><tr><th>Marca</th><th>Código</th><th>Descripción</th><th class="r">Precio lista (USD)</th><th>Actualizado</th>${ed ? '<th></th>' : ''}</tr></thead><tbody>
        ${res.map(p => `<tr><td class="nowrap">${E(p.marca)}</td><td class="nowrap"><strong>${E(p.codigo)}</strong></td><td class="small">${E(p.descripcion)}</td><td class="r num">${Util.nf2.format(p.precio)}</td>
          <td class="small nowrap">${Util.fmtDate(p.actualizado)}${p.actualizadoPor ? `<div class="cell-sub">${E(quien(p.actualizadoPor))}</div>` : ''}</td>
          ${ed ? `<td class="nowrap"><button class="btn sm" data-action="cat-producto" data-id="${p.id}">Editar</button> <button class="btn sm bad" data-action="cat-quitar" data-id="${p.id}">Quitar</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="6" class="center muted" style="padding:20px">Sin productos con estos filtros.</td></tr>`}
      </tbody></table></div>
      ${ed ? `<section class="card" style="margin-top:14px"><div class="card-head"><h2>Historial de cambios</h2><span class="sub">Quién actualizó la lista y cuándo</span></div>
        <ul class="timeline">${(db.catalogoLog || []).slice(0, 15).map(l => `<li><div class="t-date">${Util.fmtDate(l.fecha)}</div><div>${E(l.accion)}<div class="small muted">${E(l.usuarioId ? quien(l.usuarioId) : 'Sistema')}</div></div></li>`).join('')}</ul></section>` : ''}`;
    const inp = $('#cat-file');
    if (inp) inp.addEventListener('change', async () => {
      const f = inp.files[0];
      if (!f) return;
      try {
        toast('Leyendo la lista de precios en este navegador…');
        const r = ListaPrecios.interpretar(await ListaPrecios.leerArchivo(f));
        S.catImport = { r, archivo: f.name };
        abrirImportacion();
      } catch (e) { toast('No se pudo leer el archivo: ' + e.message); }
      inp.value = '';
    });
  };
  function abrirImportacion() {
    const { r, archivo } = S.catImport;
    modal({
      title: 'Importar lista de precios', wide: true,
      body: `<p style="margin-top:0"><strong>${E(archivo)}</strong> · ${r.items.length.toLocaleString('en-US')} productos con precio. El archivo se leyó en este navegador; no se envió a ningún servidor.</p>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Hoja</th><th>Marca</th><th class="r">Productos</th><th class="r">Omitidos sin precio</th></tr></thead><tbody>
        ${r.resumen.map(x => `<tr><td>${E(x.hoja)}</td><td>${E(x.marca)}</td><td class="r">${x.productos.toLocaleString('en-US')}</td><td class="r">${x.sinPrecio ? `<span class="chip warn">${x.sinPrecio}</span>` : 0}</td></tr>`).join('')}</tbody></table></div>
        <div class="stack" style="margin-top:12px">
          <label style="display:flex;gap:8px;cursor:pointer"><input type="radio" name="modo" value="reemplazar" checked><span><strong>Reemplazar las marcas del archivo</strong> — cada marca incluida queda exactamente como en el archivo (se quitan los productos que ya no figuran).</span></label>
          <label style="display:flex;gap:8px;cursor:pointer"><input type="radio" name="modo" value="completar"><span><strong>Solo agregar y actualizar precios</strong> — no se quita ningún producto.</span></label>
        </div>
        <p class="small muted">Las cotizaciones ya emitidas no cambian: guardan el precio con el que se cotizó.</p>`,
      actions: [{ label: 'Cancelar' }, { label: `${I('upload')} Importar`, cls: 'primary', onClick: async root => {
        const x = await Repo.importarCatalogo(r.items, val(root, 'modo'), S.user.id, archivo);
        S.catImport = null; S.catF = { q: '', marca: '' };
        toast(`Lista importada: ${x.agregados} nuevos, ${x.actualizados} actualizados, ${x.quitados} quitados.`); refresh();
      } }],
    });
  }
  function abrirProducto(id) {
    const p = id ? S.db.catalogo.find(x => x.id === id) : {};
    modal({
      title: id ? 'Editar producto' : 'Agregar producto',
      body: `<div class="form-grid">
        <label class="field"><span>Marca <span class="req">*</span></span><input type="text" name="marca" list="cat-marcas" value="${E(p.marca || '')}"><datalist id="cat-marcas">${marcasDisponibles().map(m => `<option value="${E(m)}">`).join('')}</datalist></label>
        <label class="field"><span>Código <span class="req">*</span></span><input type="text" name="codigo" value="${E(p.codigo || '')}"></label>
        <label class="field"><span>Precio de lista USD (sin IGV) <span class="req">*</span></span><input type="number" min="0" step="0.01" name="precio" value="${E(p.precio || '')}"></label></div>
        <label class="field" style="margin-top:12px">Descripción<textarea name="descripcion">${E(p.descripcion || '')}</textarea></label>`,
      actions: [{ label: 'Cancelar' }, { label: `${I('check')} Guardar`, cls: 'primary', onClick: async root => {
        await Repo.guardarProducto({ id: id || null, marca: val(root, 'marca'), codigo: val(root, 'codigo'), descripcion: val(root, 'descripcion'), precio: val(root, 'precio') }, S.user.id);
        toast(id ? 'Producto actualizado.' : 'Producto agregado a la lista.'); refresh();
      } }],
    });
  }
  ACTIONS['cat-importar'] = () => { const i = $('#cat-file'); if (i) i.click(); };
  ACTIONS['cat-producto'] = el => abrirProducto(el.dataset.id || null);
  ACTIONS['cat-quitar'] = el => {
    const p = S.db.catalogo.find(x => x.id === el.dataset.id);
    modal({ title: 'Quitar producto', body: `<p style="margin-top:0">¿Quitar <strong>${E(p.marca)} ${E(p.codigo)}</strong> de la lista de precios? Las cotizaciones ya emitidas no se afectan.</p>`,
      actions: [{ label: 'Cancelar' }, { label: 'Quitar', cls: 'bad', onClick: async () => {
        const x = await Repo.quitarProducto(p.id, S.user.id);
        toast(`${x.codigo} quitado de la lista.`, { undo: async () => { await Repo.guardarProducto(Object.assign({}, x, { id: null }), S.user.id); toast('Producto restaurado.'); refresh(); } });
        refresh();
      } }] });
  };
  ACTIONS['cat-marca'] = el => { S.catF.marca = S.catF.marca === el.dataset.m ? '' : el.dataset.m; render(true); };
  ACTIONS['cat-exportar'] = () => {
    const cell = v => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = '﻿' + ['Marca;Código;Descripción;Precio USD', ...S.db.catalogo.map(p => [p.marca, p.codigo, p.descripcion, p.precio].map(cell).join(';'))].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `lista_precios_${hoy()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Lista exportada (CSV reimportable). Es información confidencial.');
  };
  CHANGES['catf'] = el => { S.catF[el.name] = el.value; render(true); };
  let tCat = null;
  INPUTS['catf'] = el => { S.catF[el.name] = el.value; clearTimeout(tCat); tCat = setTimeout(async () => { const pos = el.selectionStart; await render(true); const n = $('[data-input="catf"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); };

  /* ---------- Arranque ---------- */
  let tResize = null;
  async function boot() {
    await Repo.init();
    SelfTest.run();
    window.addEventListener('hashchange', () => render());
    window.addEventListener('resize', () => { clearTimeout(tResize); tResize = setTimeout(drawCharts, 150); });
    await render();
  }
  return { boot, render, _state: S };
})();

UI.boot();
</script>
</body>
</html>
